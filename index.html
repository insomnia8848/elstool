<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾尔之光小工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    background: #1a1a2e;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }
  /* 舞台容器：固定高度 1000px，立绘图作为背景 */
  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 1000px;
    background: url('/KEmaster.png') left top / auto 1000px no-repeat;
  }
  header {
    position: absolute;
    top: 30px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    padding: 0 20px;
  }
  h1 {
    font-size: 2.3rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .note {
    font-size: 0.85rem;
    opacity: 0.85;
    font-weight: 300;
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: inline-block;
  }
  .grid {
    position: absolute;
    bottom: 20px;
    left: 290px;
    right: 210px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 5;
  }
  .card {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 14px;
    padding: 16px 22px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  /* 沿立绘右边缘斜向排列：从上到下依次向左收回，底部贴齐立绘边缘 */
  .card:nth-child(1) { margin-left: 144px; }
  .card:nth-child(2) { margin-left: 108px; }
  .card:nth-child(3) { margin-left: 72px; }
  .card:nth-child(4) { margin-left: 36px; }
  .card:nth-child(5) { margin-left: 0; }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #ffd700, #ff8c00);
    opacity: 0.85;
  }
  .card:hover {
    transform: translateY(-6px) scale(1.03);
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .icon img {
    width: 2.4rem;
    height: 2.4rem;
    object-fit: contain;
    display: block;
    background: transparent;
  }
  .card-title {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* 移动端：改为居中布局，不使用斜向排列 */
  @media (max-width: 768px) {
    body { padding: 0; }
    .stage {
      max-width: 100%;
      height: auto;
      min-height: 100vh;
      background: url('/KEmaster.png') center top / cover no-repeat fixed;
    }
    header {
      position: static;
      padding: 30px 20px 10px;
      text-align: center;
    }
    .grid {
      position: static;
      padding: 10px 20px 40px;
      gap: 14px;
    }
    .card:nth-child(n) { margin-left: 0; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>
  <div class="stage">
    <header>
      <h1>艾尔之光小工具</h1>
      <p class="note">纯前端实现，所有数据均保存于浏览器本地</p>
    </header>
    <main class="grid">
      <a class="card" href="/undead_dragon_weapon/">
        <div class="icon"><img src="/undeaddragon.png" alt="死龙模拟器"></div>
        <div class="card-title">死龙模拟器</div>
      </a>
      <a class="card" href="/undead_dragon_weapon_score/">
        <div class="icon"><img src="/undeaddragon.png" alt="死龙分值计算器"></div>
        <div class="card-title">死龙分值计算器</div>
      </a>
      <a class="card" href="/team_break/">
        <div class="icon"><img src="/armorbreak.png" alt="破防计算器"></div>
        <div class="card-title">破防计算器</div>
      </a>
      <a class="card" href="/weekly/">
        <div class="icon"><img src="/yincang.png" alt="周常记录"></div>
        <div class="card-title">周常记录</div>
      </a>
      <a class="card" href="/ice_burner/">
        <div class="icon"><img src="/iceburner.png" alt="冰装模拟器"></div>
        <div class="card-title">冰装模拟器</div>
      </a>
    </main>
  </div>
</body>
</html>
