<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>死龙模拟器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1e24;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e3e6eb;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: #252b34;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #3f4a57;
        }

        /* 左右双栏布局 */
        .split-panel {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: stretch;     /* 保证两侧高度相等 */
        }

        .panel {
            flex: 1 1 400px;
            min-width: 320px;
            padding: 28px 24px;
            background: #2d343e;
            display: flex;
            flex-direction: column;   /* 内部子元素可 flex 撑高 */
        }

        .panel.left {
            border-right: 1px solid #404b58;
        }

        .panel.right {
            background: #2a313b;
            overflow: hidden;     /* 防止内容溢出 panel 边界 */
            min-height: 0;        /* 允许在 stretch 时被压缩，让内部 body 滚动 */
        }

        .panel h2 {
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border-left: 6px solid #c99c47;
            padding-left: 18px;
            color: #f0e9db;
        }

        /* 左侧模拟器区域 */
        .simulator-box {
            display: flex;
            flex-direction: column;
            gap: 22px;
            flex: 1 1 auto;   /* 占据 panel 剩余高度，与右侧表格对齐 */
        }

        .result-lines {
            background: #1f262e;
            border-radius: 24px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #495765;
            min-height: 200px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .primary-btn {
            background: #1e90ff;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 48px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f4f8a;
            transition: 0.1s ease;
            letter-spacing: 2px;
            width: 100%;
            text-transform: uppercase;
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f4f8a;
        }

        .dual-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .auto-btn {
            flex: 1 1 120px;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 8px;
            border-radius: 48px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            transition: 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auto-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        .usable-btn {
            background: #ff7b72;
        }

        .graduate-btn {
            background: #b22222;
        }

        .super-graduate-btn {
            background: #ffb347;
        }

        /* 一键变换 + 停止变换 双按钮行 */
        .auto-main-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .auto-main-btn {
            flex: 1 1 150px;
            background: #1e90ff;
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 14px 10px;
            border-radius: 48px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f4f8a;
            transition: 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auto-main-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f4f8a;
        }

        .auto-main-btn:disabled {
            background: #5a6472;
            box-shadow: 0 4px 0 #3b414b;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .stop-btn {
            background: #e74c3c;
            box-shadow: 0 4px 0 #8b2a20;
        }

        .stop-btn:active {
            box-shadow: 0 1px 0 #8b2a20;
        }

        .stop-btn:disabled {
            background: #7a524d;
            box-shadow: 0 4px 0 #4a3430;
        }

        /* 右侧：目标分值勾选行（独立条件，不占用目标效果数量） */
        .target-score-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1b222a;
            border-radius: 60px;
            padding: 12px 22px;
            border: 1px solid #4d5b6b;
            margin-top: 14px;
        }

        .target-score-check-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .target-score-check-wrap input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #1e90ff;
        }

        .target-label {
            font-size: 1.1rem;
            color: #c0ccda;
            white-space: nowrap;
            margin-right: 10px;
        }

        .target-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .target-btn {
            background: #4b5565;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .target-btn:hover {
            background: #606c7e;
        }

        .target-btn:active {
            transform: scale(0.95);
        }

        .target-btn:disabled {
            background: #3b414b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .target-input {
            width: 70px;
            background: #2e3c4e;
            border: 1px solid #6d829b;
            color: #eef3fc;
            font-size: 1.2rem;
            padding: 6px 10px;
            border-radius: 40px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
            font-weight: 600;
        }

        .target-input::-webkit-outer-spin-button,
        .target-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .target-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .line-item {
            font-size: 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            background: #2e3844;
            padding: 10px 16px;
            border-radius: 40px;
            border-left: 4px solid #b68b5c;
            box-shadow: inset 0 2px 5px #0f1216;
        }

        .light-red {
            color: #ff7b72;
            font-weight: 600;
            border-left-color: #ff4d4d;
        }

        .deep-red {
            color: #b22222;
            font-weight: 700;
            border-left-color: #8b0000;
        }

        .yellow-highlight {
            color: #f5e56b;
            font-weight: 600;
            border-left-color: #e6b800;
        }

        .empty-placeholder {
            color: #7a879b;
            font-style: italic;
            text-align: center;
            padding: 28px 0;
            font-size: 1.1rem;
        }

        /* 总分 + 上限分 同行显示 */
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #1b222a;
            border-radius: 60px;
            padding: 12px 22px;
            border: 1px solid #4d5b6b;
            margin-bottom: 12px;
        }

        .score-badge {
            background: #2a5f7a;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.6rem;
            color: #f5e7c8;
            display: inline-block;
        }

        /* 上限分徽章：用偏暖色区分（金棕色），表示「最高档总分」 */
        .max-score-badge {
            background: #5a3f1a;
            color: #f5d8a0;
        }

        /* ED消费与R消费同行 */
        .cost-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #1b222a;
            border-radius: 60px;
            padding: 12px 22px;
            border: 1px solid #4d5b6b;
            margin-bottom: 12px;
        }

        .cost-display {
            background: #2e3c4e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #b3e0b0;
        }

        .r-cost-display {
            background: #3a4a5a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #f5e56b;
        }

        .approx-display {
            background: #2d3844;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 1.1rem;
            color: #d8e0ec;
            white-space: nowrap;
        }

        /* 清空按钮行：清空ED消费 + 清空累计条 */
        .clear-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .clear-cost-btn {
            background: #4b5565;
            border: none;
            color: #efefef;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid #6d7e94;
        }

        .clear-cost-btn:hover {
            background: #606c7e;
        }

        /* 价格调节栏 */
        .price-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1b222a;
            border-radius: 60px;
            padding: 12px 22px;
            border: 1px solid #4d5b6b;
            margin-bottom: 12px;
        }

        .price-label {
            font-size: 1.1rem;
            color: #c0ccda;
            white-space: nowrap;
        }

        .price-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-input {
            width: 80px;
            background: #2e3c4e;
            border: 1px solid #6d829b;
            color: #eef3fc;
            font-size: 1.2rem;
            padding: 8px 12px;
            border-radius: 40px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .price-input::-webkit-outer-spin-button,
        .price-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 价格按钮：±1 / ±0.1 共4个 */
        .price-btn {
            background: #4b5565;
            border: none;
            color: white;
            min-width: 48px;
            height: 40px;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .price-btn:hover {
            background: #606c7e;
        }

        .price-btn:active {
            transform: scale(0.95);
        }

        /* 统计面板 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #1b222a;
            border-radius: 24px;
            padding: 18px 22px;
            border: 1px solid #4d5b6b;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d3844;
            padding: 8px 16px;
            border-radius: 40px;
        }

        .stat-label {
            color: #b0c0d0;
            font-size: 0.95rem;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f5e7c8;
        }

        /* === 右侧：自动变换设定 === */

        /* 目标效果数量选择栏 */
        .target-count-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1b222a;
            border-radius: 60px;
            padding: 12px 22px;
            border: 1px solid #4d5b6b;
            margin-bottom: 14px;
        }

        .count-select {
            background: #1e2936;
            color: #eef3fc;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 8px 36px 8px 14px;
            border-radius: 40px;
            border: 1px solid #6d829b;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23c0ccda' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            min-width: 80px;
            text-align: center;
        }

        /* 效果设定表格容器：可滚动 */
        .effect-table-wrapper {
            background: #1f262e;
            border-radius: 20px;
            border: 1px solid #495765;
            display: flex;
            flex-direction: column;
            flex: 1 1 0;              /* 不主动撑高 panel.right，仅占据剩余空间 */
            min-height: 0;            /* 允许 flex 收缩 → 让内部 body 滚动 */
            overflow: hidden;
        }

        .effect-table-header {
            display: grid;
            grid-template-columns: 1fr 1fr 60px;
            gap: 8px;
            padding: 10px 16px;
            background: #2d3844;
            font-weight: 600;
            font-size: 0.95rem;
            color: #c0ccda;
            border-bottom: 1px solid #495765;
        }

        .effect-table-header .col-value,
        .effect-table-header .col-check {
            text-align: center;
        }

        .effect-table-body {
            overflow-y: auto;          /* 内容超出时滚动 */
            flex: 1 1 0;
            min-height: 0;            /* 允许在 flex 容器内收缩，使 overflow-y 生效 */
            padding: 6px 8px 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: thin;
            scrollbar-color: #6d829b #1f262e;
        }

        /* WebKit 滚动条样式 */
        .effect-table-body::-webkit-scrollbar {
            width: 8px;
        }
        .effect-table-body::-webkit-scrollbar-track {
            background: #1f262e;
            border-radius: 8px;
        }
        .effect-table-body::-webkit-scrollbar-thumb {
            background: #6d829b;
            border-radius: 8px;
        }
        .effect-table-body::-webkit-scrollbar-thumb:hover {
            background: #8aa0b8;
        }

        /* 每行效果：grid 3 列对齐表头 */
        .effect-row {
            display: grid;
            grid-template-columns: 1fr 1fr 60px;
            gap: 8px;
            align-items: center;
            background: #2e3844;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #4e6072;
        }

        .effect-row .eff-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e3dccb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .effect-row .eff-value-select {
            background: #1e2936;
            color: #eef3fc;
            font-size: 0.9rem;
            padding: 6px 24px 6px 10px;
            border-radius: 20px;
            border: 1px solid #6d829b;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23c0ccda' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 12px;
            text-align: center;
            width: 100%;
        }

        /* 复选框容器 */
        .effect-row .eff-check-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .effect-row input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #1e90ff;
        }

        /* 底部清空按钮（已删除条件说明文字） */
        .effect-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 14px;
            background: #1b222a;
            border-radius: 40px;
            padding: 10px 18px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #555e6b;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #8799b0;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: #6e7b8d;
        }

        @media (max-width: 750px) {
            .panel.left {
                border-right: none;
                border-bottom: 1px solid #404b58;
            }
            .dual-buttons,
            .auto-main-buttons {
                flex-direction: column;
            }
            .auto-btn,
            .auto-main-btn {
                width: 100%;
            }
            .price-control,
            .target-score-bar,
            .target-count-bar,
            .effect-footer {
                flex-wrap: wrap;
                gap: 10px;
            }
            .effect-table-header,
            .effect-row {
                grid-template-columns: 1.5fr 1fr 50px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="split-panel">
        <!-- 左侧：死龙变换模拟器 -->
        <div class="panel left">
            <h2>⚡ 死龙变换模拟器</h2>
            <div class="simulator-box">
                <div class="result-lines" id="resultLines">
                    <div class="empty-placeholder">点击 [效果变换] 开始洗练</div>
                </div>

                <!-- 按钮组：效果变换 + 一键变换 + 停止变换 -->
                <div class="button-group">
                    <button class="primary-btn" id="transformBtn">效 果 变 换</button>
                    <div class="auto-main-buttons">
                        <button class="auto-main-btn" id="autoTransformBtn">一 键 变 换</button>
                        <button class="auto-main-btn stop-btn" id="stopAutoBtn" disabled>停 止 变 换</button>
                    </div>
                </div>

                <!-- 总分 + 上限分 同行显示 -->
                <div class="score-row">
                    <span class="score-badge" id="leftTotalScore">总分: 0</span>
                    <span class="score-badge max-score-badge" id="leftMaxScore">上限分: 0</span>
                </div>

                <!-- ED消费与R消费同行 + 近似物品 -->
                <div class="cost-row">
                    <span class="cost-display" id="costDisplay">0 ED</span>
                    <span class="r-cost-display" id="rCostDisplay">≈ 0 R</span>
                    <span class="approx-display" id="approxDisplay">约等于一个 ???</span>
                </div>

                <!-- 价格调节栏：[−1][−0.1][输入框][+0.1][+1] -->
                <div class="price-control">
                    <span class="price-label">当前一亿价格</span>
                    <div class="price-input-group">
                        <button class="price-btn" id="priceMinus1" title="减1">−1</button>
                        <button class="price-btn" id="priceMinus01" title="减0.1">−0.1</button>
                        <input type="number" id="priceInput" class="price-input" value="10" min="0" step="0.1">
                        <button class="price-btn" id="pricePlus01" title="加0.1">+0.1</button>
                        <button class="price-btn" id="pricePlus1" title="加1">+1</button>
                    </div>
                    <span>R/亿</span>
                </div>

                <!-- 统计面板 -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">累计次数</span>
                        <span class="stat-value" id="statCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均分</span>
                        <span class="stat-value" id="statAvg">0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">65+ 次数</span>
                        <span class="stat-value" id="stat65">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">70+ 次数</span>
                        <span class="stat-value" id="stat70">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">80+ 次数</span>
                        <span class="stat-value" id="stat80">0</span>
                    </div>
                </div>

                <!-- 清空按钮行：移到最下方 -->
                <div class="clear-row">
                    <button class="clear-cost-btn" id="clearCostBtn">清空ED消费</button>
                    <button class="clear-cost-btn" id="clearStatsBtn" title="清空累计次数/平均分/65+/70+/80+">清空累计条</button>
                </div>
            </div>
        </div>

        <!-- 右侧：自动变换设定（来自游戏内变换条件面板） -->
        <div class="panel right">
            <h2>⚙️ 自动变换设定</h2>

            <!-- 目标效果数量 -->
            <div class="target-count-bar">
                <span class="target-label">目标效果数量</span>
                <select id="targetEffectCount" class="count-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                </select>
            </div>

            <!-- 目标效果设定表格（可滚动） -->
            <div class="effect-table-wrapper">
                <div class="effect-table-header">

</div>

<script>
    (function() {
        // --------------------------------------------------------------
        // 全部词条定义 (同前，防御类分值全0)
        const allStats = [
            // 带*词条 (5个)
            { name: '攻击力百分比*强化等级', star: true, values: [1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 0.9, 0.8].map(v => v + '%'), scores: [29,27,24,23,21,20,18,15] },

            { name: '攻击力等级', star: false, values: [13,12,11,10,9,8,7,6].map(v => v.toString()), scores: [14,13,11,10,8,7,5,4] },

            { name: '无视敌人防御力', star: false, values: [8.0,7.5,7.0,6.5,6.0,5.5,5.0,4.5].map(v => v.toFixed(1) + '%'), scores: [3,2,1,0,0,0,0,0] },
            { name: '防御力', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [0,0,0,0,0,0,0,0] },
            { name: '减伤', star: false, values: [12,11,10,9,8,7,6,5].map(v => v + '%'), scores: [0,0,0,0,0,0,0,0] },
            { name: '王减', star: false, values: [15,14,13,12,11,10,9,8].map(v => v + '%'), scores: [0,0,0,0,0,0,0,0] },
            { name: '强韧技伤', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [0,0,0,0,0,0,0,0] },
            { name: '动作速度', star: false, values: [12,11,10,9,8,7,6,5].map(v => v + '%'), scores: [4,3,3,3,1,0,0,0] }
        ];

        // 有分数的15个属性名（用于右侧效果表 + 左侧结果高亮）
        const scoredAttrNames = [
            '攻击力百分比*强化等级',
            '攻击力等级*强化等级',
            '所有技能伤害*强化等级',
            '暴击伤害*强化等级',
            '攻击力百分比',
            '攻击力等级',
            '流血',
            '两极化',
            '超越技伤',
            '强烈技伤',
            '所有技能伤害',
            '爆伤',
            '王伤',
            '无视敌人防御力',
            '动作速度'
        ];

        // 高亮规则（左侧洗练结果显示用）
        const specialShadeNames = [
            '攻击力百分比*强化等级',
            '攻击力等级*强化等级',
            '所有技能伤害*强化等级',
            '暴击伤害*强化等级',
            '攻击力百分比',
            '所有技能伤害',
            '流血',
            '两极化'
        ];

        const yellowNames = ['无视敌人防御力', '动作速度'];

        // 右侧效果设定表使用的15条（有分数的词条）
        const scoredStats = allStats.filter(s => scoredAttrNames.includes(s.name));

        // --------------------------------------------------------------
        // localStorage 键名
        const PRICE_STORAGE_KEY = 'AbyssPricePerYi';

        // 左侧状态
        let totalSpend = 0;            // 万ED
        const COST_PER_CLICK = 2000;
        let pricePerHundredMillion = 10; // 默认10元/亿，初始化时从 localStorage 读取
        let autoInterval = null;
        let targetScore = 65;          // 一键变换目标分值（条件 C）
        let maxScore = 100;            // 一键变换上限分阈值（条件 D），默认 100
        let lastBatchResult = null;    // 极速洗练中最后一次计算结果（停止时渲染）

        // 统计变量
        let totalDraws = 0;
        let totalScoreSum = 0;
        let count65 = 0;
        let count70 = 0;
        let count80 = 0;

        // 物品列表
        const items = [
            { name: '+9强化券', price: 10 },
            { name: '+10强化券', price: 100 },
            { name: '爆10戒指', price: 300 },
            { name: '+11强化券', price: 500 },
            { name: '一套当季冰', price: 800 },
            { name: '好几张+11', price: 2000 },
            { name: '一套平民毕业左四', price: 3000 },
            { name: '+12强化券', price: 5500 },
            { name: '普通毕业号', price: 9000 },
            { name: '小衣柜毕业号', price: 15000 },
            { name: '超大衣柜毕业号', price: 25000 },
            { name: '超顶级毕业弃坑号', price: 70000 },
            { name: '+13强化券', price: 100000 },
            { name: '搬空国服大部分ED储备', price: 300000 },
            { name: '搬空国服几乎全部ED储备', price: 600000 }
        ];

        // --------------------------------------------------------------
        // DOM 引用
        const transformBtn = document.getElementById('transformBtn');
        const resultLinesDiv = document.getElementById('resultLines');
        const leftTotalScoreSpan = document.getElementById('leftTotalScore');
        const leftMaxScoreSpan = document.getElementById('leftMaxScore');
        const costDisplay = document.getElementById('costDisplay');
        const rCostDisplay = document.getElementById('rCostDisplay');
        const approxDisplay = document.getElementById('approxDisplay');
        const clearCostBtn = document.getElementById('clearCostBtn');
        const clearStatsBtn = document.getElementById('clearStatsBtn');

        const autoTransformBtn = document.getElementById('autoTransformBtn');
        const stopAutoBtn = document.getElementById('stopAutoBtn');

        const targetScoreInput = document.getElementById('targetScoreInput');
        const targetMinus = document.getElementById('targetMinus');
        const targetPlus = document.getElementById('targetPlus');
        const targetScoreCheckbox = document.getElementById('targetScoreCheckbox');

        // 上限分阈值（条件 D）：勾选后，本次洗出的上限分 ≥ 设定值才算满足
        const maxScoreInput = document.getElementById('maxScoreInput');
        const maxScoreMinus = document.getElementById('maxScoreMinus');
        const maxScorePlus = document.getElementById('maxScorePlus');
        const maxScoreCheckbox = document.getElementById('maxScoreCheckbox');

        // 价格按钮：±1 / ±0.1 共4个
        const priceInput = document.getElementById('priceInput');
        const priceMinus1 = document.getElementById('priceMinus1');
        const priceMinus01 = document.getElementById('priceMinus01');
        const pricePlus01 = document.getElementById('pricePlus01');
        const pricePlus1 = document.getElementById('pricePlus1');

        // 统计显示元素
        const statCount = document.getElementById('statCount');
        const statAvg = document.getElementById('statAvg');
        const stat65 = document.getElementById('stat65');
        const stat70 = document.getElementById('stat70');
        const stat80 = document.getElementById('stat80');

        // 右侧：自动变换设定
        const targetEffectCountSelect = document.getElementById('targetEffectCount');
        const effectTableBody = document.getElementById('effectTableBody');
        const clearEffectSettingsBtn = document.getElementById('clearEffectSettings');

        // 右侧效果设定行的运行时数据：每行 { stat, valueSelect, checkbox }
        // valueSelect.value 是 tier 字符串 '0'~'7'，'' 表示未选
        let effectRows = [];

        // --------------------------------------------------------------
        // 更新统计显示
        function updateStats() {
            statCount.textContent = totalDraws;
            const avg = totalDraws > 0 ? (totalScoreSum / totalDraws).toFixed(2) : '0.00';
            statAvg.textContent = avg;
            stat65.textContent = count65;
            stat70.textContent = count70;
            stat80.textContent = count80;
        }

        // 工具函数：根据R金额获取最接近的物品
        function getClosestItem(rAmount) {
            if (rAmount < 0) return items[0];
            let bestItem = items[0];
            let bestDiff = Math.abs(rAmount - items[0].price);
            for (let i = 1; i < items.length; i++) {
                const diff = Math.abs(rAmount - items[i].price);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestItem = items[i];
                } else if (diff === bestDiff && items[i].price > bestItem.price) {
                    bestItem = items[i];
                }
            }
            return bestItem;
        }

        function updateRCost() {
            const rCost = (totalSpend / 10000) * pricePerHundredMillion;
            const rounded = rCost.toFixed(2);
            rCostDisplay.textContent = `≈ ${rounded} R`;
            const item = getClosestItem(rCost);
            approxDisplay.textContent = `≈ ${item.name}`;
        }

        function updateCostDisplay() {
            costDisplay.textContent = formatCost(totalSpend);
            updateRCost();
        }

        function formatCost(tenThousand) {
            if (tenThousand === 0) return '0 ED';
            const hundredMillion = Math.floor(tenThousand / 10000);
            const remainder = tenThousand % 10000;
            const tenMillion = Math.floor(remainder / 1000);
            if (hundredMillion > 0) {
                if (tenMillion > 0) return `${hundredMillion}亿${tenMillion}千万ED`;
                return `${hundredMillion}亿ED`;
            } else {
                return `${tenMillion}千万ED`;
            }
        }

        // --------------------------------------------------------------
        // 目标分值勾选联动：根据勾选状态 + 运行状态决定 input/button 的禁用
        //   未勾选：input/button 永远禁用（条件 C 不启用）
        //   已勾选 + 未运行：input/button 可用
        //   已勾选 + 运行中：input/button 禁用（避免洗练中改条件）
        function updateTargetScoreDisabled(running) {
            const disabled = running || !targetScoreCheckbox.checked;
            targetScoreInput.disabled = disabled;
            targetMinus.disabled = disabled;
            targetPlus.disabled = disabled;
        }

        // 上限分勾选联动：逻辑同目标分值
        function updateMaxScoreDisabled(running) {
            const disabled = running || !maxScoreCheckbox.checked;
            maxScoreInput.disabled = disabled;
            maxScoreMinus.disabled = disabled;
            maxScorePlus.disabled = disabled;
        }

        // --------------------------------------------------------------
        // 锁定/解锁 UI：一键变换运行中，锁定目标分值栏 + 上限分栏 + 一键变换按钮 + 右侧设定表
        function setAutoRunningUI(running) {
            autoTransformBtn.disabled = running;
            transformBtn.disabled = running; // 单次变换也锁定，避免和自动冲突
            stopAutoBtn.disabled = !running;
            // 目标分值栏：运行时锁定勾选框 + 联动 input/button
            targetScoreCheckbox.disabled = running;
            updateTargetScoreDisabled(running);
            // 上限分栏：运行时锁定勾选框 + 联动 input/button
            maxScoreCheckbox.disabled = running;
            updateMaxScoreDisabled(running);
            // 右侧效果设定表：运行时锁定（避免洗练中改条件）
            targetEffectCountSelect.disabled = running;
            effectRows.forEach(row => {
                row.valueSelect.disabled = running;
                row.checkbox.disabled = running;
            });
            clearEffectSettingsBtn.disabled = running;
        }

        // --------------------------------------------------------------
        // 批量极速模式常量
        const BATCH_SIZE = 5000;           // 每帧跑多少次纯计算
        const MAX_BATCH_TOTAL = 50000000;  // 安全上限：5000万次后强制停止

        function stopAuto() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
            }
            setAutoRunningUI(false);

            // 如果是极速洗练被手动停止，渲染最后一次结果
            if (lastBatchResult) {
                renderTransformResult(lastBatchResult.drawItems, lastBatchResult.totalScore);
                lastBatchResult = null;
            }
        }

        // --------------------------------------------------------------
        // 读取右侧效果设定的停止条件快照
        // 返回 { targetCount, checks: [{ name, setTier }] }
        //   - setTier 为 0~7 表示用户选定的数值档位；-1 表示未选数值（不计入条件B）
        //   - checks 只包含 checkbox 勾选的行
        function getEffectConditionSnapshot() {
            const targetCount = parseInt(targetEffectCountSelect.value, 10) || 1;
            const checks = [];
            effectRows.forEach(row => {
                if (!row.checkbox.checked) return;
                const tierStr = row.valueSelect.value;
                const setTier = tierStr === '' ? -1 : parseInt(tierStr, 10);
                checks.push({ name: row.stat.name, setTier });
            });
            return { targetCount, checks };
        }

        // --------------------------------------------------------------
        // 检查本次洗练结果是否满足所有启用的停止条件（AND 关系）
        //   条件 M（合并 A+B）：勾选效果中「出现且数值 ≥ 设定数值」的数量 ≥ targetCount
        //     - 数值越大 tier 越小，drawTier <= setTier 表示抽到的数值 ≥ 设定数值
        //     - setTier = -1（未设数值）时视为任意数值都满足（只看出现就通过）
        //     - targetCount 仅约束勾选效果的种类数量，不影响目标分值/上限分
        //   条件 C：总分 >= minScore（未勾选目标分值时 minScore=Infinity，视为通过）
        //   条件 D：本次洗出的上限分 >= maxScoreThreshold（未勾选上限分时 = Infinity，视为通过）
        //     - 上限分 = 抽出的4条词条各自最高档(tier 0)分值之和
        //   - 三者都未启用时永不停止（等待手动停止或安全上限）
        //   - 启用任一条件时该条件必须满足，全部启用时必须同时满足
        function checkStopConditions(drawItems, totalScore, minScore, snapshot, maxScoreThreshold) {
            const hasTargetScore = (minScore !== Infinity);                 // 是否勾选目标分值
            const hasMaxScore = (maxScoreThreshold !== Infinity);           // 是否勾选上限分
            const hasEffectChecks = !!(snapshot && snapshot.checks.length); // 是否勾选任何效果

            // 三者都未启用 → 永不停止（等待手动停止或安全上限）
            if (!hasTargetScore && !hasMaxScore && !hasEffectChecks) return false;

            // 条件 C：勾选时必须满足
            if (hasTargetScore && totalScore < minScore) return false;

            // 条件 D：勾选上限分时必须满足（本次洗出的上限分 ≥ 设定值）
            if (hasMaxScore) {
                const maxTotalScore = drawItems.reduce((acc, cur) => acc + (cur.maxScore || 0), 0);
                if (maxTotalScore < maxScoreThreshold) return false;
            }

            // 条件 M：勾选效果时必须满足
            if (hasEffectChecks) {
                // 收集本次抽到的效果：name -> drawTier
                const drawMap = new Map();
                drawItems.forEach(item => {
                    // 同名只可能出现一次（4条不重复抽取）
                    drawMap.set(item.name, item.tier);
                });

                let satisfiedCount = 0;  // 勾选、出现、且 数值 ≥ 设定数值 的数量
                snapshot.checks.forEach(c => {
                    const drawTier = drawMap.get(c.name);
                    if (drawTier === undefined) return;             // 没出现
                    // setTier = -1 时任意数值都算；否则需 drawTier <= setTier
                    if (c.setTier < 0 || drawTier <= c.setTier) satisfiedCount++;
                });

                // 出现且数值达标的勾选效果数量 必须 ≥ 目标效果数量
                if (satisfiedCount < snapshot.targetCount) return false;
            }

            // 所有启用的条件都满足
            return true;
        }

        // --------------------------------------------------------------
        // 极速批量洗练：每帧跑 BATCH_SIZE 次纯计算，达标后渲染最终结果
        // 比旧版快约 1000 倍（旧版 33次/秒 → 新版约 50000+次/秒）
        // 停止条件：M(出现且数值≥设定的勾选效果数 ≥ 目标数量) AND C(勾选时总分≥minScore) AND D(勾选时上限分≥maxScoreThreshold)
        function startAuto(minScore, maxScoreThreshold) {
            stopAuto();
            setAutoRunningUI(true);

            let batchAttempts = 0;        // 本轮自动洗练已尝试次数

            // 启动时拍一张条件快照（运行期间不改条件，避免每帧重读 DOM）
            const snapshot = getEffectConditionSnapshot();

            // 进度提示
            resultLinesDiv.innerHTML = `<div class="empty-placeholder">⚡ 极速洗练中... 已尝试 0 次</div>`;
            leftTotalScoreSpan.textContent = `总分: --`;
            leftMaxScoreSpan.textContent = `上限分: --`;
            lastBatchResult = null;

            autoInterval = setInterval(() => {
                for (let i = 0; i < BATCH_SIZE; i++) {
                    lastBatchResult = performTransformSilent();
                    batchAttempts++;

                    // 所有启用的停止条件满足 → 渲染并停止
                    if (checkStopConditions(lastBatchResult.drawItems, lastBatchResult.totalScore, minScore, snapshot, maxScoreThreshold)) {
                        renderTransformResult(lastBatchResult.drawItems, lastBatchResult.totalScore);
                        lastBatchResult = null;
                        stopAuto();
                        return;
                    }

                    // 安全上限：防止极端情况下无限循环
                    if (batchAttempts >= MAX_BATCH_TOTAL) {
                        renderTransformResult(lastBatchResult.drawItems, lastBatchResult.totalScore);
                        lastBatchResult = null;
                        stopAuto();
                        return;
                    }
                }

                // 每帧更新一次进度
                leftTotalScoreSpan.textContent = `已尝试 ${batchAttempts.toLocaleString()} 次`;
                updateCostDisplay();
                updateStats();
            }, 0);
        }

        // --------------------------------------------------------------
        // 目标分值栏：数值校验 + -1/+1 按钮
        function setTargetScore(value) {
            if (isNaN(value)) value = 0;
            if (value < 0) value = 0;
            if (value > 100) value = 100;
            targetScore = Math.round(value);
            targetScoreInput.value = targetScore;
        }

        targetScoreInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) val = 0;
            setTargetScore(val);
        });

        targetMinus.addEventListener('click', () => {
            setTargetScore(targetScore - 1);
        });

        targetPlus.addEventListener('click', () => {
            setTargetScore(targetScore + 1);
        });

        // 目标分值勾选联动：勾选时启用输入框/按钮，取消勾选时禁用
        targetScoreCheckbox.addEventListener('change', () => updateTargetScoreDisabled(false));
        // 初始化：未勾选时禁用 input/button
        updateTargetScoreDisabled(false);

        // --------------------------------------------------------------
        // 上限分栏：数值校验 + -1/+1 按钮（逻辑同目标分值，范围 0~120）
        function setMaxScore(value) {
            if (isNaN(value)) value = 0;
            if (value < 0) value = 0;
            if (value > 120) value = 120;
            maxScore = Math.round(value);
            maxScoreInput.value = maxScore;
        }

        maxScoreInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) val = 0;
            setMaxScore(val);
        });

        maxScoreMinus.addEventListener('click', () => {
            setMaxScore(maxScore - 1);
        });

        maxScorePlus.addEventListener('click', () => {
            setMaxScore(maxScore + 1);
        });

        // 上限分勾选联动：勾选时启用输入框/按钮，取消勾选时禁用
        maxScoreCheckbox.addEventListener('change', () => updateMaxScoreDisabled(false));
        // 初始化：未勾选时禁用 input/button
        updateMaxScoreDisabled(false);

        // --------------------------------------------------------------
        // 清空ED消费（仅清消费总额）
        clearCostBtn.addEventListener('click', () => {
            totalSpend = 0;
            updateCostDisplay();
        });

        // 清空累计条（清累计次数/平均分/65+/70+/80+，不动消费）
        clearStatsBtn.addEventListener('click', () => {
            totalDraws = 0;
            totalScoreSum = 0;
            count65 = 0;
            count70 = 0;
            count80 = 0;
            updateStats();
        });

        // --------------------------------------------------------------
        // 当前一亿价格：localStorage 持久化 + 0.1 步进 + ±1/±0.1 按钮
        function loadPriceFromStorage() {
            let saved = null;
            try {
                saved = localStorage.getItem(PRICE_STORAGE_KEY);
            } catch (e) {
                // 隐私模式或禁用 localStorage 时静默退回默认值
            }
            if (saved !== null) {
                const val = parseFloat(saved);
                if (!isNaN(val) && val >= 0) return Math.round(val * 10) / 10; // 保留1位小数
            }
            return 10; // 默认 10 元/亿
        }

        function savePriceToStorage(value) {
            try {
                localStorage.setItem(PRICE_STORAGE_KEY, String(value));
            } catch (e) {
                // 忽略写入失败
            }
        }

        function setPrice(value) {
            if (isNaN(value) || value < 0) value = 0;
            // 0.1 步进：四舍五入到1位小数
            const rounded = Math.round(value * 10) / 10;
            pricePerHundredMillion = rounded;
            priceInput.value = rounded;
            savePriceToStorage(rounded);
            updateRCost();
        }

        priceInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val) || val < 0) val = 0;
            setPrice(val);
        });

        priceMinus1.addEventListener('click', () => {
            setPrice(pricePerHundredMillion - 1);
        });

        priceMinus01.addEventListener('click', () => {
            setPrice(pricePerHundredMillion - 0.1);
        });

        pricePlus01.addEventListener('click', () => {
            setPrice(pricePerHundredMillion + 0.1);
        });

        pricePlus1.addEventListener('click', () => {
            setPrice(pricePerHundredMillion + 1);
        });

        // --------------------------------------------------------------
        // 随机抽取词条（带权重，star 词条权重低）
        function pickRandomStat(candidates) {
            const totalWeight = candidates.reduce((sum, c) => sum + (c.star ? 0.8 : 6.4), 0);
            let r = Math.random() * totalWeight;
            for (let i = 0; i < candidates.length; i++) {
                const w = candidates[i].star ? 0.8 : 6.4;
                if (r < w) return candidates[i];
                r -= w;
            }
            return candidates[candidates.length - 1];
        }

        // --------------------------------------------------------------
        // 渲染函数：把洗练结果画到页面上
        function renderTransformResult(drawItems, totalScore) {
            if (drawItems.length === 0) {
                resultLinesDiv.innerHTML = `<div class="empty-placeholder">抽取异常，请重试</div>`;
            } else {
                let htmlStr = '';
                drawItems.forEach(item => {
                    let colorClass = '';
                    if (yellowNames.includes(item.name)) {
                        colorClass = 'yellow-highlight';
                    } else if (specialShadeNames.includes(item.name)) {
                        if (item.tier < 4) {
                            colorClass = 'deep-red';
                        } else {
                            colorClass = 'light-red';
                        }
                    } else if (scoredAttrNames.includes(item.name)) {
                        colorClass = 'light-red';
                    }
                    const classAttr = colorClass ? ` class="line-item ${colorClass}"` : ` class="line-item"`;
                    htmlStr += `<div${classAttr}>【${item.name}】 ${item.valueStr}</div>`;
                });
                resultLinesDiv.innerHTML = htmlStr;
            }
            leftTotalScoreSpan.textContent = `总分: ${totalScore}`;
            // 上限分 = 当前抽出的4条词条各自最高档（tier 0）分值之和
            const maxTotalScore = drawItems.reduce((acc, cur) => acc + (cur.maxScore || 0), 0);
            leftMaxScoreSpan.textContent = `上限分: ${maxTotalScore}`;
            updateCostDisplay();
            updateStats();
        }

        // --------------------------------------------------------------
        // 极速版洗练：只做纯计算，不碰 DOM，返回 { drawItems, totalScore }
        // 用于批量自动洗练，比 performTransform 快约 1000 倍
        function performTransformSilent() {
            let candidates = allStats.map(stat => ({ ...stat }));
            const picked = [];
            for (let i = 0; i < 4; i++) {
                if (candidates.length === 0) break;
                const chosen = pickRandomStat(candidates);
                candidates = candidates.filter(s => s.name !== chosen.name);
                picked.push(chosen);
            }

            const drawItems = picked.map(stat => {
                const tier = Math.floor(Math.random() * 8);
                return {
                    name: stat.name,
                    valueStr: stat.values[tier],
                    score: stat.scores[tier],
                    maxScore: stat.scores[0],   // tier 0 = 该词条最高分（用于上限分计算）
                    tier: tier
                };
            });

            const totalScore = drawItems.reduce((acc, cur) => acc + cur.score, 0);

            // 只更新计数器，不碰 DOM
            totalDraws++;
            totalScoreSum += totalScore;
            if (totalScore >= 65) count65++;
            if (totalScore >= 70) count70++;
            if (totalScore >= 80) count80++;
            totalSpend += COST_PER_CLICK;

            return { drawItems, totalScore };
        }

        // --------------------------------------------------------------
        // 单次洗练（点击「效果变换」时用）：计算 + 完整渲染
        function performTransform() {
            const result = performTransformSilent();
            renderTransformResult(result.drawItems, result.totalScore);
        }

        transformBtn.addEventListener('click', () => {
            stopAuto();
            performTransform();
        });

        // --------------------------------------------------------------
        // 一键变换：读取目标分值 + 上限分 + 右侧效果设定，启动极速洗练
        autoTransformBtn.addEventListener('click', () => {
            stopAuto();
            // 若勾选目标分值则启用条件 C；未勾选则用 Infinity 表示永不触发
            const min = targetScoreCheckbox.checked ? Math.max(1, targetScore) : Infinity;
            // 若勾选上限分则启用条件 D；未勾选则用 Infinity 表示永不触发
            const maxThresh = maxScoreCheckbox.checked ? Math.max(1, maxScore) : Infinity;
            startAuto(min, maxThresh);
        });

        // 停止变换：立刻中止正在运行的自动洗练
        stopAutoBtn.addEventListener('click', () => {
            stopAuto();
        });

        // --------------------------------------------------------------
        // 构建右侧「自动变换设定」效果表
        // 每行：[效果名] [数值下拉(8档)] [勾选框]
        // 只含有分数的15条词条
        function buildEffectTable() {
            effectTableBody.innerHTML = '';
            effectRows = [];

            scoredStats.forEach(stat => {
                const row = document.createElement('div');
                row.className = 'effect-row';

                // 效果名
                const nameSpan = document.createElement('span');
                nameSpan.className = 'eff-name';
                nameSpan.textContent = stat.name;
                nameSpan.title = stat.name;
                row.appendChild(nameSpan);

                // 数值下拉（8档，默认选第0档=最高值）
                const valueSelect = document.createElement('select');
                valueSelect.className = 'eff-value-select';
                stat.values.forEach((val, idx) => {
                    const opt = document.createElement('option');
                    opt.value = String(idx);
                    opt.textContent = val;
                    valueSelect.appendChild(opt);
                });
                valueSelect.value = '0'; // 默认最高档
                row.appendChild(valueSelect);

                // 勾选框
                const checkWrap = document.createElement('span');
                checkWrap.className = 'eff-check-wrap';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkWrap.appendChild(checkbox);
                row.appendChild(checkWrap);

                effectTableBody.appendChild(row);
                effectRows.push({ stat, valueSelect, checkbox });
            });
        }

        // 清空设定：取消所有勾选，数值下拉重置到第0档
        function clearEffectSettings() {
            effectRows.forEach(row => {
                row.checkbox.checked = false;
                row.valueSelect.value = '0';
            });
        }

        buildEffectTable();
        clearEffectSettingsBtn.addEventListener('click', clearEffectSettings);

        // --------------------------------------------------------------
        // 初始化
        // 从 localStorage 读取价格
        pricePerHundredMillion = loadPriceFromStorage();
        priceInput.value = pricePerHundredMillion;
        priceInput.step = '0.1';

        resultLinesDiv.innerHTML = '<div class="empty-placeholder">点击 [效果变换] 开始洗练</div>';
        leftTotalScoreSpan.textContent = '总分: 0';
        leftMaxScoreSpan.textContent = '上限分: 0';
        updateCostDisplay();
        updateStats();
    })();
</script>
</body>
</html>
