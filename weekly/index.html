}
/* 抽离：给单个插件行绑把手的 pointer 拖拽闭包
   FIX2：openPluginMgr 首次绑定 + _refreshPluginMgrDomOrder 重建重绑 都调用这个函数，保证每行的闭包变量和 DOM 都同步最新 */
function _bindPluginOption(row, list, box) {
    if (!row || !list || !box) return;
    const handle = row.querySelector('.plugin-option-drag-handle');
    if (!handle) return;
    const thresholdPx = 4;
    let startX = 0, startY = 0;
    let dragActive = false;
    let floatEl = null;
    let offsetX = 0, offsetY = 0;
    let rowRects = [];
    let boxRect = null;
    let insertPos = null;
    const cacheRects = () => {
        const rows = Array.from(list.querySelectorAll('.plugin-option'));
        rowRects = [];
        rows.forEach(r => {
            const idx = parseInt(r.dataset.plugIndex, 10);
            const r0 = r.getBoundingClientRect();
            rowRects.push({ el: r, index: idx, top: r0.top, bottom: r0.bottom, height: r0.height, mid: r0.top + r0.height / 2 });
        });
        boxRect = box.getBoundingClientRect();
    };
    const cleanupFloat = () => {
        if (floatEl && floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
        floatEl = null;
    };
    const positionFloat = (cx, cy) => {
        if (!floatEl) return;
        let x = cx - offsetX, y = cy - offsetY;
        const minX = boxRect ? boxRect.left + 6 : 0;
        const minY = boxRect ? boxRect.top + 6 : 0;
        const maxX = boxRect ? boxRect.right - floatEl.offsetWidth - 6 : window.innerWidth - floatEl.offsetWidth;
        const maxY = boxRect ? boxRect.bottom - floatEl.offsetHeight - 6 : window.innerHeight - floatEl.offsetHeight;
        if (x < minX) x = minX;
        if (x > maxX) x = maxX;
        if (y < minY) y = minY;
        if (y > maxY) y = maxY;
        floatEl.style.left = x + 'px';
        floatEl.style.top = y + 'px';
    };
    const clampY = (cy) => {
        if (!boxRect) return cy;
        const minY = boxRect.top + offsetY + 6;
        const maxY = boxRect.bottom - (floatEl ? (floatEl.offsetHeight - offsetY) : 36) - 6;
        return Math.min(Math.max(cy, minY), maxY);
    };
    const calcInsert = (cy) => {
        if (!rowRects.length) return null;
        if (cy < rowRects[0].mid) return { index: 0, side: 'above', targetEl: rowRects[0].el };
        const last = rowRects[rowRects.length - 1];
        if (cy >= last.mid) return { index: rowRects.length, side: 'below', targetEl: last.el };
        for (let i = 1; i < rowRects.length; i++) {
            if (cy < rowRects[i].mid) return { index: i, side: 'above', targetEl: rowRects[i].el };
        }
        return { index: rowRects.length, side: 'below', targetEl: last.el };
    };
    const applyVisuals = (ins, srcIndex) => {
        insertPos = ins;
        const rows = Array.from(list.querySelectorAll('.plugin-option'));
        rows.forEach(r => {
            r.classList.remove('drag-over-above', 'drag-over-below');
            r.style.transform = '';
        });
        if (!ins) return;
        if (ins.side === 'above') ins.targetEl.classList.add('drag-over-above');
        else ins.targetEl.classList.add('drag-over-below');
        const srcH = (rowRects[srcIndex] ? rowRects[srcIndex].height : 0) || 52;
        const dstIdx = ins.index;
        rows.forEach(r => {
            const rIdx = parseInt(r.dataset.plugIndex, 10);
            let shift = 0;
            if (dstIdx > srcIndex) {
                if (rIdx > srcIndex && rIdx < dstIdx) shift = -srcH;
                else if (rIdx === dstIdx - 1 && dstIdx - 1 !== srcIndex) shift = -srcH;
            } else if (dstIdx < srcIndex) {
                if (rIdx >= dstIdx && rIdx < srcIndex) shift = srcH;
            }
            r.style.transform = shift ? `translateY(${shift}px)` : '';
        });
    };
    handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        try { handle.setPointerCapture(e.pointerId); } catch(err) {}
        const startIdx = parseInt(row.dataset.plugIndex, 10);
        _pluginMgrDragState = {
            handle: handle,
            pointerId: e.pointerId,
            startIdx: startIdx,
            srcRow: row
        };
        startX = e.clientX; startY = e.clientY;
        dragActive = false;
    });
    handle.addEventListener('pointermove', (e) => {
        if (!_pluginMgrDragState || _pluginMgrDragState.pointerId !== e.pointerId) return;
        if (!dragActive) {
            if (Math.abs(e.clientY - startY) < thresholdPx) return;
            dragActive = true;
            const rect = row.getBoundingClientRect();
            offsetX = startX - rect.left;
            offsetY = startY - rect.top;
            floatEl = document.createElement('div');
            floatEl.className = 'plugin-drag-floating';
            floatEl.style.width = rect.width + 'px';
            floatEl.style.height = rect.height + 'px';
            const clone = row.cloneNode(true);
            clone.style.width = '100%';
            clone.style.height = '100%';
            clone.style.borderRadius = '16px';
            clone.style.border = 'none';
            const h = clone.querySelector('.plugin-option-drag-handle');
            if (h) h.style.visibility = 'hidden';
            floatEl.appendChild(clone);
            document.body.appendChild(floatEl);
            row.classList.add('dragging', 'drag-src-ghost');
            cacheRects();
            positionFloat(startX, startY);
        }
        e.preventDefault();
        const cy = clampY(e.clientY);
        positionFloat(e.clientX, cy);
        const ins = calcInsert(cy);
        applyVisuals(ins, parseInt(row.dataset.plugIndex, 10));
    });
    const endDrag = (e, committed) => {
        if (!_pluginMgrDragState || _pluginMgrDragState.pointerId !== e.pointerId) return;
        try { handle.releasePointerCapture(e.pointerId); } catch(err) {}
        row.classList.remove('dragging', 'drag-src-ghost');
        const finalIns = (committed && insertPos) ? insertPos : null;
        const srcIdx0 = parseInt(row.dataset.plugIndex, 10);
        _pluginMgrDragState = null;
        _clearPluginMgrDropMarkers(true);
        cleanupFloat();
        dragActive = false;
        insertPos = null;
        if (!committed || !finalIns) return;
        const allRows = Array.from(list.querySelectorAll('.plugin-option'));
        let targetIndex = finalIns.index;
        if (targetIndex < 0 || targetIndex > allRows.length) return;
        if (srcIdx0 < targetIndex) targetIndex = targetIndex - 1;
        if (srcIdx0 === targetIndex) return;
        const ok = swapPluginOrder(srcIdx0, targetIndex);
        if (ok) {
            saveData();
            buildPluginBarDOM();
            renderPluginBar();
            bindPluginBarEvents();
            // FIX2：重建并重绑（会重新分配 dataset.plugIndex + 新闭包），保证下一次拖拽依然灵敏
            _refreshPluginMgrDomOrder();
        }
    };
    handle.addEventListener('pointerup', (e) => endDrag(e, true));
    handle.addEventListener('pointercancel', (e) => endDrag(e, false));
}
function _refreshPluginMgrDomOrder() {
    // 根据当前 pluginOrder 重排 DOM 顺序 + 重新绑定每行的拖拽/勾选事件
    // 修复 FIX2：第一次拖拽成功后第二次拖拽"不好使"的根因是——_refreshPluginMgrDomOrder 之前只移动行节点但未重绑事件，导致把手的闭包变量 (startX/startY/dragActive/floatEl/...) 仍然引用第一次拖拽的行；而且 cacheRects 使用 dataset.plugIndex 与真实顺序错位
    const list = document.getElementById('pluginOptionList');
    if (!list) return;
    const overlay = document.getElementById('pluginMgrModal');
    const box = document.getElementById('pluginMgrBox');
    const ordered = getOrderedPluginRegistry();
    const rows = list.querySelectorAll('.plugin-option');
    const oldMap = new Map();
    rows.forEach(r => oldMap.set(r.dataset.plugOrderId, r));

    // 为了保证第二次拖拽把手事件有效，这里重建行节点（一次性拿到干净闭包），避免搬移旧节点+旧闭包引起的 cacheRects / dragActive 状态错乱
    list.innerHTML = '';
    ordered.forEach((plug, index) => {
        const row = document.createElement('div');
        row.className = 'plugin-option';
        row.draggable = false;
        row.dataset.plugOrderId = plug.id;
        row.dataset.plugIndex = String(index);
        row.innerHTML = `
            <span class="plugin-option-drag-handle" title="上下拖动调整插件显示顺序">&#x270B;&#xFE0E;</span>
            <label style="display:inline-flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0;">
                <input type="checkbox" data-plugid="${plug.id}" ${appData.enabledPlugins[plug.id] ? 'checked' : ''}>
                <div class="plugin-option-text">
                    <div class="name">${escapeHtml(plug.name)}</div>
                    <div class="desc">${escapeHtml(plug.desc)}</div>
                </div>
            </label>`;
        list.appendChild(row);
        // 给行重新绑拖拽事件（和 openPluginMgr 内逻辑保持一致，抽离为 _bindPluginOption 单函数调用）
        _bindPluginOption(row, list, box);
        // 重新绑 checkbox 变更
        const cb = row.querySelector('input[type=checkbox]');
        if (cb) {
            cb.addEventListener('change', () => {
                appData.enabledPlugins[plug.id] = cb.checked;
                saveData();
                renderPluginBar();
            });
        }
    });
}

function closePluginMgrOnBlur() {

    if (_pluginMgrDragState) {

/* ============================================================
 *  复制到剪贴板
 * ============================================================ */
const copyTimers = {};
function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else fallbackCopy(text);
}
function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
}

/* ============================================================
 *  自定义背景图
 * ============================================================ */
function applyBackground() {
    const layer = document.getElementById('bgLayer');
    if (appData.backgroundImage && typeof appData.backgroundImage === 'string') {
        layer.style.backgroundImage = `url("${appData.backgroundImage}")`;
    } else {
        layer.style.backgroundImage = '';
    }
}
function handleBgFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            appData.backgroundImage = String(reader.result || '');
            saveData();
            applyBackground();
        } catch(e) {}
    };
    reader.readAsDataURL(file);
}

/* ============================================================
 *  ============== 新型拖拽：克隆悬空 + 位移补位动画 ==============
 *  经验提醒：
 *   1) 克隆设 pointer-events:none，命中检测前隐藏克隆
 *   2) 所有结束路径统一走 cleanup 函数
 *   3) 单一收敛结束条件：mouseup capture + buttons 兜底
 * ============================================================ */
(function bindAdvancedDrag() {
    const wrapper = document.getElementById('tableWrapper');

    // ---------------- 共享状态 ----------------
    let mode = null;           // 'row' | 'col' | null
    let srcIdx = null;         // 被拖拽的源 index
    let moved = false;
    let threshold = 4;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0; // 鼠标相对克隆左上的偏移
    let floatEl = null;       // 悬空克隆 DOM
    let insertPos = null;     // 当前插入位置：{type:'above'|'below'|'left'|'right', targetIdx}
    // 缓存各元素的位置/尺寸，避免动画期间 reflow 抖动

    let colRects = [];        // [{thEl, left, right, width, index}]
    let tableRect = null;
    let firstRowTop = 0;

    // ---------------- 清理函数（统一出口） ----------------
    function cleanup(resetTransform) {
        // 1) 移除悬空克隆
        if (floatEl) {
            try { floatEl.remove(); } catch(e) {}
            floatEl = null;
        }
        // 2) 清所有高亮 & transform
        const rows = wrapper.querySelectorAll('tbody tr[data-account-row]');
        rows.forEach(r => {
            r.classList.remove('drag-over-above', 'drag-over-below', 'drag-src-ghost');
            if (resetTransform) r.style.transform = '';
        });
        wrapper.querySelectorAll('th[data-dungeon-index], td[data-dungeon-col]').forEach(el => {
            el.classList.remove('drag-over-left', 'drag-over-right', 'drag-src-ghost');
            if (resetTransform) el.style.transform = '';
        });
        // 3) 恢复 cursor
        try { document.body.style.cursor = ''; } catch(_) {}
        // 4) 复位状态
        mode = null; srcIdx = null; moved = false;
        insertPos = null;
        rowRects = []; colRects = []; tableRect = null;
    }

    // ---------------- Row 拖拽 ----------------
    wrapper.addEventListener('mousedown', (e) => {
        if (mode) return;
        const handle = e.target.closest('.drag-handle-row');
        if (handle) {
            const tr = handle.closest('tr[data-account-row]');
            if (!tr) return;
            const idx = parseInt(tr.dataset.accountRow, 10);
            if (isNaN(idx)) return;
            e.preventDefault();
            mode = 'row';
            srcIdx = idx;
            startX = e.clientX; startY = e.clientY;
            moved = false;
            return;
        }
        const colHandle = e.target.closest('.drag-handle-col');
        if (colHandle) {
            const th = colHandle.closest('th[data-dungeon-index]');
            if (!th) return;
            const idx = parseInt(th.dataset.dungeonIndex, 10);
            if (isNaN(idx)) return;
            e.preventDefault();
            mode = 'col';
            srcIdx = idx;
            startX = e.clientX; startY = e.clientY;
            moved = false;
            return;
        }
    });

    function onDocMove(e) {
        if (!mode) return;
        // buttons 兜底：若不是左键，取消拖拽

            onDocUp(e);
            return;
        }

        if (!moved) {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const pass = (mode === 'row') ? (Math.abs(dy) >= threshold) : (Math.abs(dx) >= threshold);
            if (!pass) return;
            // 跨过阈值，正式进入拖拽
            finishEditing();
            moved = true;
            try { document.body.style.cursor = 'grabbing'; } catch(_) {}
            if (mode === 'row') prepareRowFloat(e);
            else prepareColFloat(e);
        }

        if (mode === 'row') updateRowDrag(e);
        else updateColDrag(e);

        let finalInsert = insertPos;
        // 命中检测前：临时隐藏克隆，避免遮挡
        if (floatEl) {
            try { floatEl.style.visibility = 'hidden'; } catch(_) {}
        }
        // 如果还没判定插入位置，再根据当前鼠标位置强制判一次（最后位置决定）
        if (!finalInsert && mode === 'row') finalInsert = calcRowInsert(e.clientY);
        if (!finalInsert && mode === 'col') finalInsert = calcColInsert(e.clientX, e.clientY);

        const curMode = mode;
        const curSrc = srcIdx;
        cleanup(true);   // 清所有视觉效果

        // 执行数据搬迁
        if (finalInsert && !isNaN(curSrc) && curSrc >= 0) {
            let dst = finalInsert.index;
            if (curSrc < dst) dst -= 1;
            if (curSrc !== dst) {
                if (curMode === 'row') {
                    const movedAcc = appData.accounts.splice(curSrc, 1)[0];
                    const movedState = appData.states.splice(curSrc, 1)[0];
                    appData.accounts.splice(dst, 0, movedAcc);
                    appData.states.splice(dst, 0, movedState);
                } else {
                    const movedName = appData.dungeons.splice(curSrc, 1)[0];
                    appData.states.forEach(row => {
                        const v = row.splice(curSrc, 1)[0];
                        row.splice(dst, 0, v);
                    });
                    appData.dungeons.splice(dst, 0, movedName);
                }
                saveData();
                renderTable();
                renderPluginBar();
                return;
            }
        }
        // 未命中目标/同位置：重渲染恢复
        renderTable();
        renderPluginBar();
    }

    window.addEventListener('blur', () => {
        if (mode) cleanup(true);
    });

    // ---------------- Row 拖拽：构造悬空克隆 ----------------
    function prepareRowFloat(e) {
        const srcTr = wrapper.querySelector(`tbody tr[data-account-row="${srcIdx}"]`);
        if (!srcTr) { cleanup(true); return; }
        // 克隆行（完整宽度=原行尺寸）
        const rect = srcTr.getBoundingClientRect();
        floatEl = document.createElement('div');
        floatEl.className = 'drag-floating';
        // 用 table 包裹克隆的一行，保留原单元格宽度
        const tblClone = document.createElement('table');
        tblClone.style.width = rect.width + 'px';
        tblClone.style.borderCollapse = 'separate';
        tblClone.style.borderSpacing = '0';
        tblClone.style.tableLayout = 'fixed';
        const newTr = srcTr.cloneNode(true);
        newTr.querySelectorAll('.drag-handle-row, .delete-btn').forEach(el => el.style.visibility = 'hidden');
        // 每个 td 显式设宽，防止变形
        const origTds = srcTr.querySelectorAll('td');
        const newTds = newTr.querySelectorAll('td');
        origTds.forEach((orig, i) => {
            if (newTds[i]) {
                const r = orig.getBoundingClientRect();
                newTds[i].style.width = r.width + 'px';
                newTds[i].style.minWidth = r.width + 'px';
                newTds[i].style.maxWidth = r.width + 'px';
            }
        });
        const tb = document.createElement('tbody');
        tb.appendChild(newTr);
        tblClone.appendChild(tb);
        floatEl.appendChild(tblClone);
        // 克隆节点外观不变色不变透明：黄色方框通过 class 已设置
        floatEl.style.width = rect.width + 'px';
        floatEl.style.height = rect.height + 'px';
        // 鼠标相对克隆左上的偏移（使克隆跟着鼠标不跳动）
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        document.body.appendChild(floatEl);
        positionFloat(e.clientX, e.clientY);
        // 源位置标记为 ghost（空出的感觉）
        srcTr.classList.add('drag-src-ghost');
        // 缓存各行 rect
        cacheRowRects();
    }

    function positionFloat(cx, cy) {
        if (!floatEl) return;
        // 限制在表格范围内（不能超出可插入范围）
        let x = cx - offsetX;
        let y = cy - offsetY;
        if (tableRect) {
            // 不超过表格左右边界
            const maxX = tableRect.right - floatEl.offsetWidth;
            if (x < tableRect.left) x = tableRect.left;
            if (x > maxX) x = maxX;
            // 不超过表格上下边界（限制动画效果：拖出表格也停在边界）
            const maxY = tableRect.bottom - floatEl.offsetHeight;
            if (y < firstRowTop) y = firstRowTop;
            if (y > maxY) y = maxY;
        }
        floatEl.style.left = x + 'px';
        floatEl.style.top = y + 'px';
    }

    function cacheRowRects() {
        const rows = wrapper.querySelectorAll('tbody tr[data-account-row]');
        rowRects = [];
        rows.forEach(r => {
            const idx = parseInt(r.dataset.accountRow, 10);
            const r0 = r.getBoundingClientRect();
            rowRects.push({ el: r, index: idx, top: r0.top, bottom: r0.bottom, height: r0.height });
        });
        const wRect = wrapper.getBoundingClientRect();
        const tblEl = wrapper.querySelector('table');
        tableRect = tblEl ? tblEl.getBoundingClientRect() : wRect;
        if (rowRects.length) firstRowTop = rowRects[0].top;
    }

    function calcRowInsert(clientY) {
        if (!rowRects.length) return null;
        // 限制 clientY 在表格可插入范围
        let y = clientY;
        if (y < rowRects[0].top + rowRects[0].height / 2) {
            return { index: 0, side: 'above', targetEl: rowRects[0].el };
        }
        const last = rowRects[rowRects.length - 1];
        if (y >= last.bottom - last.height / 2) {
            return { index: rowRects.length, side: 'below', targetEl: last.el };
        }
        for (let i = 0; i < rowRects.length; i++) {
            const r = rowRects[i];
            if (y < r.top + r.height / 2) {
                return { index: i, side: 'above', targetEl: r.el };
            }
        }
        return { index: rowRects.length, side: 'below', targetEl: last.el };
    }

    function updateRowDrag(e) {
        // 限制在表格内
        const cy = clampRowY(e.clientY);
        positionFloat(e.clientX, cy);
        // 判定插入位置
        const ins = calcRowInsert(cy);
        applyRowVisuals(ins);
    }

    function clampRowY(y) {
        if (!rowRects.length) return y;
        const minY = rowRects[0].top + rowRects[0].height / 2;
        const last = rowRects[rowRects.length - 1];
        const maxY = last.bottom - last.height / 2;
        if (y < minY) return minY;
        if (y > maxY) return maxY;
        return y;
    }

    function applyRowVisuals(ins) {
        insertPos = ins;
        const rows = wrapper.querySelectorAll('tbody tr[data-account-row]');
        // 清高亮
        rows.forEach(r => r.classList.remove('drag-over-above', 'drag-over-below'));
        if (!ins) return;
        // 高亮插入线
        if (ins.side === 'above' && ins.targetEl) ins.targetEl.classList.add('drag-over-above');
        else if (ins.side === 'below' && ins.targetEl) ins.targetEl.classList.add('drag-over-below');
        // 位移补位：把 src 到 dst 之间的元素向上或向下推 1 行高
        const dstIdx = ins.index;
        const srcH = rowRects[srcIdx] ? rowRects[srcIdx].height : 52;
        rows.forEach(r => {
            const rIdx = parseInt(r.dataset.accountRow, 10);
            let shift = 0;
            if (dstIdx > srcIdx) {
                // src 要挪到 dstIdx：srcIdx+1 ~ dstIdx-1 的元素向上 -srcH
                if (rIdx > srcIdx && rIdx < dstIdx) shift = -srcH;
                else if (rIdx === dstIdx - 1 && dstIdx - 1 !== srcIdx) shift = -srcH;
            } else if (dstIdx < srcIdx) {
                // src 要挪到 dstIdx：dstIdx ~ srcIdx-1 的元素向下 +srcH
                if (rIdx >= dstIdx && rIdx < srcIdx) shift = srcH;
            }
            r.style.transform = shift ? `translateY(${shift}px)` : '';
        });
    }

    // ---------------- Col 拖拽：构造悬空克隆 ----------------
    function prepareColFloat(e) {
        // 限制：列只能在"副本列"范围内拖动，插入不能到 ED/备注/账号密码列 内部/之后
        const allTh = Array.from(wrapper.querySelectorAll('th'));
        // 找到副本 th 区间：索引范围 [firstDungeonThIndex, lastDungeonThIndex]
        let firstDungeonThIndex = -1, lastDungeonThIndex = -1;
        allTh.forEach((th, i) => {
            if (th.hasAttribute('data-dungeon-index')) {
                if (firstDungeonThIndex === -1) firstDungeonThIndex = i;
                lastDungeonThIndex = i;
            }
        });
        if (firstDungeonThIndex === -1) { cleanup(true); return; }
        // ED 列 就是 lastDungeonThIndex + 1，插入范围上限 = (副本列数) 即可以插到最后一个副本之后，但不能到 ED 列之后
        // th 索引：0=账号，[1..N]=副本，N+1=ED，N+2=备注
        const N = appData.dungeons.length;

        // 源 th & td
        const srcTh = wrapper.querySelector(`th[data-dungeon-index="${srcIdx}"]`);
        if (!srcTh) { cleanup(true); return; }
        const srcCells = wrapper.querySelectorAll(`td[data-dungeon-col="${srcIdx}"]`);
        const thRect = srcTh.getBoundingClientRect();

        // 计算克隆尺寸：宽=th宽，高=整表高（thead+tbody）
        const tblEl = wrapper.querySelector('table');
        const tblRect = tblEl.getBoundingClientRect();
        const totalHeight = tblRect.height;

        floatEl = document.createElement('div');
        floatEl.className = 'drag-floating';
        // 克隆的列：用一个带 th/td 的容器，每项高度对齐
        // 先克隆 th
        const colWrap = document.createElement('div');
        colWrap.style.width = thRect.width + 'px';
        colWrap.style.height = totalHeight + 'px';
        colWrap.style.display = 'flex';
        colWrap.style.flexDirection = 'column';
        const thClone = srcTh.cloneNode(true);
        thClone.querySelectorAll('.drag-handle-col, .delete-btn').forEach(el => el.style.visibility = 'hidden');
        thClone.style.width = thRect.width + 'px';
        thClone.style.height = thRect.height + 'px';
        thClone.style.flexShrink = '0';
        colWrap.appendChild(thClone);
        // 克隆每个 td（匹配每行高度）
        srcCells.forEach(cell => {
            const cRect = cell.getBoundingClientRect();
            const c = cell.cloneNode(true);
            c.style.width = cRect.width + 'px';
            c.style.height = cRect.height + 'px';
            c.style.flexShrink = '0';
            colWrap.appendChild(c);
        });
        floatEl.appendChild(colWrap);
        floatEl.style.width = thRect.width + 'px';
        floatEl.style.height = totalHeight + 'px';
        offsetX = e.clientX - thRect.left;
        offsetY = e.clientY - tblRect.top;
        document.body.appendChild(floatEl);
        positionColFloat(e.clientX, tblRect.top + offsetY, firstDungeonThIndex, lastDungeonThIndex, allTh);
        // 源位置 ghost
        srcTh.classList.add('drag-src-ghost');
        srcCells.forEach(c => c.classList.add('drag-src-ghost'));
        // 缓存列 rect
        cacheColRects();
    }

    function cacheColRects() {
        const ths = wrapper.querySelectorAll('th[data-dungeon-index]');
        colRects = [];
        ths.forEach(th => {
            const idx = parseInt(th.dataset.dungeonIndex, 10);
            const r = th.getBoundingClientRect();
            colRects.push({ el: th, index: idx, left: r.left, right: r.right, width: r.width, mid: r.left + r.width / 2 });
        });
        const tblEl = wrapper.querySelector('table');
        tableRect = tblEl ? tblEl.getBoundingClientRect() : wrapper.getBoundingClientRect();
    }

    function positionColFloat(cx, cy, firstDI, lastDI, allTh) {
        if (!floatEl) return;
        let x = cx - offsetX;
        let y = cy;
        // X 轴限制：副本列区间内
        if (colRects.length) {
            const firstC = colRects[0];
            const lastC = colRects[colRects.length - 1];
            if (x < firstC.left) x = firstC.left;
            if (x > lastC.right) x = lastC.right;
        }
        // ===== 需求 5 修复：Y 轴限制在表格可视范围内 =====
        if (tableRect) {
            // 浮层高度 = 整个表格高，不能超出表格 top/bottom
            const minY = tableRect.top;
            const maxY = tableRect.bottom - floatEl.offsetHeight;
            if (y < minY) y = minY;
            if (y > maxY) y = maxY;
        }
        floatEl.style.left = x + 'px';
        floatEl.style.top = y + 'px';
    }

    function calcColInsert(clientX, clientY) {
        if (!colRects.length) return null;
        // 插入限制：只能在副本列之间/前/后（ED 列禁止进入，后续列禁止）
        const firstC = colRects[0];
        const lastC = colRects[colRects.length - 1];
        let x = clientX;
        if (x < firstC.mid) return { index: 0, side: 'left', targetEl: firstC.el };
        if (x >= lastC.mid) return { index: colRects.length, side: 'right', targetEl: lastC.el };
        for (let i = 0; i < colRects.length; i++) {
            const c = colRects[i];
            if (x < c.mid) return { index: i, side: 'left', targetEl: c.el };
        }
        return { index: colRects.length, side: 'right', targetEl: lastC.el };
    }

    function updateColDrag(e) {
        if (!colRects.length || !tableRect || !floatEl) return;
        const firstC = colRects[0];
        const lastC = colRects[colRects.length - 1];

        // ===== 鼠标坐标先做表格范围的硬限制（X：副本列内，Y：表格内） =====
        let cx = e.clientX;
        let cy = e.clientY;
        // X：限制在 [firstC.left + offsetX, lastC.right + offsetX - floatEl.width*0.1]
        const minCx = firstC.left + offsetX;
        const maxCx = lastC.right + (offsetX < floatEl.offsetWidth ? offsetX : floatEl.offsetWidth * 0.6);
        if (cx < minCx) cx = minCx;
        if (cx > maxCx) cx = maxCx;
        // Y：限制在 [tableRect.top + offsetY, tableRect.bottom - floatEl.height + offsetY]
        const minCy = tableRect.top + offsetY;
        const maxCy = tableRect.bottom - floatEl.offsetHeight + offsetY;
        if (cy < minCy) cy = minCy;
        if (cy > maxCy) cy = maxCy;

        // cy 传给 positionColFloat 时按原公式：cy - offsetY（因为 positionColFloat 内部会再加上）
        positionColFloat(cx, cy - offsetY, 0, 0, null);

        // 插入位置判定：X 仍限制副本列范围
        let limX = cx;
        if (limX < firstC.left) limX = firstC.left;
        if (limX > lastC.right) limX = lastC.right;
        const ins = calcColInsert(limX, cy);
        applyColVisuals(ins);
    }

    function applyColVisuals(ins) {
        insertPos = ins;
        const allTh = wrapper.querySelectorAll('th[data-dungeon-index]');
        const allTd = wrapper.querySelectorAll('td[data-dungeon-col]');
        // 清高亮
        allTh.forEach(el => el.classList.remove('drag-over-left', 'drag-over-right'));
        allTd.forEach(el => el.classList.remove('drag-over-left', 'drag-over-right'));
        if (!ins) return;
        // 高亮插入线
        const markIdx = (ins.side === 'right') ? (ins.index - 1) : ins.index;
        if (markIdx >= 0 && markIdx < colRects.length) {
            const targetTh = colRects[markIdx].el;
            const side = (ins.side === 'right') ? 'right' : 'left';
            const cls = side === 'left' ? 'drag-over-left' : 'drag-over-right';
            targetTh.classList.add(cls);
            wrapper.querySelectorAll(`td[data-dungeon-col="${targetTh.dataset.dungeonIndex}"]`).forEach(td => td.classList.add(cls));
        }
        // 位移补位：计算 src -> dst，中间列推挤
        const dstIdx = ins.index;
        const srcW = colRects[srcIdx] ? colRects[srcIdx].width : 100;
        function setShift(el, w) {
            if (!el) return;
            el.style.transform = w ? `translateX(${w}px)` : '';
        }
        allTh.forEach(th => {
            const idx = parseInt(th.dataset.dungeonIndex, 10);
            let shift = 0;
            if (dstIdx > srcIdx) {
                if (idx > srcIdx && idx < dstIdx) shift = -srcW;
                else if (idx === dstIdx - 1 && dstIdx - 1 !== srcIdx) shift = -srcW;
            } else if (dstIdx < srcIdx) {
                if (idx >= dstIdx && idx < srcIdx) shift = srcW;
            }
            setShift(th, shift);
        });
        allTd.forEach(td => {
            const idx = parseInt(td.dataset.dungeonCol, 10);
            let shift = 0;
            if (dstIdx > srcIdx) {
                if (idx > srcIdx && idx < dstIdx) shift = -srcW;
                else if (idx === dstIdx - 1 && dstIdx - 1 !== srcIdx) shift = -srcW;
            } else if (dstIdx < srcIdx) {
                if (idx >= dstIdx && idx < srcIdx) shift = srcW;
            }
            setShift(td, shift);
        });
    }

})();

/* ============================================================
 *  初始化入口
 * ============================================================ */
function init() {
    loadData();
    buildPluginBarDOM();
    renderTable();
    renderPluginBar();
    applyBackground();
    bindVersionEvents();
    bindEyeAndAccDetailEvents();

    /* 添加账号/副本 */
    document.getElementById('addAccountBtn').addEventListener('click', () => {
        finishEditing();
        appData.accounts.push({ name: '新账号', note: '', ed: 0, account: '', password: '', pin2: '', accNote: '' });
        appData.states.push(new Array(appData.dungeons.length).fill('todo'));
        saveData(); renderTable(); renderPluginBar();
    });
    document.getElementById('addDungeonBtn').addEventListener('click', () => {
        finishEditing();
        appData.dungeons.push('新副本');
        appData.states.forEach(row => row.push('todo'));
        saveData(); renderTable(); renderPluginBar();
    });

    /* 插件按钮 + 柱状图按钮 + 关闭 */
    document.getElementById('openPluginMgrBtn').addEventListener('click', openPluginMgr);
    document.getElementById('pluginMgrClose').addEventListener('click', closePluginMgr);
    bindPluginBarEvents();
    document.getElementById('chartCloseBtn').addEventListener('click', closeChartModal);

    /* Esc 关闭所有弹窗（从上到下：先关最上层 accDetailModal 再按顺序） */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (!document.getElementById('accDetailModal').classList.contains('hidden')) closeAccDetailModal();
            if (!document.getElementById('weeklyModal').classList.contains('hidden')) closeWeeklyModal();
            if (!document.getElementById('chartModal').classList.contains('hidden')) closeChartModal();
            if (!document.getElementById('confirmModal').classList.contains('hidden')) hideConfirm(false);
            if (!document.getElementById('pluginMgrModal').classList.contains('hidden')) closePluginMgr();
            if (!document.getElementById('versionModal').classList.contains('hidden')) closeVersionModal();
        }
    });
    /* 确认弹窗按钮 */
    document.getElementById('modalCancel').addEventListener('click', () => hideConfirm(false));
    document.getElementById('modalConfirm').addEventListener('click', () => hideConfirm(true));

    /* 重置按钮 */
    document.getElementById('resetDoneBtn').addEventListener('click', () => {
        showConfirmDialog('确定重置所有完成状态？', () => {
            finishEditing();
            // 关键：先记录"重置时"的完成率快照（此时 states 还是旧数据），再执行清零
            recordWeeklyOnReset();
            for (let a = 0; a < appData.states.length; a++) {
                for (let d = 0; d < appData.states[a].length; d++) {
                    if (appData.states[a][d] === 'done') appData.states[a][d] = 'todo';
                }
            }
            appData.lastResetTime = new Date().toISOString();
            saveData(); renderTable(); renderPluginBar();
        });
    });

    /* ED 比例按钮 & input —— 统一走 bindPluginBarEvents 绑定（上方 2302 行已在 init 阶段调用；下方函数定义声明提升至文件顶部，不必重复） */

    /* 标题编辑 —— 修复 1：直接在 el（h1）上做原地编辑，不再传 parentElement（否则会拉到容器中部），和备注同逻辑 */
    document.getElementById('mainTitle').addEventListener('click', function() {
        const el = this;
        startInlineEdit(el, {
            initialValue: el.innerText, type: 'text', align: 'left',
            validator: (v) => (v && v.trim()) || TITLE_DEFAULT,
            onSave: (v) => { appData.title = v; saveData(); },
            afterFinish: () => renderTable()
        });
    });

    /* 背景图：
       - 🖼️ 背景图按钮：直接打开文件选择器，选择并应用；取消 = 什么也不做（不清背景）
       - 🗑️ 删除背景按钮：二次确认后把 backgroundImage 置空，恢复默认渐变背景
    */
    const bgFileInput = document.getElementById('bgFileInput');
    document.getElementById('openBgBtn').addEventListener('click', () => {
        bgFileInput.value = '';
        bgFileInput.click();
    });
    document.getElementById('delBgBtn').addEventListener('click', () => {
        if (!appData.backgroundImage) { alert('当前未设置自定义背景图。'); return; }
        showConfirmDialog('确定删除当前自定义背景图？', () => {
            appData.backgroundImage = null;
            saveData();
            applyBackground();
        });
    });
    bgFileInput.addEventListener('change', () => {
        const f = bgFileInput.files && bgFileInput.files[0];
        if (f) handleBgFile(f);
    });

    /* ---------- 通用 click 路由（删除 / ED +/- / 复制 / 编辑 / 状态） ---------- */
    let statusClickTimer = null;
    let statusClickPending = null;
    const STATUS_CLICK_DELAY = 180;

    document.addEventListener('click', function(e) {
        /* 删除 */
        if (e.target.classList.contains('delete-btn')) {
            e.stopPropagation();
            const delType = e.target.dataset.deleteType;
            const delIndex = parseInt(e.target.dataset.deleteIndex);
            const name = delType === 'account' ? '账号' : '副本';
            showConfirmDialog(`确定删除该${name}？`, () => {
                finishEditing();
                if (delType === 'account') {
                    appData.accounts.splice(delIndex, 1); appData.states.splice(delIndex, 1);
                } else {
                    appData.dungeons.splice(delIndex, 1);
                    appData.states.forEach(row => row.splice(delIndex, 1));
                }
                saveData(); renderTable(); renderPluginBar();
            });
            return;
        }
        /* ED +/- */
        if (e.target.classList.contains('ed-btn')) {
            e.stopPropagation();
            finishEditing();
            const accIdx = parseInt(e.target.dataset.edAcc);
            const op = e.target.dataset.edOp;
            const acc = appData.accounts[accIdx];
            if (!acc) return;
            if (op === 'minus' && acc.ed > 0) acc.ed--;
            if (op === 'plus' && acc.ed < ED_MAX) acc.ed++;
            if (acc.ed < 0) acc.ed = 0;
            if (acc.ed > ED_MAX) acc.ed = ED_MAX;
            saveData(); renderTable(); renderPluginBar();
            return;
        }
        /* 复制账号（左侧头格）：复制账号详情弹窗里"账号"字段的内容 */
        if (e.target.classList.contains('copy-number-btn-left')) {
            e.stopPropagation();
            const accIdx = parseInt(e.target.dataset.copyAcc);
            const acc = appData.accounts[accIdx]; if (!acc) return;
            const val = acc.account || ''; if (!val) return;
            copyToClipboard(val);
            const btn = e.target; const oldText = btn.innerText;
            btn.innerText = '✓'; btn.style.background = '#2b613c'; btn.style.color = '#d1ffdd';
            const k = 'copy_' + accIdx;
            if (copyTimers[k]) clearTimeout(copyTimers[k]);
            copyTimers[k] = setTimeout(() => {
                btn.innerText = oldText; btn.style.background = ''; btn.style.color = '';
                delete copyTimers[k];
            }, 1800);
            return;
        }
        /* 点击"账号详情按钮" → 打开账号详情弹窗 */
        const detailBtn = e.target.closest('button.account-detail-btn');
        if (detailBtn && detailBtn.dataset.openAccDetail) {
            e.stopPropagation();
            const accIdx = parseInt(detailBtn.dataset.openAccDetail, 10);
            openAccDetailModal(accIdx);
            return;
        }
        /* 账号名编辑 */
        const accountSpan = e.target.closest('.account-name');
        if (accountSpan && e.target === accountSpan) {
            e.stopPropagation();
            const accIdx = parseInt(accountSpan.dataset.accountIdx);
            startInlineEdit(accountSpan, {
                initialValue: appData.accounts[accIdx]?.name || '',
                type: 'text', align: 'left',
                validator: (v) => (v && v.trim()) ? v.trim() : '未命名账号',
                onSave: (v) => { appData.accounts[accIdx].name = v; saveData(); },
                afterFinish: () => renderTable()
            });
            return;
        }
        /* 副本名编辑 */
        const dungeonSpan = e.target.closest('.dungeon-name');
        if (dungeonSpan && e.target === dungeonSpan) {
            e.stopPropagation();
            const dIdx = parseInt(dungeonSpan.dataset.dungeonIdx);
            startInlineEdit(dungeonSpan, {
                initialValue: appData.dungeons[dIdx] || '',
                type: 'text', align: 'left',
                validator: (v) => (v && v.trim()) ? v.trim() : '未命名副本',
                onSave: (v) => { appData.dungeons[dIdx] = v; saveData(); },
                afterFinish: () => renderTable()
            });
            return;
        }
        /* 备注编辑：记事本式，随时输入即时保存（不走失焦保存的老逻辑） */
        const noteTd = e.target.closest('td.note-cell');
        if (noteTd && e.target === noteTd) {
            e.stopPropagation();
            const accIdx = parseInt(noteTd.dataset.accountNote);
            startLiveNoteEdit(noteTd, accIdx);
            return;
        }
        /* ED 值编辑 */
        const edSpan = e.target.closest('.ed-value');
        if (edSpan && e.target === edSpan) {
            e.stopPropagation();
            const accIdx = parseInt(edSpan.dataset.edAcc);
            startInlineEdit(edSpan, {
                initialValue: appData.accounts[accIdx]?.ed || 0,
                type: 'number', min: 0, max: ED_MAX, align: 'center',
                validator: (v) => {
                    let n = parseInt(v, 10);
                    if (isNaN(n) || n < 0) n = 0;
                    if (n > ED_MAX) n = ED_MAX;
                    return n;
                },
                onSave: (n) => { appData.accounts[accIdx].ed = n; saveData(); },
                afterFinish: () => { renderTable(); renderPluginBar(); }
            });
            return;
        }
        /* 状态单元格：单击切换 todo↔done；双击切换 skipped↔todo */
        const td = e.target.closest('td');
        if (td && td.classList.contains('status-cell')) {
            e.stopPropagation();
            const acc = parseInt(td.dataset.account);
            const dgn = parseInt(td.dataset.dungeon);
            if (isNaN(acc) || isNaN(dgn)) return;
            if (statusClickTimer) {
                clearTimeout(statusClickTimer); statusClickTimer = null;
                statusClickPending = null; return;
            }
            statusClickPending = { acc, dgn };
            statusClickTimer = setTimeout(() => {
                if (statusClickPending) {
                    finishEditing();
                    const { acc, dgn } = statusClickPending;
                    const cur = appData.states[acc][dgn];
                    if (cur !== 'skipped')
                        appData.states[acc][dgn] = (cur === 'done' ? 'todo' : 'done');
                    saveData(); renderTable(); renderPluginBar();
                    statusClickPending = null;
                }
                statusClickTimer = null;
            }, STATUS_CLICK_DELAY);
            return;
        }
    });

    /* 双击：skipped 切换 */
    document.addEventListener('dblclick', function(e) {
        if (statusClickTimer) {
            clearTimeout(statusClickTimer); statusClickTimer = null;
            statusClickPending = null;
        }
        const td = e.target.closest('td');
        if (td && td.classList.contains('status-cell')) {
            e.preventDefault();
            const acc = parseInt(td.dataset.account);
            const dgn = parseInt(td.dataset.dungeon);
            if (isNaN(acc) || isNaN(dgn)) return;
            finishEditing();
            const cur = appData.states[acc][dgn];
            appData.states[acc][dgn] = (cur === 'skipped' ? 'todo' : 'skipped');
            saveData(); renderTable(); renderPluginBar();
        }
    });

    window.addEventListener('beforeunload', finishEditing);
}

/* 启动 */
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
</body>
</html>
