<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周常记录</title>
<style>
/* =========================================================
 * 小白编辑提示：改样式在下面 CSS 区域
 * 想改默认标题 / 周周期 / ED上限 搜：TITLE_DEFAULT / WEEK_CYCLE / ED_MAX
 * ========================================================= */
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    user-select: none;
}
input, textarea { user-select: text; }

/* ---------- 自定义背景层（最底层，独立） ---------- */
#bgLayer {
    position: fixed;
    inset: 0;
    background: #0b0c0e center / cover no-repeat;
    z-index: 0;
    pointer-events: none;
}

/* body 直接透明，让 bgLayer 透出（按钮与表格自身不透明） */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    position: relative;
    background: transparent;
}

/* ---------- 应用容器（半透明面板，让背景透出） ---------- */
.app-container {
    position: relative;
    z-index: 1;
    max-width: 1820px;
    width: 100%;
    /* 半透明深色面板，让下方按钮/表格仍保持不透明 */
    background: rgba(26, 29, 33, 0.55);
    backdrop-filter: blur(4px);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.6), 0 0 0 1px rgba(58,63,68,0.5) inset;
}

/* 标题行：标题 + 版本号 + 版本按钮 横向排布 */
.title-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    margin-bottom: 8px;
    padding: 0 8px;
    flex-wrap: wrap;
}
.title-meta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
}
.version-tag {
    font-size: 1.2rem;   /* 比标题 (2.4rem) 小一半 */
    font-weight: 500;
    color: #d2b98a;
    background: rgba(43, 42, 38, 0.5);
    border: 1px solid #6f6553;
    border-radius: 10px;
    padding: 4px 12px;
    letter-spacing: 1px;
    white-space: nowrap;
}
.version-btn {
    background: #373d49 !important;
    color: #ecdbbf !important;
    border-color: #7d8a9c !important;
    font-size: 1rem !important;
    padding: 6px 14px !important;
}

/* 标题（背景文字区域半透明） */
.editable-title {
    font-size: 2.4rem;
    font-weight: 400;
    color: #e5c9a8;
    text-shadow: 0 0 6px #bd9e6b;
    margin: 0;
    letter-spacing: 2px;
    display: inline-block;
    border-bottom: 2px dashed #5f5b4f;
    cursor: text;
    padding: 0 10px 5px 10px;
    transition: 0.2s;
    background: rgba(43, 42, 38, 0.35);
    border-radius: 8px 8px 0 0;
}
.editable-title:hover {
    border-bottom-color: #b89b6e;
    background: rgba(43, 42, 38, 0.7);
}
.title-edit {
    background: #2d2f33;
    border: 1px solid #b59d6b;
    color: #eedbba;
    font-size: 2.4rem;
    font-weight: 400;
    padding: 0 12px;
    border-radius: 12px;
    outline: none;
    width: auto;
    margin-bottom: 16px;
    font-family: inherit;
}

/* ---------- 顶部按钮栏：按钮均不透明 ---------- */
.action-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
}
.btn {
    /* 按钮不透明 */
    background: #2f343a;
    border: 1px solid #4f555e;
    color: #d3d7de;
    font-size: 1.05rem;
    padding: 8px 22px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 500;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 6px rgba(10,12,14,0.6);
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    opacity: 1 !important;
}
.btn:hover {
    background: #3f464f;
    border-color: #7b838f;
    color: #f0e6d2;
    transform: translateY(-1px);
}
.btn.reset-btn { background: #352e24; border-color: #766b51; color: #e3caa5; }
.btn.reset-btn:hover { background: #4f4232; }
.btn.danger-btn { background: #4a2626; border-color: #824040; color: #f1c4c4; }
.btn.danger-btn:hover { background: #5c2c2c; }
.btn.plugin-btn { background: #2b3446; border-color: #566884; color: #d6e1f2; }
.btn.plugin-btn:hover { background: #3a4760; }
.btn.bg-btn { background: #3a2d40; border-color: #7a5d88; color: #e5cfee; }
.btn.bg-btn:hover { background: #503d5a; }

/* 上次重置时间 显示区 */
.last-reset-info {
    margin-left: 6px;
    padding: 6px 16px;
    background: rgba(42, 43, 47, 0.75);
    color: #c9bfa6;
    border-radius: 24px;
    border: 1px dashed #5c5442;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    opacity: 1 !important;
}
.last-reset-info b { color: #f0cf90; font-weight: 600; }

/* 表格上方工具条：仅放"详情内容显隐切换"按钮（睁眼/闭眼）—— 靠左对齐 */
.table-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin: 10px 2px 8px 6px;
}
.toggle-eye-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #3b3322;
    border: 1px solid #846b3f;
    color: #f5dea8;
    padding: 5px 14px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: 0.15s;
}
.toggle-eye-btn:hover { background: #4c4028; }
.toggle-eye-btn.active { background: #604b27; border-color: #caa465; }

/* ---------- 表格包裹区：不透明 ---------- */
.table-wrapper {
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 18px;
    border: 1px solid #3d4148;
    background: #131517;   /* 表格整体不透明 */
    padding: 4px 0 0 0;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
    scroll-behavior: smooth;
    position: relative;
}
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: auto;
    position: relative;
}
th, td {
    border: 1px solid #33373e;
    padding: 0;
    height: 52px;
    background: #1e2126;
    color: #ddd;
    text-align: center;
    vertical-align: middle;
    position: relative;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
th {
    background: #262b33;
    font-weight: 500;
    color: #bfb195;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
}
.th-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 100%;
    padding: 0 10px;
}
.th-inner .dungeon-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: text;
}

/* 删除按钮 */
.delete-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    background: #5c3d3d;
    color: #efc5c5;
    border-radius: 30px;
    font-size: 16px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    display: none;
    z-index: 10;
    border: 1px solid #a57272;
    font-weight: bold;
    box-shadow: 0 2px 4px black;
}
.delete-btn:hover { background: #913e3e; color: white; }
th:hover .delete-btn,
.account-header-cell:hover .delete-btn { display: block; }

/* 账号列单元格（第一列）：一行内包含 拖动把手 / 复制 / 账号名 / 详情 四个控件
   右上角预留 30px 空白给 absolute 删除角标，避免和详情按钮重叠 */
.account-header-cell {
    position: relative;
    background: #2b2f38;
    font-weight: 600;
    color: #d8cbb4;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    padding: 0 32px 0 6px;   /* 右边 32px 专门留给删除角标，避免和详情按钮重叠 */
    height: 100%;
    min-width: 0;
}
/* 拖动把手 */
.drag-handle-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 28px;
    border-radius: 8px;
    color: #8d8570;
    font-size: 0.9rem;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    transition: 0.1s;
    letter-spacing: 1px;
    font-weight: bold;
}
.drag-handle-row:hover { background: #3f4652; color: #ffddb0; }
.drag-handle-row:active { cursor: grabbing; }

.drag-handle-col {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 22px;
    border-radius: 6px;
    color: #8d8570;
    font-size: 0.85rem;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    transition: 0.1s;
    letter-spacing: 1px;
    font-weight: bold;
}
.drag-handle-col:hover { background: #473e2f; color: #ffddb0; }
.drag-handle-col:active { cursor: grabbing; }

/* 复制账号按钮 */
.copy-number-btn-left {
    display: inline-block;
    width: 28px;
    height: 28px;
    line-height: 28px;
    background: #3f4652;
    border-radius: 30px;
    color: #eaccad;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 3px black;
    transition: 0.1s;
    flex-shrink: 0;
    text-align: center;
    position: relative;
}
.copy-number-btn-left:hover { background: #556073; color: #ffddb0; }
.copy-number-btn-left:active { transform: scale(0.9); }

.account-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: text;
    text-align: left;
    max-width: none;
    white-space: nowrap;
}
/* 账号名列内右侧：详情小 icon 按钮（悬浮提示「账号详情」，点击弹窗） */
.acc-inline-detail-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 30px;
    background: #3a392e;
    border: 1px solid #6d5f3d;
    color: #f5dea8;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 2px 3px rgba(0,0,0,0.4);
    transition: 0.1s;
    flex-shrink: 0;
    padding: 0;
    line-height: 1;
}
.acc-inline-detail-btn:hover { background: #4e4932; color: #ffedc2; }
.acc-inline-detail-btn:active { transform: scale(0.92); }
/* 未填账号时详情按钮淡化（仍可点开补填） */
.acc-inline-detail-btn.acc-empty { opacity: 0.65; }

/* =========================================================
 *  新型拖拽效果：行/列用 transform 补位，克隆节点悬空拖拽
 * ========================================================= */
/* 行拖拽动画：所有行都允许位移补位 */
#tableWrapper tbody tr[data-account-row] {
    transition: transform 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    z-index: 1;
}
/* 列拖拽动画：所有 th / td 允许位移补位 */
#tableWrapper th[data-dungeon-index],
#tableWrapper td[data-dungeon-col] {
    transition: transform 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    z-index: 1;
}
/* 插入位置指示线 */
tbody tr[data-account-row].drag-over-above td {
    box-shadow: inset 0 3px 0 0 #f5cd4a;
}
tbody tr[data-account-row].drag-over-below td {
    box-shadow: inset 0 -3px 0 0 #f5cd4a;
}
th[data-dungeon-index].drag-over-left,
td[data-dungeon-col].drag-over-left {
    box-shadow: inset 3px 0 0 0 #f5cd4a !important;
}
th[data-dungeon-index].drag-over-right,
td[data-dungeon-col].drag-over-right {
    box-shadow: inset -3px 0 0 0 #f5cd4a !important;
}

/* 拖拽中：源位置仍占位但视觉淡化空出，不变色/不变透明是"悬空克隆"的事，源位置改成 ghost 灰 */
tbody tr[data-account-row].drag-src-ghost td {
    background: #202125 !important;
    color: #888 !important;
    opacity: 0.35;
}
th[data-dungeon-index].drag-src-ghost,
td[data-dungeon-col].drag-src-ghost {
    background: #202125 !important;
    color: #888 !important;
    opacity: 0.35;
}

/* 悬空克隆浮层：随鼠标移动，黄色方框包住 */
.drag-floating {
    position: fixed;
    z-index: 9999;
    pointer-events: none !important;
    box-shadow: 0 0 0 2px #f5cd4a, 0 10px 30px rgba(0,0,0,0.7);
    border-radius: 6px;
    overflow: hidden;
    background: #1e2126;
}

/* 状态单元格 */
.status-cell {
    cursor: pointer;
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: 0 0 5px currentColor;
}
.status-done    { background: #1d4f3b !important; color: #b2ffcf; }
.status-skipped { background: #B22222 !important; color: #f0d5b0; }
.status-todo    { background: #282e34 !important; color: #ffffff; }

/* 备注列 */
.note-cell {
    cursor: text;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
    text-align: left;
    color: #b6b9c2;
}

/* =========================================================
 *  账号详情 弹窗 & 表单
 * ========================================================= */
#accDetailModal { z-index: 1080; }
.acc-detail-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 38ch;         /* 紧凑：所有行统一宽度，不会冲出边框 */
    align-items: stretch;
}
.adf-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #4a4a56;
}
.adf-title-row h3 { margin: 0; color: #ecdbbf; font-size: 1.15rem; }
.adf-copy-btn {
    appearance: none;
    background: #3b3322;
    border: 1px solid #846b3f;
    color: #f5dea8;
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.12s;
    flex: 0 0 auto;
    white-space: nowrap;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
}
.adf-copy-btn:hover { background: #4c4028; }
.adf-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.adf-row label.adf-lbl {
    color: #cfc4a5;
    font-size: 0.95rem;
    font-weight: 500;
    padding-left: 4px;
    line-height: 1.2;
}
.adf-input, .adf-textarea {
    background: #1a1d22;
    border: 1px solid #4b5364;
    color: #ecdbbf;
    border-radius: 12px;
    padding: 8px 12px;
    outline: none;
    font-family: Consolas, "Courier New", monospace;
    font-size: 1rem;
    line-height: 1.4;
    box-sizing: border-box;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    width: 100%;          /* 在 max-width 表单内自适应，保证不越界 */
}
.adf-input:focus, .adf-textarea:focus {
    border-color: #caa465;
    box-shadow: 0 0 0 2px rgba(202,164,101,0.18);
    background: #1e2227;
}
/* 账号/密码：约 15 个数字字母宽度（max-width 约束，保证视觉统一短） */
.adf-w-15 { max-width: 20ch; }
/* 二级密码：约 10 个数字字母宽度 */
.adf-w-10 { max-width: 13ch; }
/* 账号备注：≥3 行，超出高度自适应于内容；同账号/密码的行宽（与表单最大宽一致） */
.adf-textarea {
    min-height: 84px;
    width: 100%;
    max-width: 38ch;        /* 对齐上面控件宽度，不要超边框 */
    box-sizing: border-box;
    resize: none;
    overflow: hidden;
}
/* 详情关闭按钮：略放大但不要太大 */
.modal-btn.adf-close-btn {
    padding: 9px 36px;
    font-size: 1.15rem;
}
/* 闭眼状态遮罩：除备注外的值不显示（标签仍显示） */
.adf-veil {
    position: relative;
    background: #202329 !important;
    border-color: #3a3f49 !important;
    color: transparent !important;
    user-select: none;
    pointer-events: none;
}
.adf-veil::after {
    content: '••••••';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #8d95a4;
    letter-spacing: 2px;
    border-radius: 12px;
}

/* ED 列 */
.ed-cell {
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    background: #2a2e36;
}
.ed-btn {
    background: #3f4652;
    border: none;
    color: #eaccad;
    width: 28px;
    height: 28px;
    border-radius: 30px;
    font-size: 1.3rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 3px black;
    transition: 0.1s;
    flex-shrink: 0;
}
.ed-btn:active { transform: scale(0.9); }
.ed-btn.disabled { opacity: 0.3; pointer-events: none; background: #31353d; }
.ed-value {
    flex: 1;
    text-align: center;
    font-weight: 600;
    font-size: 1.2rem;
    color: #f3cf9b;
    cursor: text;
    min-width: 35px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.ed-value input {
    width: 60px;
    background: #1b1e24;
    border: 1px solid #b29c6b;
    color: #fad699;
    font-size: 1.1rem;
    text-align: center;
    border-radius: 20px;
    padding: 4px 0;
    outline: none;
}
.ed-value input::-webkit-inner-spin-button,
.ed-value input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.ed-value input[type=number] { -moz-appearance: textfield; }

/* 内联输入框（单击编辑） */
.inline-edit-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
    z-index: 5;
    background: inherit;
}
/* 进入编辑时：容器里除 inline-edit-wrap 之外的文本/子元素全部隐藏（保持占位，输入框原地覆盖） */
._editing-active > :not(.inline-edit-wrap) {
    visibility: hidden !important;
}
._editing-active {
    /* 文本节点没有被 :not 选中，单独处理：给容器加 color 透明以隐藏直接文本 */
    color: transparent !important;
}
._editing-active > .inline-edit-wrap .edit-input {
    /* 确保子输入框颜色恢复正常可见 */
    color: #efdbbe !important;
}
.inline-edit-wrap .edit-input {
    flex: 1;
    width: 100%;
    height: 80%;
    max-height: 44px;
    background: #2d3038;
    border: 2px solid #a38e60;
    color: #efdbbe;
    font-size: 1rem;
    padding: 0 8px;
    text-align: center;
    border-radius: 4px;
    outline: none;
    box-shadow: inset 0 0 5px black;
    font-family: inherit;
}
.inline-edit-wrap.left { justify-content: flex-start; }
.inline-edit-wrap.left .edit-input { text-align: left; }

/* =========================================================
 *  插件栏（表格下方）
 * ========================================================= */
.plugin-bar {
    margin-top: 24px;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 每行最多 2 个 */
    gap: 16px;
}
.plugin-card {
    background: rgba(27, 31, 37, 0.7);
    padding: 16px 20px;
    border-radius: 20px;
    border: 1px solid #4a4f58;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(2px);
    /* 插件框最大覆盖本行，height 跟随内容自适应 */
    justify-content: center;
}
/* 每行最多显示 2 个插件：所有插件一律参与两列布局，不再强制整行独占 */
.plugin-card {
    grid-column: span 1; /* 明确每个卡片占 1 列 */
    min-width: 0;       /* 允许 flex 子内容压缩，防止溢出破两列 */
}
.plugin-title {
    font-size: 0.95rem;
    color: #bfb195;
    letter-spacing: 1px;
    margin: 0;
    font-weight: 500;
}

/* =========================================================
 *  插件1：本周完成率（按钮类：环形+文字，点击展开柱状图）
 * ========================================================= */
.plugin-progress-btn {
    background: linear-gradient(135deg, #2b4136 0%, #1f3328 100%);
    border: 1px solid #4e8a65;
    color: #cdf2dc;
    padding: 14px 24px;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.18s;
    box-shadow: 0 4px 8px rgba(10,12,14,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 180px;
    opacity: 1 !important;
}
.plugin-progress-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.6);
    border-color: #6fbf8d;
}
.progress-circle-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
}
canvas#progressCircle {
    width: 80px; height: 80px;
    background: #252a32;
    border-radius: 50%;
    box-shadow: 0 0 10px #0a0c0e, inset 0 0 8px #000;
}
.progress-percent {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #eedbaa;
    font-size: 1.2rem;
    font-weight: 600;
    text-shadow: 0 0 6px #b59d6b;
}
.progress-btn-label {
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #d6f2e1;
}

/* =========================================================
 *  插件2：总ED统计（2行：上=ED统计，下=ED比例栏）
 * ========================================================= */
.ed-stat-top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 4px 10px;
}
.ed-total {
    font-size: 1.8rem;
    font-weight: 600;
    color: #eedbaa;
    background: #2f363f;
    padding: 6px 32px;
    border-radius: 48px;
    letter-spacing: 2px;
    border: 1px solid #776e56;
    box-shadow: 0 4px 0 #0f1113;
}
.ed-total span { color: #b8d0b0; font-size: 1.2rem; margin-right: 12px; }

.ed-stat-bottom {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}
.rate-label {
    color: #bfb195;
    font-weight: 500;
    letter-spacing: 0.5px;
    font-size: 1rem;
}
.rate-controls { display: flex; align-items: center; gap: 6px; }
.rate-btn {
    background: #3f4652; border: none; color: #eaccad;
    width: 32px; height: 32px;
    border-radius: 30px;
    font-size: 1rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 3px black;
    transition: 0.1s; flex-shrink: 0;
    opacity: 1 !important;
}
.rate-btn:hover { background: #556073; color: #ffddb0; }
.rate-btn:active { transform: scale(0.9); }
#edRateInput {
    width: 70px;
    background: #1b1e24;
    border: 1px solid #b29c6b;
    color: #fad699;
    font-size: 1.1rem;
    text-align: center;
    border-radius: 20px;
    padding: 4px 0;
    outline: none;
    height: 32px;
}
#edRateInput::-webkit-inner-spin-button,
#edRateInput::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#edRateInput[type=number] { -moz-appearance: textfield; }
.rate-result { color: #d3d7de; font-size: 1.1rem; font-weight: 500; white-space: nowrap; }
.rate-result span { color: #f3cf9b; font-weight: 600; cursor: text; border-radius: 6px; padding: 2px 6px; }
.rate-result span:hover { background: #3a2e1d; }

/* =========================================================
 *  弹窗（通用遮罩、二次确认、柱状图、插件勾选、背景图选择）
 * ========================================================= */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(3px);
}
/* 弹窗层级：pluginMgr / weekly（第1层）1100 → chart（第2层柱状图）1200 → confirm（二次确认）1300
   保证后开弹层永远在上，不会被前一层的遮罩覆盖导致关闭按钮不可点 */
#pluginMgrModal { z-index: 1050; }     /* 插件勾选/拖拽排序：在背景图弹层（如有）之上 */
#weeklyModal    { z-index: 1100; }     /* 每周记录第1层：周期列表 */
#chartModal     { z-index: 1200; }     /* 每周记录第2层：柱状图 / 本周完成率柱状图 */
#confirmModal   { z-index: 1300; }     /* 二次确认弹窗：永远在最上 */
.modal-content {
    background: #2b2f38;
    border: 2px solid #7f7259;
    border-radius: 32px;
    padding: 28px 36px;
    box-shadow: 0 20px 30px black;
    text-align: center;
    color: #ecdbbf;
    max-width: 420px;
    width: min(420px, 92vw);
}
.modal-content h3 { margin: 4px 0 16px; color: #f0dfbb; letter-spacing: 1px; }
.modal-content p { font-size: 1.2rem; margin: 5px 0 22px; }
.modal-actions { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.modal-btn {
    background: #404754;
    border: 1px solid #7d8a9c;
    color: white;
    font-size: 1.1rem;
    padding: 8px 32px;
    border-radius: 40px;
    cursor: pointer;
    opacity: 1 !important;
}
.modal-btn.confirm { background: #5f4d34; border-color: #cbaa74; }
.modal-btn.primary { background: #3f5a6e; border-color: #6ea6c9; }
.hidden { display: none; }

/* 插件勾选弹窗 */
.modal-list-content {
    background: #2b2f38;
    border: 2px solid #5e7a94;
    border-radius: 24px;
    padding: 24px 28px 22px;
    box-shadow: 0 20px 30px black;
    color: #ecdbbf;
    width: min(480px, 92vw);
    max-height: 80vh;
    overflow: auto;
}
.modal-list-content h3 {
    margin: 4px 0 16px;
    color: #d6e4f2;
    letter-spacing: 1px;
    text-align: center;
}
/* ---------- 插件勾选弹窗列表 ---------- */
.plugin-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
}
.plugin-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 16px;
    border: 1px solid #4a5260;
    background: #22262e;
    cursor: pointer;
    transition: 0.15s;
    position: relative;
}
.plugin-option:hover { border-color: #7a889c; background: #2a2f38; }
.plugin-option.dragging { opacity: 0.45; }
.plugin-option.drop-before::before,
.plugin-option.drop-after::after {
    content: '';
    position: absolute;
    left: 10px;
    right: 10px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #7cc3ff, transparent);
    border-radius: 2px;
}
.plugin-option.drop-before::before { top: -1px; }
.plugin-option.drop-after::after { bottom: -1px; }
.plugin-option-drag-handle {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    color: #ffffff;
    background: #2f3642;
    border: 1px solid #3f495b;
    font-size: 0.95rem;
    cursor: grab;
    user-select: none;
    touch-action: none;
    filter: drop-shadow(0 0 1px rgba(255,255,255,0.35));
}
.plugin-option-drag-handle:hover { background: #3b4555; }
.plugin-option-drag-handle:active { cursor: grabbing; }
.plugin-option input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: #6ea6c9;
    cursor: pointer;
    flex-shrink: 0;
}
.plugin-option-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.plugin-option-text .name {
    font-size: 1.05rem;
    color: #f0e6d2;
    font-weight: 500;
}
.plugin-option-text .desc {
    font-size: 0.85rem;
    color: #9aa4b3;
}

/* 把手：白色手 emoji（Unicode U+270B），如系统无白色变体，至少保证颜色是白色的粗体字
   （使用文字形式：\270B\FE0E + color:#fff 强制呈现为文字并染色；系统变体若仍然绘制成彩色，外层白色背景仍可清晰识别白色的语义图标） */
.drag-handle-row,
.drag-handle-col,
.plugin-option-drag-handle {
    color: #ffffff !important;
    text-shadow:
        0 0 2px rgba(255,255,255,0.4),
        0 1px 2px rgba(0,0,0,0.55);
    background-blend-mode: screen;
}

/* === 插件管理：拖拽动画 + 限制范围（参考账号/副本拖动的漂浮克隆效果） === */
.plugin-option.drag-src-ghost {
    opacity: 0.35;
    background: #2a2e36 !important;
    border-style: dashed !important;
}
.plugin-option.drag-over-above { box-shadow: 0 -2px 0 #7cc3ff inset; }
.plugin-option.drag-over-below { box-shadow: 0 2px 0 #7cc3ff inset; }
.plugin-drag-floating {
    position: fixed;
    z-index: 2000;
    pointer-events: none;
    border: 2px solid #c9d7ec;
    border-radius: 16px;
    background: rgba(39, 44, 53, 0.92);
    box-shadow: 0 16px 30px rgba(0,0,0,0.55), 0 0 0 1px #4e647a inset;
    backdrop-filter: blur(3px);
    opacity: 0.95;
    overflow: hidden;
}
.plugin-option.dragging {
    /* 不再仅靠 opacity: 原行被克隆出去后加 ghost 效果 */
    opacity: 0.45;
}

/* === 每周记录：周期按钮网格（每行最多 2 个，同阅读顺序） === */
.weekly-cycle-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 8px 0 18px 0;
}
.weekly-cycle-btn {
    appearance: none;
    border: 1px solid #4a5260;
    background: linear-gradient(180deg, #2a3039, #22262e);
    color: #ecdcbc;
    border-radius: 20px;
    padding: 14px 14px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s, border-color .12s, background .12s;
}
.weekly-cycle-btn:hover {
    border-color: #8fb8e4;
    transform: translateY(-1px);
    background: linear-gradient(180deg, #324150, #27303d);
}
.weekly-cycle-btn:active { transform: translateY(0) scale(0.99); }
.weekly-cycle-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #9aa4b3;
    padding: 24px 8px;
    font-size: 0.98rem;
}
.weekly-cycle-percent {
    font-size: 1.45rem;
    font-weight: 700;
    color: #9ad5ff;
    line-height: 1;
    letter-spacing: 0.5px;
}
.weekly-cycle-name {
    font-size: 0.95rem;
    color: #d4cbb3;
    text-align: center;
    word-break: break-all;
}

/* 柱状图弹窗 */
.modal-chart-content {
    background: #2b2f38;
    border: 2px solid #5c8a6e;
    border-radius: 24px;
    padding: 20px 30px 30px;
    box-shadow: 0 20px 30px black;
    text-align: center;
    color: #ecdbbf;
    width: min(820px, 92vw);
    max-height: 90vh;
    overflow: auto;
}
.modal-chart-content h3 {
    margin: 6px 0 16px;
    color: #d6f2e1;
    letter-spacing: 1px;
}
.modal-chart-close {
    margin-top: 18px;
    background: #3f4652;
    border: 1px solid #7a8394;
    color: #f0e6d2;
    font-size: 1.05rem;
    padding: 6px 26px;
    border-radius: 30px;
    cursor: pointer;
    opacity: 1 !important;
}
.modal-chart-close:hover { background: #556073; }

/* tooltip */
[title] { cursor: help; }

/* 每周记录按钮（随文本自适应，保持与【本周完成率】按钮相近高度） */
.plugin-simple-btn {
    appearance: none;
    width: auto;
    height: auto;
    min-height: 0;
    border: 1px solid #5e6979;
    background: linear-gradient(180deg, #2c323c, #242832);
    color: #ecdbbf;
    font-size: 1.05rem;
    border-radius: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 4px 8px rgba(10,12,14,0.5);
}
.plugin-simple-btn:hover {
    border-color: #8fb8e4;
    background: linear-gradient(180deg, #334150, #27303d);
    transform: translateY(-1px);
    box-shadow: 0 8px 14px rgba(0,0,0,0.45);
}
.plugin-simple-btn:active { transform: translateY(0) scale(0.99); }

/* 导出导入数据 插件布局 */
.impexp-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: auto;
    padding: 4px;
    align-items: center;
    justify-content: center;
}
.impexp-row { width: auto; }
.impexp-row-top {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 12px;
}
.impexp-row-bottom {
    display: flex;
    justify-content: center;
}
/* 导出 / 导入：与【本周完成率】按钮相近的尺寸，不再是大正方形 */
.impexp-square-btn {
    appearance: none;
    width: auto;                /* 取消 100% 宽度，避免随卡片被放大 */
    height: auto;               /* 取消 aspect-ratio 强制正方形 */
    aspect-ratio: unset;
    min-width: 0;
    border: 1px solid #5e6979;
    background: linear-gradient(180deg, #2e3440, #252a33);
    color: #ecdbbf;
    border-radius: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 20px;        /* 与本周完成率 padding 相当的高度感 */
    font-size: 1.0rem;
    white-space: nowrap;
    box-shadow: 0 4px 8px rgba(10,12,14,0.5);
    transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.impexp-square-btn:hover {
    border-color: #8fb8e4;
    background: linear-gradient(180deg, #334150, #27303d);
    transform: translateY(-1px);
    box-shadow: 0 8px 14px rgba(0,0,0,0.45);
}
.impexp-square-btn:active { transform: translateY(0) scale(0.99); }
.impexp-square-btn.impexp-export { border-color: #4c7a5a; background: linear-gradient(180deg, #2a3c33, #232f2a); }
.impexp-square-btn.impexp-export:hover { border-color: #77d19d; }
.impexp-square-btn.impexp-import { border-color: #766944; background: linear-gradient(180deg, #3a3429, #2e2921); }
.impexp-square-btn.impexp-import:hover { border-color: #d5b76e; }
/* 部分导入：适应文本大小 */
.impexp-rect-btn {
    appearance: none;
    min-width: 0;
    width: auto;
    height: auto;
    border: 1px solid #4f586a;
    background: linear-gradient(180deg, #2f3540, #262a32);
    color: #ecdbbf;
    border-radius: 14px;
    cursor: pointer;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 18px;
    gap: 6px;
    white-space: nowrap;
    box-shadow: 0 3px 6px rgba(10,12,14,0.45);
    transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.impexp-rect-btn:hover {
    border-color: #8fb8e4;
    background: linear-gradient(180deg, #334150, #27303d);
    transform: translateY(-1px);
}
.impexp-rect-btn:active { transform: translateY(0) scale(0.995); }

/* 版本记录列表 */
.version-list {
    text-align: left;
    max-height: 60vh;
    overflow-y: auto;
    padding: 6px 8px 8px;
    margin: 10px 0 18px;
}
.version-item {
    border-left: 3px solid #83714c;
    padding: 10px 12px 12px 14px;
    margin-bottom: 12px;
    background: rgba(43, 42, 38, 0.5);
    border-radius: 0 12px 12px 0;
}
.version-item .v-ver {
    font-weight: 700;
    color: #e0c893;
    font-size: 1.05rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
}
.version-item .v-time {
    font-size: 0.88rem;
    color: #b3a995;
    font-weight: 400;
}
.version-item .v-summary {
    margin-top: 6px;
    color: #e4d8c0;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<!-- 自定义背景层（独立最底层） -->
<div id="bgLayer"></div>

<div class="app-container" id="app">

    <!-- 可编辑标题 + 版本号 + 版本记录按钮 -->
    <div class="title-row">
        <h1 id="mainTitle" class="editable-title">周常记录</h1>
        <div class="title-meta">
            <span class="version-tag" id="versionTag" title="当前版本号">V1.0.0.1</span>
            <button class="btn version-btn" id="openVersionModalBtn" title="查看版本记录">📋 版本</button>
        </div>
    </div>

    <!-- 顶部操作栏 -->
    <div class="action-bar">
        <button class="btn" id="addAccountBtn">➕ 添加账号</button>
        <button class="btn" id="addDungeonBtn">➕ 添加副本</button>
        <button class="btn reset-btn" id="resetDoneBtn">⟲ 重置</button>
        <!-- 新增：插件按钮 -->
        <button class="btn plugin-btn" id="openPluginMgrBtn">🧩 插件</button>
        <!-- 新增：自定义背景图按钮（打开/删除 拆分：确认选图 = 打开文件，删除 = 独立按钮） -->
        <button class="btn bg-btn" id="openBgBtn">🖼️ 背景图</button>
        <button class="btn" id="delBgBtn" style="background:#5a2e2e;border-color:#a86a6a;color:#f8d6d6;" title="删除当前使用的背景图，恢复默认渐变">🗑️ 删除背景</button>
        <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
        <!-- 上次重置时间 -->
        <div class="last-reset-info">上次重置：<b id="lastResetText">—— 未重置过 ——</b></div>
    </div>

    <!-- 表格上方工具条：靠左侧显示详情权限切换按钮 -->
    <div class="table-toolbar">
        <button class="toggle-eye-btn active" id="toggleEyeBtn" title="切换账号详情弹窗的内容显示权限">
            <span id="toggleEyeIcon">👁</span>
            <span id="toggleEyeText">当前显示账号</span>
        </button>
    </div>

    <!-- 表格主体 -->
    <div id="tableWrapper" class="table-wrapper"></div>

    <!-- 插件栏（表格下方） -->
    <div id="pluginBar" class="plugin-bar"></div>

    <!-- 二次确认弹窗 -->
    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-content" id="confirmModalBox">
            <p id="modalMessage">确认删除？</p>
            <div class="modal-actions">
                <button class="modal-btn" id="modalCancel">取消</button>
                <button class="modal-btn confirm" id="modalConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 柱状图弹窗 -->
    <div id="chartModal" class="modal-overlay hidden">
        <div class="modal-chart-content" id="chartModalBox">
            <h3 id="chartTitle">本周副本完成率</h3>
            <canvas id="barChartCanvas" width="760" height="420"></canvas>
            <br>
            <button class="modal-chart-close" id="chartCloseBtn">关闭</button>
        </div>
    </div>

    <!-- 插件勾选弹窗（支持拖动手柄排序） -->
    <div id="pluginMgrModal" class="modal-overlay hidden">
        <div class="modal-list-content" id="pluginMgrBox">
            <h3>🧩 插件管理</h3>
            <div id="pluginOptionList" class="plugin-list"></div>
            <div class="modal-actions">
                <button class="modal-btn" id="pluginMgrClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 每周记录 第1层：周期列表 -->
    <div id="weeklyModal" class="modal-overlay hidden">
        <div class="modal-list-content" style="width: min(720px,94vw); max-height: 82vh;">
            <h3 id="weeklyModalTitle">📆 每周记录</h3>
            <div id="weeklyCycleGrid" class="weekly-cycle-grid"></div>
            <div class="modal-actions">
                <button class="modal-btn" id="weeklyModalClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 版本记录弹窗 -->
    <div id="versionModal" class="modal-overlay hidden">

/* 插件栏 DOM 内按钮事件：openChartBtn / rate-btn / rateInput / rateResult
   多次调用先卸载旧监听，避免重建 DOM 后重复触发
   声明放在 IIFE 外层，保证 init 首次执行前已完成初始化
*/
var _pluginBarEventHandles = [];
function _on(el, evt, fn, opts) {
    if (!el) return;
    el.addEventListener(evt, fn, opts);
    _pluginBarEventHandles.push({ el: el, evt: evt, fn: fn, opts: opts });
}
function bindPluginBarEvents() {
    for (var i = 0; i < _pluginBarEventHandles.length; i++) {
        var h = _pluginBarEventHandles[i];
        try { h.el.removeEventListener(h.evt, h.fn, h.opts); } catch(e) {}
    }
    _pluginBarEventHandles.length = 0;
    var openChartBtn = document.getElementById('openChartBtn');
    if (openChartBtn) _on(openChartBtn, 'click', openChartModal);
    document.querySelectorAll('.rate-btn').forEach(function(btn) {
        _on(btn, 'click', function(e) {
            e.stopPropagation();
            var step = parseFloat(btn.dataset.step);
            if (isNaN(step)) return;
            var input = document.getElementById('edRateInput');
            var val = parseFloat(input.value); if (isNaN(val)) val = 0;
            val = Math.max(0, Math.round((val + step) * 1000) / 1000);
            input.value = val; appData.edRate = val; saveData(); renderPluginBar();
        });
    });
    var rateInput = document.getElementById('edRateInput');
    if (rateInput) {
        _on(rateInput, 'change', function() {
            var v = parseFloat(rateInput.value); if (isNaN(v) || v < 0) v = 0;
            rateInput.value = v; appData.edRate = v; saveData(); renderPluginBar();
        });
        _on(rateInput, 'input', function() {
            var v = parseFloat(rateInput.value); if (isNaN(v) || v < 0) return;
            appData.edRate = v; saveData(); renderPluginBar();
        });
    }
    var edRateResult = document.getElementById('edRateResult');
    if (edRateResult) {
        _on(edRateResult, 'click', function handler() {
            var totalED = getProgressStats().totalED;
            var initial = (totalED * appData.edRate).toFixed(2);
            startInlineEdit(edRateResult, {
                initialValue: initial, type: 'number', align: 'center', min: 0,
                validator: function(v) { var n = parseFloat(v); return (isNaN(n) || n < 0) ? 0 : n; },
                onSave: function(n) {
                    var totalED2 = getProgressStats().totalED;
                    appData.edRate = totalED2 > 0 ? Math.round(n / totalED2 * 1000) / 1000 : 0;
                    saveData();
                },
                afterFinish: function() { renderPluginBar(); }
            });
        });
    }
}

/* ============================================================================

 *  喊一下我，我会把每个插件的 render(el)/bind()/onSave()/onLoad() 挂回注册表，
 *  并把下面 buildPluginBarDOM 的 if/else 分派、bindPluginBarEvents 的分支分派
 *  统一改成注册表遍历回调，做到真正的"一处注册、自动生成、自动绑定"。
 *
 *  ---------------------------
 *  【给其他 AI：如何新增一个插件（在未重构前按下面 4 步硬编码新增即可）】
 *  ---------------------------
 *  Step 1 — 在下面 `PLUGIN_REGISTRY` 数组里 push 一项：
 *           { id:'你的插件唯一ID', name:'按钮/卡片上方标题', desc:'一句话简述功能给插件列表tooltip使用', defaultEnabled:true }
 *         * 注意 id 必须唯一，不要跟现有 progressRate / edStat / weeklyRecord / impExp 冲突。
 *
 *  Step 2 — CSS：在本文件 <style> 区找"插件栏/插件1/插件2/..."对应的位置（或任意靠后
 *         的 .plugin-xxx 类区域），为你的插件写 .plugin-你的id-btn / .plugin-你的id-card
 *         等自定义样式。通用类名有：.plugin-card / .plugin-title / .plugin-simple-btn
 *         （方形按钮）、.impexp-square-btn（方形）、.impexp-rect-btn（长方形）——
 *         若样式不特殊，直接复用 .plugin-simple-btn 即可。
 *
 *  Step 3 — HTML 渲染：去 `buildPluginBarDOM()` 函数，在 `else if (plug.id === 'impExp')`
 *         分支之后、`else if (plug.id === '_VER_PLACEHOLDER_')` 之前新增：
 *             } else if (plug.id === '你的插件唯一ID') {

 *                                      🎯 按钮显示文字
 *                                   </button>`;

 *         然后在 buildPluginBarDOM 末尾（bindImpExpEvents 前后）加事件绑定：
 *             const myBtn = document.getElementById('你的插件唯一ID_btn');
 *             if (myBtn) myBtn.addEventListener('click', 你的处理函数名);
 *         如果你的插件需要展示更复杂 DOM（不是单个按钮），把 HTML 写到 card.innerHTML 里即可，
 *         插件栏已固定在两列 grid 内，宽度自适应。
 *
 *  Step 4 — 实时刷新 / 开关与排序：
 *         · 你需要根据数据刷新 UI 时，调用 renderPluginBar() 会统一刷新当前页所有已
 *           开启插件的显示（启用/隐藏由 appData.enabledPlugins[id] 控制，自动显隐）。
 *         · 插件栏的"显示顺序"由 appData.pluginOrder 控制，插件管理弹窗拖拽后会
 *           自动保存 & 重排 getOrderedPluginRegistry()，不需要你手动处理。
 *         · 如果你要持久化数据，把字段加到 `getDefaultData()` 返回对象里（类似
 *           weeklyRecords），同时在 saveData/loadData/normalize 三处做对应兼容；
 *           若只是临时 UI 状态，放普通 let 变量就行。
 *         · 若你的插件含弹窗，记得把弹窗遮罩加到 Esc 处理栈（init() 里 Esc 分支），
 *           并用新的 z-index 层（比 1080/1100/1200/1300 大）避免被其他弹窗盖住。
 *         · 若你的插件在"重置时要做事"，去 handleReset() 里对相应重置回调函数追加调用。
 * ============================================================================ */
/* ---------- 插件注册表：后续新增"新增插件"只需加一项 ---------- */
const PLUGIN_REGISTRY = [
    {
        id: 'progressRate',
        name: '本周完成率',
        desc: '显示完成率百分比，点击展开柱状图',

/* ============================================================
 *  每周记录（历史快照 & 两层弹窗）
 *  每个周期快照：{ cycleStartISO, cycleEndISO, dungeons, dungeonDoneCounts, accountCount, pct, capturedAt }
 *  - cycleStartISO：该周期起始（周三 09:00）
 *  - 每次重置：写入对应的"周期"数据，同周期内多次重置覆盖
 *  - 最多 10 条，超过则删除最旧
 * ============================================================ */
const WEEKLY_HISTORY_MAX = 10;
function getCycleEnd(startDate) {
    const d = new Date(startDate);
    d.setDate(d.getDate() + 7);
    d.setSeconds(d.getSeconds() - 1);
    return d;
}
function formatCycleName(startDate) {
    const s = new Date(startDate);
    const e = getCycleEnd(s);
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    // 周期2026.8.26~2026.9.2（去掉月份/日期前导0，保持和用户需求一致的格式）
    return `周期${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()}~${e.getFullYear()}.${e.getMonth()+1}.${e.getDate()}`;
}
function makeCycleKey(startDate) {
    // 以周起始 00:00 UTC-like 本地日戳字符串作为去重 key（不丢失秒级在同一天就不会产生多条）
    const s = new Date(startDate);
    return `${s.getFullYear()}-${s.getMonth()+1}-${s.getDate()}`;
}
function snapshotCurrentWeek() {
    const stats = getProgressStats(); // {pct, totalValid, done, totalED}
    const doneCounts = [];
    const N = appData.dungeons.length;
    const M = appData.accounts.length;
    for (let d = 0; d < N; d++) {
        let c = 0;
        for (let a = 0; a < M; a++) {
            if ((appData.states[a] && appData.states[a][d]) === 'done') c++;
        }
        doneCounts.push(c);
    }
    return {
        dungeons: appData.dungeons.slice(),
        dungeonDoneCounts: doneCounts,
        accountCount: M,
        totalValid: stats.totalValid,
        done: stats.done,
        pct: stats.pct
    };
}
/**
 * 重置时写入每周记录：
 * 1) 每个"周期"只保存 1 条（同周期多次重置覆盖）。
 * 2) 边界规则：如果重置发生在"新周期开始后的 24 小时内"，
 *    且当前 weeklyRecords 内没有"上一个周期"的记录，则把这次快照写入"上一个周期"；
 *    若上一个周期已有记录，则写入"当前周期"。
 * 3) 超过 10 条 → 按 cycleStart 升序删最旧。
 */
function recordWeeklyOnReset() {
    const nowTs = Date.now();
    const curStart = getCycleStart(nowTs); // 当前周期起始
    const curStartTs = curStart.getTime();
    const prevStartTs = curStartTs - 7 * 24 * 3600 * 1000;
    const inFirst24h = (nowTs - curStartTs) <= 24 * 3600 * 1000;

    if (!Array.isArray(appData.weeklyRecords)) appData.weeklyRecords = [];
    const list = appData.weeklyRecords;

    // 判断上一个周期是否已有记录
    const hasPrev = list.some(r => Math.abs(new Date(r.cycleStartISO).getTime() - prevStartTs) < 60000);

    // 决定写入哪个周期
    let targetStartTs;
    if (inFirst24h && !hasPrev) targetStartTs = prevStartTs;
    else targetStartTs = curStartTs;

    const targetKey = makeCycleKey(targetStartTs);
    const snap = snapshotCurrentWeek();
    const record = {
        cycleKey: targetKey,
        cycleStartISO: new Date(targetStartTs).toISOString(),
        cycleEndISO: getCycleEnd(new Date(targetStartTs)).toISOString(),
        dungeons: snap.dungeons,
        dungeonDoneCounts: snap.dungeonDoneCounts,
        accountCount: snap.accountCount,
        totalValid: snap.totalValid,
        done: snap.done,
        pct: snap.pct,
        capturedAt: new Date(nowTs).toISOString()
    };

    const idx = list.findIndex(r => r.cycleKey === targetKey);
    if (idx >= 0) list[idx] = record;
    else list.push(record);

    // 按 cycleStart 降序保留最新 10 条
    list.sort((a, b) => new Date(b.cycleStartISO).getTime() - new Date(a.cycleStartISO).getTime());
    if (list.length > WEEKLY_HISTORY_MAX) list.length = WEEKLY_HISTORY_MAX;

    // 保存到 localStorage
    saveData();
}

/* 根据 appData.pluginOrder 给 PLUGIN_REGISTRY 排序（阅读顺序：上→下 对应 左上→右上→左下→右下…）
   新插件会自动补在最后，保存结果回 appData.pluginOrder */
function getOrderedPluginRegistry() {
    if (!appData) return PLUGIN_REGISTRY.slice();
    const order = Array.isArray(appData.pluginOrder) ? appData.pluginOrder.slice() : [];
    const allIds = PLUGIN_REGISTRY.map(p => p.id);
    // 去重 & 丢掉不存在的 id
    const seen = new Set();
    const cleaned = [];
    for (const id of order) {
        if (allIds.indexOf(id) >= 0 && !seen.has(id)) { cleaned.push(id); seen.add(id); }
    }
    // 尾部补齐新加的插件
    for (const id of allIds) {
        if (!seen.has(id)) { cleaned.push(id); }
    }
    appData.pluginOrder = cleaned;
    const map = PLUGIN_REGISTRY.reduce((m, p) => { m[p.id] = p; return m; }, {});
    return cleaned.map(id => map[id]);
}
function swapPluginOrder(fromIndex, toIndex) {
    const ordered = getOrderedPluginRegistry(); // 会修正 pluginOrder
    const ids = ordered.map(p => p.id);
    if (fromIndex < 0 || toIndex < 0 || fromIndex >= ids.length || toIndex >= ids.length) return false;
    const [it] = ids.splice(fromIndex, 1);
    ids.splice(toIndex, 0, it);
    appData.pluginOrder = ids;
    return true;
}

/* ---------- 全局数据模型 ---------- */
let appData = null;
function getDefaultData() {
    return {
        title: TITLE_DEFAULT,
        accounts: [],
        dungeons: [],
        states: [],
        edRate: 1.0,
        lastResetTime: null,
        eyesOpen: true,
        enabledPlugins: PLUGIN_REGISTRY.reduce((o, p) => (o[p.id] = p.defaultEnabled, o), {}),
        pluginOrder: PLUGIN_REGISTRY.map(p => p.id),
        backgroundImage: null,
        weeklyRecords: []
    };
}
/* 旧版本数据 → 新版本字段迁移：
 *  旧字段：accountNumber(账号) / password / showMode / ...
 *  新字段：account / password / pin2(二级密码) / accNote(账号备注) / eyesOpen(显隐开关)
 */
function normalizeAccountObject(a) {
    if (!a || typeof a !== 'object') a = {};
    const newAcc = {
        name: a.name ? String(a.name) : '未命名账号',
        // note：保留为副本备注（就是表格的备注列），不要和 accNote 混淆
        note: ('note' in a) ? String(a.note || '') : '',
        ed: typeof a.ed === 'number' ? a.ed : (parseInt(a.ed, 10) || 0),
        // 账号（优先用新字段 account，否则回退旧字段 accountNumber，否则空）
        account: (a.account && typeof a.account === 'string') ? a.account : (a.accountNumber ? String(a.accountNumber) : ''),
        password: ('password' in a) ? String(a.password || '') : '',
        pin2: ('pin2' in a) ? String(a.pin2 || '') : '',
        // 账号详情里单独的"账号备注"（独立于表格备注列）
        accNote: ('accNote' in a) ? String(a.accNote || '') : ''
    };
    return newAcc;
}

/* ---------- 数据加载/保存 ---------- */
function loadData() {
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.dungeons) && Array.isArray(parsed.states)) {
                const def = getDefaultData();
                appData = Object.assign(def, parsed);
                appData.accounts = parsed.accounts.map(normalizeAccountObject);
                if (!Array.isArray(appData.states)) appData.states = [];
                if (typeof appData.edRate !== 'number' || isNaN(appData.edRate)) appData.edRate = 1.0;
                if (typeof appData.lastResetTime !== 'string') appData.lastResetTime = null;
                // showMode 是旧字段（账号/密码切换），新版本用 eyesOpen 控制详情显隐；有值就迁移成 eyesOpen 默认 true
                if (typeof appData.eyesOpen !== 'boolean') appData.eyesOpen = true;
                if (!appData.enabledPlugins || typeof appData.enabledPlugins !== 'object') {
                    appData.enabledPlugins = PLUGIN_REGISTRY.reduce((o, p) => (o[p.id] = p.defaultEnabled, o), {});
                } else {
                    PLUGIN_REGISTRY.forEach(p => {
                        if (typeof appData.enabledPlugins[p.id] !== 'boolean') {
                            appData.enabledPlugins[p.id] = p.defaultEnabled;
                        }
                    });
                }
                // pluginOrder：规整（丢无效 id + 补新增插件 id）
                if (!Array.isArray(appData.pluginOrder)) {
                    appData.pluginOrder = PLUGIN_REGISTRY.map(p => p.id);
                } else {
                    const all = PLUGIN_REGISTRY.map(p => p.id);
                    const seen = new Set(); const ok = [];
                    appData.pluginOrder.forEach(id => {
                        if (all.indexOf(id) >= 0 && !seen.has(id)) { ok.push(id); seen.add(id); }
                    });
                    all.forEach(id => { if (!seen.has(id)) ok.push(id); });
                    appData.pluginOrder = ok;
                }
                if (typeof appData.backgroundImage !== 'string') appData.backgroundImage = null;
                if (!Array.isArray(appData.weeklyRecords)) {
                    appData.weeklyRecords = [];
                } else {
                    // 丢掉格式不合法项 + 维持最多 10 条 + 按 cycleStartISO 排序从新到旧
                    appData.weeklyRecords = appData.weeklyRecords
                        .filter(r => r && typeof r.cycleStartISO === 'string' && Array.isArray(r.dungeonDoneCounts))
                        .sort((a, b) => new Date(b.cycleStartISO).getTime() - new Date(a.cycleStartISO).getTime())
                        .slice(0, WEEKLY_HISTORY_MAX);
                }
                normalizeStatesSize();
                return;
            }
        }
    } catch (e) { /* ignore */ }
    appData = getDefaultData();
}
function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e) {}
}

/* ---------- states 规整 ---------- */
function normalizeStatesSize() {
    const M = appData.accounts.length;
    const N = appData.dungeons.length;
    if (appData.states.length < M) {
        for (let i = appData.states.length; i < M; i++) appData.states.push(new Array(N).fill('todo'));
    }
    for (let i = 0; i < M; i++) {
        if (!Array.isArray(appData.states[i])) appData.states[i] = [];
        while (appData.states[i].length < N) appData.states[i].push('todo');
        if (appData.states[i].length > N) appData.states[i].length = N;
    }
    if (appData.states.length > M) appData.states.length = M;
}

/* ---------- 周周期工具 ---------- */
function getCycleStart(date) {
    const d = new Date(date || Date.now());
    const today = new Date(d.getFullYear(), d.getMonth(), d.getDate(), WEEK_CYCLE.hour, WEEK_CYCLE.minute, 0, 0);
    let day = today.getDay();
    let diff = day - WEEK_CYCLE.weekDay;
    if (diff < 0) diff += 7;
    let start = new Date(today);
    start.setDate(today.getDate() - diff);
    if (start.getTime() > d.getTime()) start.setDate(start.getDate() - 7);
    return start;
}

/* ---------- 格式化上次重置时间 ---------- */
function formatLastReset(isoStr) {
    if (!isoStr) return '—— 未重置过 ——';
    try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return '—— 未重置过 ——';
        const pad = (n) => (n < 10 ? '0' + n : '' + n);
        const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} ${weekdays[d.getDay()]}`;
    } catch(e) { return '—— 未重置过 ——'; }
}

/* ---------- HTML 转义 ---------- */
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"]/g, c => (c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'));
}

    if (activeEditor && typeof activeEditor.commit === 'function') {
        activeEditor.commit(true);
        activeEditor = null;
    } else if (typeof activeEditor === 'function') {
        activeEditor();
        activeEditor = null;
    }
}

/* ============================================================
 *  进度统计 & 插件栏渲染
 * ============================================================ */
function getProgressStats() {
    const M = appData.accounts.length;
    const N = appData.dungeons.length;
    let totalValid = 0, done = 0;
    for (let a = 0; a < M; a++) {
        for (let d = 0; d < N; d++) {
            const st = (appData.states[a] && appData.states[a][d]) || 'todo';
            if (st === 'skipped') continue;
            totalValid++;
            if (st === 'done') done++;
        }
    }
    const pct = totalValid ? Math.round(done / totalValid * 100) : 0;
    const totalED = appData.accounts.reduce((s, a) => s + (Number(a.ed) || 0), 0);
    return { pct, totalValid, done, totalED };
}

function drawProgressCircle(pct) {
    const cv = document.getElementById('progressCircle');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 80, 80);
    ctx.beginPath();
    ctx.arc(40, 40, 32, 0, 2 * Math.PI);
    ctx.strokeStyle = '#3b434f'; ctx.lineWidth = 8; ctx.stroke();
    ctx.beginPath();
    ctx.arc(40, 40, 32, -Math.PI/2, (pct/100)*2*Math.PI - Math.PI/2);
    ctx.strokeStyle = '#bda46b'; ctx.lineWidth = 8; ctx.stroke();
}

function renderPluginBar() {
    const stats = getProgressStats();
    drawProgressCircle(stats.pct);
    const pctSpan = document.getElementById('progressPercent');
    if (pctSpan) pctSpan.innerText = stats.pct + '%';

    // ED统计相关
    const edEl = document.getElementById('edTotalDisplay');
    if (edEl) edEl.innerHTML = `<span>ED</span> ${stats.totalED}`;
    const rateInput = document.getElementById('edRateInput');
    if (rateInput) rateInput.value = appData.edRate;
    const resEl = document.getElementById('edRateResult');
    if (resEl) resEl.innerText = (stats.totalED * appData.edRate).toFixed(2);

/* ============================================================
 *  柱状图
 * ============================================================ */
function renderDungeonBarChart(weeklyRecord) {
    const canvas = document.getElementById('barChartCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // 支持历史周期快照（weeklyRecord）传入：优先用快照数据，否则取本周数据
    let dungeons, doneCounts, totalAcc;
    if (weeklyRecord && Array.isArray(weeklyRecord.dungeons) && Array.isArray(weeklyRecord.dungeonDoneCounts)) {
        dungeons = weeklyRecord.dungeons;
        doneCounts = weeklyRecord.dungeonDoneCounts;
        totalAcc = Math.max(0, parseInt(weeklyRecord.accountCount, 10) || 0);
    } else {
        dungeons = appData.dungeons;
        const N = dungeons.length;
        doneCounts = [];
        totalAcc = appData.accounts.length;
        for (let i = 0; i < N; i++) {
            let c = 0;
            for (let a = 0; a < totalAcc; a++) {
                if ((appData.states[a] && appData.states[a][i]) === 'done') c++;
            }
            doneCounts.push(c);
        }
    }
    const N = dungeons.length;

    const padL = 60, padR = 40, padT = 30, padB = 80;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    ctx.fillStyle = '#1d2026';
    ctx.fillRect(padL, padT, chartW, chartH);

    const ySteps = Math.min(6, totalAcc || 1);
    ctx.strokeStyle = '#2e333b';
    ctx.fillStyle = '#a8a69d';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= ySteps; i++) {
        const val = Math.round(i * totalAcc / ySteps);
        const y = padT + chartH - (val / Math.max(totalAcc, 1)) * chartH;
        ctx.beginPath();
        ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y);
        ctx.stroke();
        ctx.fillText(String(val), padL - 6, y);
    }

    if (N === 0) {
        ctx.fillStyle = '#a4a199';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无副本', W / 2, H / 2);
        return;
    }

    const barGap = Math.min(20, Math.max(4, chartW / N * 0.2));
    const barTotalW = (chartW - barGap * (N + 1)) / N;

    for (let i = 0; i < N; i++) {
        const doneCount = doneCounts[i] || 0;
        const ratio = totalAcc === 0 ? 0 : doneCount / totalAcc;
        const barH = ratio * chartH;
        const x = padL + barGap + i * (barTotalW + barGap);
        const y = padT + chartH - barH;
        const grad = ctx.createLinearGradient(0, y, 0, padT + chartH);
        grad.addColorStop(0, '#3fd684');
        grad.addColorStop(1, '#1d4f3b');
        ctx.fillStyle = grad;
        const radius = Math.min(10, barTotalW / 3);
        roundRect(ctx, x, y, barTotalW, barH, radius);
        ctx.fill();
        ctx.fillStyle = '#d8f1d9';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(String(doneCount), x + barTotalW / 2, y - 4);

        ctx.save();
        const labelX = x + barTotalW / 2;
        const labelY = padT + chartH + 14;
        ctx.translate(labelX, labelY);
        if (N > 10) ctx.rotate(-Math.PI / 6);
        ctx.fillStyle = '#bfb195';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        let name = dungeons[i] || '';
        if (name.length > 10) name = name.slice(0, 9) + '…';
        ctx.fillText(name, 0, 0);
        ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = '#b8b4a4';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.translate(16, padT + chartH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('完成次数', 0, 0);
    ctx.restore();

    ctx.fillStyle = '#d4c4a0';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('账号数：' + totalAcc, padL, H - 14);
}
function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

/* ============================================================
 *  通用：单击即进入内联编辑
 * ============================================================ */
function startInlineEdit(containerEl, opts) {
    finishEditing();
    if (!containerEl) return;
    const pos = getComputedStyle(containerEl).position;
    if (pos === 'static') containerEl.style.position = 'relative';

    // 需求 2/3 修复：进入编辑时，隐藏原文容器的真实子内容（编辑框自身除外），
    // 让输入框彻底盖住原位置，不会"和原文重叠露出字"
    // （但必须保留容器高度，让位置不变——所以用 visibility 而非 display:none）
    const savedVisibility = containerEl.style.visibility;
    Array.prototype.forEach.call(containerEl.children || [], function(child) {
        if (child && child.style) child.dataset._editOldVis = child.style.visibility;
    });
    // 不隐藏父容器（会让输入框也消失）；把直接文本/子节点都改 hidden：
    // 简化方案：给容器加个 CSS class，让其"除 inline-edit-wrap 之外的文本+子元素"都隐藏
    containerEl.classList.add('_editing-active');

    const wrap = document.createElement('div');
    wrap.className = 'inline-edit-wrap' + (opts.align === 'left' ? ' left' : '');
    const input = document.createElement('input');
    input.type = opts.type || 'text';
    input.value = (opts.initialValue === undefined || opts.initialValue === null) ? '' : String(opts.initialValue);
    input.className = 'edit-input' + (opts.className ? ' ' + opts.className : '');
    if (opts.min !== undefined) input.min = opts.min;
    if (opts.max !== undefined) input.max = opts.max;
    wrap.appendChild(input);
    containerEl.appendChild(wrap);

    const doFinish = (commit) => {
        if (input.dataset.finished) return;
        input.dataset.finished = '1';
        let val = input.value;
        try { input.remove(); } catch(e) {}
        try { wrap.remove(); } catch(e) {}
        // 恢复容器内原文的可见性
        try {
            containerEl.classList.remove('_editing-active');
            containerEl.style.visibility = savedVisibility || '';
            Array.prototype.forEach.call(containerEl.children || [], function(child) {
                if (child && child.dataset && '_editOldVis' in child.dataset) {
                    child.style.visibility = child.dataset._editOldVis;
                    delete child.dataset._editOldVis;
                }
            });
        } catch (_) {}
        if (commit) {
            let cleaned = val;
            if (opts.validator) { try { cleaned = opts.validator(val); } catch(e) { cleaned = val; } }
            if (opts.onSave) opts.onSave(cleaned);
        } else if (opts.onCancel) {
            opts.onCancel();
        }
        activeEditor = null;
        if (opts.afterFinish) opts.afterFinish(commit);
    };
    activeEditor = { commit: doFinish };

    input.addEventListener('blur', () => setTimeout(() => doFinish(true), 0));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doFinish(true); }
        if (e.key === 'Escape') { doFinish(false); }
    });

    setTimeout(() => {
        try {
            input.focus();
            if (input.type === 'number' && typeof input.setSelectionRange === 'function') {
                try {
                    const endPos = String(input.value).length;
                    const p = Math.max(0, Math.floor(endPos / 2));
                    input.setSelectionRange(p, p);
                } catch(e) {}
            } else if (typeof input.setSelectionRange === 'function') {
                try { input.setSelectionRange(0, String(input.value).length); } catch(e) {}
            }
        } catch(e) {}
    }, 0);
}

/* ============================================================
 *  备注列：记事本式实时编辑（区别于 startInlineEdit 的失焦保存）
 *  - 每次输入立即写回 appData 并 saveData（250ms debounce 合并连击）
 *  - 失焦 / Enter = 完成并关闭；Esc = 放弃本次修改，恢复进入编辑前的原文
 * ============================================================ */
function startLiveNoteEdit(noteTd, accIdx) {
    finishEditing();   // 先关闭上一个编辑器（如有）
    const acc = appData.accounts[accIdx];
    if (!acc) return;

    // 隐藏原文（复用 _editing-active 机制，输入框原地覆盖）
    noteTd.classList.add('_editing-active');

    const wrap = document.createElement('div');
    wrap.className = 'inline-edit-wrap left';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = acc.note || '';
    input.className = 'edit-input';
    wrap.appendChild(input);
    noteTd.appendChild(wrap);

    const st = {
        timer: null,
        original: acc.note || '',
        released: false
    };

    // 输入即存：只写数据，不重绘表格（重绘会销毁正在编辑的输入框）
    const flushSave = () => {
        if (st.timer) { clearTimeout(st.timer); st.timer = null; }
        if (st.released) return;
        const a = appData.accounts[accIdx];
        if (!a) return;
        a.note = input.value;
        noteTd.title = input.value;
        saveData();
    };

    // 关闭编辑器并恢复单元格显示（不触发 renderTable，避免递归销毁）
    const release = (commit) => {
        if (st.released) return;
        st.released = true;
        if (st.timer) { clearTimeout(st.timer); st.timer = null; }
        const val = commit ? input.value : st.original;
        const a = appData.accounts[accIdx];
        if (a) { a.note = val; saveData(); }
        try { input.remove(); } catch(e) {}
        try { wrap.remove(); } catch(e) {}
        noteTd.classList.remove('_editing-active');
        noteTd.innerHTML = escapeHtml(val);
        noteTd.title = val;
        if (activeEditor === release) activeEditor = null;
    };
    // 注册到全局编辑器槽：renderTable/finishEditing 会以 commit=true 关闭本编辑器
    activeEditor = release;

    input.addEventListener('input', () => {
        if (st.timer) clearTimeout(st.timer);
        st.timer = setTimeout(flushSave, 250);
    });
    input.addEventListener('blur', () => setTimeout(() => release(true), 0));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); release(true); }
        if (e.key === 'Escape') { release(false); }
    });

    setTimeout(() => {
        try {
            input.focus();
            if (typeof input.setSelectionRange === 'function') {
                input.setSelectionRange(0, String(input.value).length);
            }
        } catch(e) {}
    }, 0);
}

// 把 bjTimeISO（支持 +08:00）格式化为「YYYY-MM-DD HH:mm」北京时间字符串
function formatBJTime(isoStr) {
    try {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        // 直接用 ISO 字符串 + 偏移反推北京时间（避免用户电脑时区不对）
        let utcMs = d.getTime();
        // 不管用户本地时区，+8h 后格式化得到北京时间
        const bj = new Date(utcMs + 8 * 3600 * 1000);
        const pad = (n) => String(n < 10 ? '0' + n : n);
        // toISOString 给 UTC：正好就是东八区时间，因为我们手动 +8h
        const iso = bj.toISOString();
        const Y = iso.slice(0, 4);
        const M = iso.slice(5, 7);
        const D = iso.slice(8, 10);
        const hh = iso.slice(11, 13);
        const mm = iso.slice(14, 16);
        return `${Y}-${M}-${D} ${hh}:${mm}`;
    } catch (e) { return isoStr || ''; }
}

    } else {

    try {

        const vh82 = Math.round(window.innerHeight * 0.82);     // 视口 82% 兜底

        const reservedForChrome = 140;

        listEl.style.maxHeight = listMaxH + 'px';

}

/* ============================================================
 *  导出导入数据插件（3 按钮：导出 / 导入 / 部分导入）
 *  - 导出内容：仅表格相关数据（不含插件开关/排序/背景/每周历史等"插件内容"）
 *  - 完全导入：覆盖当前 accounts/dungeons/states/edRate/account/password/pin2/accNote 等表格字段
 *  - 部分导入：覆盖时保留当前所有 "skipped"(✗) 状态单元格不变
 * ============================================================ */
// 导出：仅表格字段的纯数据
function buildTableExportSnapshot() {
    // 强制同步当前尺寸：保证导入后 accounts × dungeons 规模一致
    normalizeStatesSize();
    const snap = {
        _magic: 'AbyssWeeklyTable',
        _v: 2,
        title: appData.title || TITLE_DEFAULT,
        lastResetTime: typeof appData.lastResetTime === 'string' ? appData.lastResetTime : null,
        edRate: typeof appData.edRate === 'number' ? appData.edRate : 1.0,
        eyesOpen: appData.eyesOpen !== false,
        accounts: appData.accounts.map(a => ({
            name: a.name || '',
            account: a.account || '',
            password: a.password || '',
            pin2: a.pin2 || '',
            note: a.note || '',
            accNote: a.accNote || '',
            ed: typeof a.ed === 'number' ? a.ed : 0
        })),
        dungeons: appData.dungeons.slice(),
        states: appData.states.map(row => row.slice())
    };
    return snap;
}
function validateTableSnapshot(obj) {
    if (!obj || typeof obj !== 'object') return '文件内容不是有效对象。';
    if (obj._magic !== 'AbyssWeeklyTable') return '文件不是周常记录导出格式。';
    if (!Array.isArray(obj.accounts) || !Array.isArray(obj.dungeons) || !Array.isArray(obj.states)) {
        return '文件缺失 accounts/dungeons/states 字段。';
    }
    const N = obj.dungeons.length;
    for (let i = 0; i < obj.accounts.length; i++) {
        const row = obj.states[i];
        if (!Array.isArray(row) || row.length !== N) return `第 ${i + 1} 行 states 与副本数不匹配。`;
    }
    return null;
}
// 应用导入数据到 appData。merge = 部分导入（保留 skipped）
function applyTableSnapshot(obj, merge) {
    const err = validateTableSnapshot(obj);
    if (err) { alert(err); return false; }
    appData.title = obj.title || TITLE_DEFAULT;
    appData.lastResetTime = typeof obj.lastResetTime === 'string' ? obj.lastResetTime : null;
    appData.edRate = typeof obj.edRate === 'number' ? obj.edRate : 1.0;
    appData.eyesOpen = obj.eyesOpen !== false;   // 未提供默认睁眼
    appData.accounts = JSON.parse(JSON.stringify(obj.accounts)).map(normalizeAccountObject);
    appData.dungeons = obj.dungeons.map(d => String(d || '未命名副本'));
    const newStates = JSON.parse(JSON.stringify(obj.states));
    if (merge) {
        // 部分导入：当前 states 中 skipped 位置保持不动。如果旧数据规模比导入小/大，尽量按维度重叠区保留。
        const oldA = appData.accounts.length;
        const oldD = appData.dungeons.length;
        const currStates = appData.states;   // 修改前的旧 states（旧规模旧副本）
        // 先对旧 states 对应行和列，把已有的 skipped 标记迁移到 newStates（相同账号索引+相同副本索引位置）
        // 注意：这里"保留打叉"的语义是——当前表格中凡是 ✗(skipped) 的 cell，在覆盖后依然是 skipped，对应(a,d)位置
        // 但因为导入会替换账号和副本列表，我们只能以 index 对齐。这是可解释且可预测的行为。
        const minA = Math.min(oldA, newStates.length);
        const minD = Math.min(oldD, newStates[0] ? newStates[0].length : 0);
        for (let a = 0; a < minA; a++) {
            for (let d = 0; d < minD; d++) {
                if (currStates[a] && currStates[a][d] === 'skipped') {
                    newStates[a][d] = 'skipped';
                }
            }
        }
    }
    appData.states = newStates;
    normalizeStatesSize();
    saveData();
    return true;
}
// 下载：JSON 文件
function exportTableAsFile() {
    const snap = buildTableExportSnapshot();
    const json = JSON.stringify(snap, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const now = new Date();
    const pad = n => String(n < 10 ? '0' + n : n);
    const name = `周常记录表格_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    alert('导出完成，文件名：' + name);
}
// 解析用户选择的文件（自动识别 JSON）
function readFileAsText(file) {
    return new Promise((resolve, reject) => {
        try {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ''));
            reader.onerror = () => reject(new Error('文件读取失败。'));
            reader.readAsText(file, 'utf-8');
        } catch (e) { reject(e); }
    });
}
async function importTableFromFile(file, mode) {
    if (!file) return;
    try {
        const text = await readFileAsText(file);
        let obj = null;
        try { obj = JSON.parse(text); }
        catch (e) {
            alert('文件解析失败：不是合法的 JSON 文本。');
            return;
        }
        const ok = applyTableSnapshot(obj, mode === 'merge');
        if (!ok) return;
        showConfirmDialog(
            mode === 'merge' ? '部分导入成功。是否立即刷新页面以确保数据正确呈现？'
                             : '导入成功。是否立即刷新页面以确保数据正确呈现？',
            () => { location.reload(); }
        );
    } catch (e) {
        alert('导入失败：' + (e && e.message ? e.message : e));
    }
}
function bindImpExpEvents() {
    const exportBtn = document.getElementById('impExpExportBtn');
    const importBtn = document.getElementById('impExpImportBtn');
    const mergeBtn = document.getElementById('impExpMergeBtn');
    const importFile = document.getElementById('impExpImportFile');
    const mergeFile = document.getElementById('impExpMergeFile');
    if (exportBtn) exportBtn.addEventListener('click', exportTableAsFile);
    if (importBtn && importFile) importBtn.addEventListener('click', () => importFile.value = '' || importFile.click());
    if (importFile) {
        importFile.addEventListener('change', () => {
            const f = importFile.files && importFile.files[0];
            if (f) importTableFromFile(f, 'full');
            importFile.value = '';
        });
    }
    if (mergeBtn && mergeFile) mergeBtn.addEventListener('click', () => mergeFile.value = '' || mergeFile.click());
    if (mergeFile) {
        mergeFile.addEventListener('change', () => {
            const f = mergeFile.files && mergeFile.files[0];
            if (f) importTableFromFile(f, 'merge');
            mergeFile.value = '';
        });
    }
}

/* ============================================================
 *  插件管理弹窗（含排序拖拽：列表顺序 ↔ 插件栏阅读顺序 1:1）
 *  拖拽功能：模仿账号/副本拖动，使用漂浮克隆 + 原行 ghost + 插入线，并限制范围在弹窗内
 *  拖动过程中禁止失焦自动关闭（拖拽状态下 blur 忽略）
 * ============================================================ */
let _pluginMgrDragState = null;
function _clearPluginMgrDropMarkers(resetTransform) {
    const list = document.getElementById('pluginOptionList');
    if (!list) return;
    list.querySelectorAll('.plugin-option').forEach(el => {
        el.classList.remove('drop-before', 'drop-after', 'drag-over-above', 'drag-over-below', 'drag-src-ghost');
        if (resetTransform) el.style.transform = '';
