<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>死龙分值计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1e24;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e3e6eb;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: #2a313b;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #3f4a57;
            padding: 28px 24px;
        }

        h2 {
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border-left: 6px solid #c99c47;
            padding-left: 18px;
            color: #f0e9db;
        }

        .attr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 18px;
            margin: 18px 0 25px;
        }

        .attr-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d3844;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #4e6072;
        }

        .attr-name {
            font-weight: 600;
            font-size: 1rem;
            color: #e3dccb;
            white-space: nowrap;
            margin-right: 8px;
        }

        select {
            background: #1e2936;
            color: #eef3fc;
            font-size: 0.95rem;
            padding: 8px 24px 8px 14px;
            border-radius: 40px;
            border: 1px solid #6d829b;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23c0ccda' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            min-width: 90px;
            text-align: center;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #4b5565;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236f7a88' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
        }

        .right-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            background: #1b222a;
            border-radius: 60px;
            padding: 14px 26px;
        }

        .total-score-right {
            background: #2a5f7a;
            padding: 8px 36px;
            border-radius: 40px;
            font-size: 2rem;
            font-weight: 600;
            color: #ffecb3;
        }

        .action-btn {
            background: #555e6b;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #8799b0;
            margin-left: 12px;
        }

        .action-btn:hover {
            background: #6e7b8d;
        }

        .right-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        @media (max-width: 600px) {
            .attr-grid {
                grid-template-columns: 1fr;
            }
            .right-footer {
                flex-direction: column;
                gap: 12px;
            }
            .action-btn {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📐 死龙武器分值计算器</h2>

    <div class="attr-grid" id="attrGridContainer"></div>
    <div class="right-footer">
        <span class="total-score-right" id="rightTotalScore">0</span>
        <div class="right-actions">
            <button class="action-btn" id="calcScoreBtn">确 定</button>
            <button class="action-btn" id="clearAllSelections">清除全部</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 全部词条定义（与模拟器一致，仅含有分数的15条）
        const allStats = [
            { name: '攻击力百分比*强化等级', star: true, values: [1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 0.9, 0.8].map(v => v + '%'), scores: [29,27,24,23,21,20,18,15] },
            { name: '攻击力等级*强化等级', star: true, values: [1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 0.9, 0.8].map(v => v.toFixed(1)), scores: [22,20,19,15,14,13,10,9] },
            { name: '所有技能伤害*强化等级', star: true, values: [1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 0.9, 0.8].map(v => v + '%'), scores: [27,26,24,23,18,14,13,11] },
            { name: '暴击伤害*强化等级', star: true, values: [1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 0.9, 0.8].map(v => v + '%'), scores: [23,21,20,17,14,13,11,9] },
            { name: '攻击力百分比', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [21,20,18,17,14,12,11,9] },
            { name: '攻击力等级', star: false, values: [13,12,11,10,9,8,7,6].map(v => v.toString()), scores: [14,13,11,10,8,7,5,4] },
            { name: '流血', star: false, values: [12,11,10,9,8,7,6,5].map(v => v + '%'), scores: [24,21,20,18,15,14,12,10] },
            { name: '两极化', star: false, values: [12,11,10,9,8,7,6,5].map(v => v + '%'), scores: [24,21,20,18,15,14,12,10] },
            { name: '超越技伤', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [15,14,12,11,9,8,6,5] },
            { name: '强烈技伤', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [15,14,12,11,9,8,6,5] },
            { name: '所有技能伤害', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [17,15,14,12,11,9,8,6] },
            { name: '爆伤', star: false, values: [13,12,11,10,9,8,7,6].map(v => v + '%'), scores: [15,14,12,11,9,8,6,5] },
            { name: '王伤', star: false, values: [15,14,13,12,11,10,9,8].map(v => v + '%'), scores: [15,14,12,11,9,8,6,5] },
            { name: '无视敌人防御力', star: false, values: [8.0,7.5,7.0,6.5,6.0,5.5,5.0,4.5].map(v => v.toFixed(1) + '%'), scores: [3,2,1,0,0,0,0,0] },
            { name: '动作速度', star: false, values: [12,11,10,9,8,7,6,5].map(v => v + '%'), scores: [4,3,3,3,1,0,0,0] }
        ];

        const attrGridContainer = document.getElementById('attrGridContainer');
        const rightTotalScoreSpan = document.getElementById('rightTotalScore');
        const calcScoreBtn = document.getElementById('calcScoreBtn');
        const clearAllBtn = document.getElementById('clearAllSelections');

        let rightSelects = [];

        function buildRightPanel() {
            attrGridContainer.innerHTML = '';
            rightSelects = [];

            allStats.forEach(stat => {
                const row = document.createElement('div');
                row.className = 'attr-row';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'attr-name';
                nameSpan.textContent = stat.name;
                row.appendChild(nameSpan);

                const select = document.createElement('select');
                const blankOption = document.createElement('option');
                blankOption.value = '';
                blankOption.textContent = '— 请选择 —';
                select.appendChild(blankOption);

                stat.values.forEach((val, idx) => {
                    const option = document.createElement('option');
                    option.value = `${stat.name}_${idx}`;
                    option.textContent = val;
                    option.dataset.score = stat.scores[idx];
                    option.dataset.statName = stat.name;
                    option.dataset.tier = idx;
                    select.appendChild(option);
                });

                select.dataset.statName = stat.name;
                select.dataset.scores = JSON.stringify(stat.scores);

                row.appendChild(select);
                attrGridContainer.appendChild(row);
                rightSelects.push(select);
            });

            rightSelects.forEach(sel => sel.addEventListener('change', updateDisabledState));
        }

        function updateDisabledState() {
            const selectedSelects = rightSelects.filter(sel => sel.value !== '');
            const selectedCount = selectedSelects.length;
            if (selectedCount >= 4) {
                rightSelects.forEach(sel => {
                    sel.disabled = sel.value === '';
                });
            } else {
                rightSelects.forEach(sel => sel.disabled = false);
            }
        }

        function calculateScore() {
            let total = 0;
            rightSelects.forEach(sel => {
                if (sel.value !== '') {
                    const idx = sel.selectedIndex;
                    const score = parseInt(sel.options[idx].dataset.score, 10);
                    if (!isNaN(score)) total += score;
                }
            });
            rightTotalScoreSpan.textContent = Math.min(total, 100);
        }

        function clearAllSelections() {
            rightSelects.forEach(sel => {
                sel.value = '';
                sel.disabled = false;
            });
            rightTotalScoreSpan.textContent = '0';
        }

        buildRightPanel();
        calcScoreBtn.addEventListener('click', calculateScore);
        clearAllBtn.addEventListener('click', clearAllSelections);
    })();
</script>
</body>
</html>
