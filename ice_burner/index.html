/* 生成 build.slots 的复合 key：left|上衣 / right|上衣 严格区分左右同名部位 */
function slotKey(side, part) { return side + "|" + part; }

function openPickModal(part, side) {
  pickContext = { part, side };
  const sideLabel = side === "left" ? "左服装" : "右饰品";
  document.getElementById("pickTitle").textContent = `选${sideLabel} - ${part}`;
  // 列出该 side 含该部位的套装
  const list = state.periods.filter(p => {
    const sd = side === "left" ? p.left : p.right;
    return sd && sd[part] !== undefined;
  });
  const body = document.getElementById("pickBody");
  const build = currentBuild();
  const key = slotKey(side, part);
  const curPid = build.slots[key];
  const curPeriod = curPid ? state.periods.find(p => p.id === curPid) : null;
  let html = "";

  // 若该格已有装备：在顶部显示当前装备的该部位属性明细
  if (curPeriod) {
    const curSd = side === "left" ? curPeriod.left : curPeriod.right;
    const curAttrs = (curSd[part] || []).map(a => {
      const label = a.attrId ? attrLabel(a.attrId) : (a.raw || "");
      const v = a.value !== null ? ` ${a.value > 0 ? "+" : ""}${a.value}%` : "";
      return `${label}${v}`;
    }).join(" · ");
    const curName = curPeriod.shortName && curPeriod.shortName !== curPeriod.name
      ? `${escapeHtml(curPeriod.name)} <span class="pick-short">(${escapeHtml(curPeriod.shortName)})</span>`
      : escapeHtml(curPeriod.name);
    html += `<div class="pick-current">
      <div style="font-size:12px;color:var(--accent);margin-bottom:4px;">当前装备</div>
      <div class="pick-item-row" style="display:flex;align-items:center;gap:8px;">
        <div class="pcolor" style="background:${curPeriod.color};width:8px;height:8px;border-radius:2px;"></div>
        <div class="pname">${curName}</div>
        <div class="pattrs" style="margin-left:auto;">${curAttrs || "无属性"}</div>
      </div>
    </div>
    <hr style="border:none;border-top:1px dashed var(--border);margin:10px 0;">`;
  }

  if (list.length === 0) {
    html += `<p style="color:var(--text-dim);text-align:center;padding:20px;">没有含${sideLabel}「${part}」的套装，请先录入</p>`;
  } else {
    // 每行一个：色块 + 全称(简称) + 该套在该部位的属性数值明细
    html += `<div class="pick-list pick-list-vertical">` +
      list.map(p => {
        const sd = side === "left" ? p.left : p.right;
        const attrs = (sd[part] || []).map(a => {
          const label = a.attrId ? attrLabel(a.attrId) : (a.raw || "");
          const v = a.value !== null ? ` ${a.value > 0 ? "+" : ""}${a.value}%` : "";
          return `${label}${v}`;
        }).join(" · ");
        const nameDisplay = p.shortName && p.shortName !== p.name
          ? `${escapeHtml(p.name)} <span class="pick-short">(${escapeHtml(p.shortName)})</span>`
          : escapeHtml(p.name);
        return `
          <div class="pick-item pick-item-row${p.id === curPid ? " pick-current-selected" : ""}" onclick="pickPeriod('${p.id}')">
            <div class="pcolor" style="background:${p.color}"></div>
            <div class="pick-text">
              <div class="pname">${nameDisplay}</div>
              <div class="pattrs">${attrs || "无属性"}</div>
            </div>
          </div>`;
      }).join("") + `</div>`;
  }
  body.innerHTML = html;
  document.getElementById("pickClearBtn").style.display = curPid ? "" : "none";
  openModal("pickMask");
}

/* 清理 activatedSets：移除已删除套装 + 件数不足触发阈值的套装
   （换散件后某套件数不够，它的套装效果本来就不生效，不该占激活名额） */
function cleanActivatedSets(build) {
  // 统计右栏各套装穿着件数
  const wornMap = {};
  RIGHT_PARTS.forEach(rp => {
    const pid = build.slots[slotKey("right", rp)];
    if (pid) wornMap[pid] = (wornMap[pid] || 0) + 1;
  });
  build.activatedSets = build.activatedSets.filter(id => {
    // 套装已删除 → 移除
    const p = state.periods.find(x => x.id === id);
    if (!p) return false;
    // 取最小触发阈值
    const minNeed = p.setRight && p.setRight.length
      ? Math.min(...p.setRight.map(b => b.need || 2))
      : 2;
    // 穿着件数 < 阈值 → 不生效，移除
    return (wornMap[id] || 0) >= minNeed;
  });
  if (build.activatedSets.length > 3) build.activatedSets = build.activatedSets.slice(0, 3);
}

function pickPeriod(pid) {
  if (!pickContext) return;
  const build = currentBuild();
  // 用复合 key 严格按 side 区分，左边选择绝不影响右边
  build.slots[slotKey(pickContext.side, pickContext.part)] = pid;
  // 换散件后清理：件数不足阈值的套装自动移出激活列表，腾出名额
  cleanActivatedSets(build);
  saveState();
  closeModal("pickMask");
  renderAll();
}

function clearPickSlot() {
  if (!pickContext) return;
  const build = currentBuild();
  delete build.slots[slotKey(pickContext.side, pickContext.part)];
  if (build.magicStones) delete build.magicStones[slotKey(pickContext.side, pickContext.part)];
  cleanActivatedSets(build);
  saveState();
  closeModal("pickMask");
  renderAll();
}

/* ============================================================
   十四、套装效果激活弹窗
============================================================ */

/* 查看当前已选套装的所有属性（左5件套装属性 + 右饰品套装属性）
   - 左侧一列：左5件同套时显示左套装效果（取消单件属性显示）
   - 右侧一列：显示所有右饰品套装（含穿着件数/激活状态/件数达标高亮） */
function openSetAttrModal() {
  const build = currentBuild();
  const body = document.getElementById("setAttrBody");
  // —— 左5件套装 ——
  const leftPeriodId = build.slots[slotKey("left", "发型")];
  const leftPeriod = leftPeriodId ? state.periods.find(p => p.id === leftPeriodId) : null;
  const leftAllSame = leftPeriod && LEFT_PARTS.every(lp => build.slots[slotKey("left", lp)] === leftPeriodId);

  // 左栏 HTML：只显示左套装效果（取消单件属性）
  let leftHtml = `<h4 style="color:var(--accent);margin-bottom:8px;">左5件套装属性</h4>`;
  if (leftPeriod && leftAllSame) {
    leftHtml += `<div style="font-size:13px;font-weight:600;margin-bottom:8px;">${escapeHtml(leftPeriod.name)} <span style="color:var(--text-dim);font-weight:400;">(${escapeHtml(leftPeriod.shortName || leftPeriod.name)})</span></div>`;
    if (leftPeriod.setLeft && leftPeriod.setLeft.length) {
      leftPeriod.setLeft.forEach(b => {
        leftHtml += `<div style="margin-bottom:8px;padding-left:8px;border-left:2px solid var(--accent);">`;
        leftHtml += `<div style="font-size:11px;color:var(--accent);margin-bottom:2px;">${b.need}件 ✓</div>`;
        (b.effects || []).forEach(a => {
          const label = a.attrId ? attrLabel(a.attrId) : (a.raw || "");
          const v = a.value !== null ? ` ${a.value > 0 ? "+" : ""}${a.value}%` : "（描述）";
          leftHtml += `<div style="font-size:12px;padding-left:8px;">${label}${v}</div>`;
        });
        leftHtml += `</div>`;
      });
    } else {
      leftHtml += `<p style="color:var(--text-dim);font-size:12px;">该套装没有设置左套装效果</p>`;
    }
  } else {
    leftHtml += `<p style="color:var(--text-dim);font-size:12px;">左5件未穿同一套</p>`;
  }

  // 右栏 HTML：所有右饰品套装（逻辑不变，高亮已激活套装属性）
  let rightHtml = `<h4 style="color:var(--accent);margin-bottom:8px;">右饰品套装属性</h4>`;
  const rightWorn = {};
  RIGHT_PARTS.forEach(rp => {
    const pid = build.slots[slotKey("right", rp)];
    if (pid) rightWorn[pid] = (rightWorn[pid] || 0) + 1;
  });
  const rightPeriodIds = Object.keys(rightWorn);
  if (!rightPeriodIds.length) {
    rightHtml += `<p style="color:var(--text-dim);font-size:12px;">右栏未穿戴任何套装</p>`;
  } else {
    rightPeriodIds.forEach(pid => {
      const p = state.periods.find(x => x.id === pid);
      if (!p) return;
      const worn = rightWorn[pid];
      const active = build.activatedSets.includes(pid);
      rightHtml += `<div style="margin-bottom:12px;padding:8px;border-radius:6px;background:rgba(0,0,0,0.025);border:1px solid ${active ? 'var(--accent)' : 'var(--border)'};${active ? 'box-shadow:0 0 0 1px var(--accent);' : ''}">`;
      rightHtml += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">`;
      rightHtml += `<span style="font-size:13px;font-weight:600;">${escapeHtml(p.name)} <span style="color:var(--text-dim);font-weight:400;">(${escapeHtml(p.shortName || p.name)})</span></span>`;
      rightHtml += `<span style="font-size:11px;color:${active ? 'var(--accent)' : 'var(--text-faint)'};">${active ? '已激活' : '未激活'} · ${worn}件</span>`;
      rightHtml += `</div>`;
      if (p.setRight && p.setRight.length) {
        p.setRight.forEach(b => {
          const met = worn >= b.need;
          rightHtml += `<div style="margin-bottom:4px;padding-left:8px;border-left:2px solid ${met ? 'var(--accent)' : 'var(--border)'};">`;
          rightHtml += `<div style="font-size:11px;color:${met ? 'var(--accent)' : 'var(--text-faint)'};">${b.need}件${met ? ' ✓' : '（未达）'}</div>`;
          (b.effects || []).forEach(a => {
            const label = a.attrId ? attrLabel(a.attrId) : (a.raw || "");
            const v = a.value !== null ? ` ${a.value > 0 ? "+" : ""}${a.value}%` : "（描述）";
            rightHtml += `<div style="font-size:12px;padding-left:8px;color:${active && met ? 'var(--text)' : 'var(--text-faint)'};">${label}${v}</div>`;
          });
          rightHtml += `</div>`;
        });
      }
      rightHtml += `</div>`;
    });
  }

  // 两列布局
  body.innerHTML = `
    <div class="cmp-cols">
      <div class="cmp-col">
        ${leftHtml}
      </div>
      <div class="cmp-col">
        ${rightHtml}
      </div>
    </div>
  `;
  openModal("setAttrMask");
}

function openActivateModal() {
  const build = currentBuild();
  // 打开前先清理一次，确保激活列表里都是件数达标的套装
  cleanActivatedSets(build);
  saveState();
  const body = document.getElementById("activateBody");
  const wornMap = {};  // periodId -> 件数
  RIGHT_PARTS.forEach(rp => {
    const pid = build.slots[slotKey("right", rp)];
    if (pid) wornMap[pid] = (wornMap[pid] || 0) + 1;
  });
  const wornList = Object.keys(wornMap).map(pid => {
    const p = state.periods.find(x => x.id === pid);
    return p ? { period: p, count: wornMap[pid] } : null;
  }).filter(Boolean);

  if (wornList.length === 0) {
    body.innerHTML = `<p style="color:var(--text-dim);text-align:center;padding:20px;">还没有穿戴任何右套装</p>`;
    openModal("activateMask");
    return;
  }
  body.innerHTML = `<div class="activate-list">` + wornList.map(({ period, count }) => {
    // 取最小触发阈值
    const minNeed = period.setRight && period.setRight.length ? Math.min(...period.setRight.map(b => b.need || 2)) : 2;
    const canActivate = count >= minNeed;
    const isChecked = build.activatedSets.includes(period.id);
    const disabled = !canActivate;
    return `
      <div class="activate-item ${isChecked ? 'checked' : ''} ${disabled ? 'disabled' : ''}"
           onclick="${disabled ? '' : `toggleActivate('${period.id}')`}">
        <div class="acheck"></div>
        <div class="ainfo">
          <div class="aname">${escapeHtml(period.name)}</div>
          <div class="ameta">穿着 ${count} 件 · 触发阈值 ${minNeed} 件</div>
        </div>
      </div>`;
  }).join("") + `</div>`;
  openModal("activateMask");
}

function toggleActivate(pid) {
  const build = currentBuild();
  const idx = build.activatedSets.indexOf(pid);
  if (idx >= 0) {
    build.activatedSets.splice(idx, 1);
  } else {
    if (build.activatedSets.length >= 3) { toast("最多激活3套", "error"); return; }
    build.activatedSets.push(pid);
  }
  saveState();
  openActivateModal();
  renderAttrPanel();
  renderRightCol();
}

/* 渲染部位卡片 */
function renderDraftParts(containerId, side, parts) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  // 已使用的部位（用于右部件下拉过滤）
  const usedRight = new Set(Object.keys(entryDraft.right));
  parts.forEach(part => {
    const card = document.createElement("div");
    card.className = "part-card";
    const attrs = entryDraft[side][part] || [];
    let partHeader;
    if (side === "left") {
      // 左5件固定：用静态文本，不可改名
      partHeader = `<span class="ptitle">${escapeHtml(part)}</span>`;
    } else {
      // 右部件：用下拉选择，选项 = 当前已选 + 未用的部位（已用部位直接不显示）
      const optsHtml = RIGHT_PARTS
        .filter(rp => rp === part || !usedRight.has(rp))
        .map(rp => `<option value="${escapeHtml(rp)}" ${rp === part ? "selected" : ""}>${escapeHtml(rp)}</option>`)
        .join("");
      partHeader = `
        <select class="input" style="width:120px;background:#ffffff;color:var(--text);"
                onchange="renamePart('right','${escapeHtml(part)}',this.value)">
          ${optsHtml}
        </select>
      `;
    }
    card.innerHTML = `
      <div class="part-card-head">
        ${partHeader}
        ${side === "right" ? `<button class="btn btn-ghost btn-icon" onclick="removeRightPart('${escapeHtml(part)}')" title="删除">×</button>` : ""}
      </div>
      <div class="attr-lines">
        ${attrs.map((a, i) => attrLineHtml(side, part, i, a)).join("")}
      </div>
      <button class="btn btn-ghost" style="margin-top:6px;font-size:12px;" onclick="addAttr('${side}','${escapeHtml(part)}')">+ 添加属性</button>
    `;
    wrap.appendChild(card);
  });
}

/* 单行属性行 HTML（百分号固定不可编辑） */
function attrLineHtml(side, part, i, a) {
  // 收集当前 part 下其他行已选的 attrId（冲突词条直接从选项里删掉，不显示）
  const usedIds = (entryDraft[side][part] || [])
    .map((x, idx) => idx !== i ? x.attrId : null)
    .filter(x => x);
  const opts = ATTR_DICT
    .filter(at => !usedIds.includes(at.id) || a.attrId === at.id)   // 本行已选的保留，其余冲突的不显示
    .map(at => `<option value="${at.id}" ${a.attrId === at.id ? "selected" : ""}>${attrLabel(at.id)}</option>`)
    .join("");
  return `
    <div class="attr-line">
      <select onchange="updateAttr('${side}','${escapeHtml(part)}',${i},'attrId',this.value)">
        <option value="">(无)</option>${opts}
      </select>
      <input type="number" step="any" min="0" value="${a.value === null ? "" : a.value}" placeholder="数值"
             oninput="updateAttr('${side}','${escapeHtml(part)}',${i},'value',this.value === '' ? null : Math.max(0, Number(this.value)))">
      <span class="unit-fixed">%</span>
      <button class="line-del" onclick="delAttr('${side}','${escapeHtml(part)}',${i})">×</button>
    </div>`;
}

/* 渲染套装效果档位 */
function renderDraftBonus(containerId, key) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  const list = entryDraft[key] || [];
  list.forEach((bonus, i) => {
    const block = document.createElement("div");
    block.className = "bonus-block";
    block.innerHTML = `
      <div class="bonus-head">
        <span class="blabel">需要</span>
        <input type="number" class="need-input" value="${bonus.need}" min="1" onchange="updateBonus('${key}',${i},'need',Number(this.value))">
        <span class="blabel">件触发</span>
        <button class="btn btn-ghost btn-icon" style="margin-left:auto;" onclick="delBonus('${key}',${i})" title="删除档位">×</button>
      </div>
      <div>
        ${(bonus.effects || []).map((a, j) => attrLineHtmlBonus(key, i, j, a)).join("")}
      </div>
      <button class="btn btn-ghost" style="margin-top:6px;font-size:12px;" onclick="addBonusAttr('${key}',${i})">+ 添加效果</button>

}

/* 套装效果属性行（百分号固定不可编辑） */
function attrLineHtmlBonus(key, i, j, a) {
  // 收集当前 bonus 下其他行已选的 attrId（冲突词条直接从选项里删掉，不显示）
  const usedIds = ((entryDraft[key] || [])[i]?.effects || [])
    .map((x, idx) => idx !== j ? x.attrId : null)
    .filter(x => x);
  const opts = ATTR_DICT
    .filter(at => !usedIds.includes(at.id) || a.attrId === at.id)
    .map(at => `<option value="${at.id}" ${a.attrId === at.id ? "selected" : ""}>${attrLabel(at.id)}</option>`)
    .join("");
  return `
    <div class="attr-line">
      <select onchange="updateBonusAttr('${key}',${i},${j},'attrId',this.value)">
        <option value="">(无)</option>${opts}
      </select>
      <input type="number" step="any" min="0" value="${a.value === null ? "" : a.value}" placeholder="数值"
             oninput="updateBonusAttr('${key}',${i},${j},'value',this.value === '' ? null : Math.max(0, Number(this.value)))">
      <span class="unit-fixed">%</span>
      <button class="line-del" onclick="delBonusAttr('${key}',${i},${j})">×</button>

/* —— 录入弹窗操作 —— */
function addAttr(side, part) {
  entryDraft[side][part] = entryDraft[side][part] || [];
  entryDraft[side][part].push(makeAttr());
  renderDraftParts(side === "left" ? "leftParts" : "rightParts", side, Object.keys(entryDraft[side]));
}
function updateAttr(side, part, i, field, val) {
  if (!entryDraft[side][part]) return;
  // 数值字段强制 ≥0（无负数属性）
  if (field === "value" && val !== null) val = Math.max(0, val);
  entryDraft[side][part][i][field] = val;
  entryDraft[side][part][i].raw = `${findAttr(val)?.label || ""} ${val}`;
}
function delAttr(side, part, i) {
  entryDraft[side][part].splice(i, 1);
  renderDraftParts(side === "left" ? "leftParts" : "rightParts", side, Object.keys(entryDraft[side]));
}
function addRightPart() {
  // 找第一个还没添加的右部件（按 RIGHT_PARTS 顺序）
  const cand = RIGHT_PARTS.find(p => !entryDraft.right[p]);
  if (!cand) { toast("右部件已全部添加", "error"); return; }
  // 新增部位初始自带一条待编辑的属性词条
  entryDraft.right[cand] = [makeAttr()];
  renderDraftParts("rightParts", "right", Object.keys(entryDraft.right));
}
function removeRightPart(part) {
  delete entryDraft.right[part];
  renderDraftParts("rightParts", "right", Object.keys(entryDraft.right));
}
function renamePart(side, oldName, newName) {
  if (!newName || oldName === newName) return;
  entryDraft[side][newName] = entryDraft[side][oldName] || [];
  delete entryDraft[side][oldName];
  renderDraftParts(side === "left" ? "leftParts" : "rightParts", side, Object.keys(entryDraft[side]));
}
function addBonus(key) {
  entryDraft[key] = entryDraft[key] || [];
  // 默认 n 取已有档位里没用过的最小值（2、3、4...），保证多个档位 n 不相同
  const usedNeeds = new Set(entryDraft[key].map(b => Number(b.need) || 0));
  let n = 2;
  while (usedNeeds.has(n)) n++;
  // 新增档位初始自带一条待编辑的属性词条
  entryDraft[key].push({ need: n, effects: [makeAttr()] });
  renderDraftBonus(key === "setLeft" ? "leftBonus" : "rightBonus", key);
}
function delBonus(key, i) {
  entryDraft[key].splice(i, 1);
  renderDraftBonus(key === "setLeft" ? "leftBonus" : "rightBonus", key);
}
function updateBonus(key, i, field, val) {
  entryDraft[key][i][field] = val;
}
function addBonusAttr(key, i) {
  entryDraft[key][i].effects = entryDraft[key][i].effects || [];
  entryDraft[key][i].effects.push(makeAttr());
  renderDraftBonus(key === "setLeft" ? "leftBonus" : "rightBonus", key);
}
function updateBonusAttr(key, i, j, field, val) {
  // 数值字段强制 ≥0（无负数属性）
  if (field === "value" && val !== null) val = Math.max(0, val);
  entryDraft[key][i].effects[j][field] = val;
}
function delBonusAttr(key, i, j) {
  entryDraft[key][i].effects.splice(j, 1);
  renderDraftBonus(key === "setLeft" ? "leftBonus" : "rightBonus", key);
}

/* 确认入库 */
function savePeriodFromEntry() {
  const nameInput = document.getElementById("draftName");
  const shortInput = document.getElementById("draftShortName");
  const colorInput = document.getElementById("draftColor");
  if (nameInput) entryDraft.name = nameInput.value.trim();
  if (shortInput) entryDraft.shortName = shortInput.value.trim();
  if (colorInput) entryDraft.color = colorInput.value;
  // 简称为空时默认用全称
  if (!entryDraft.shortName) entryDraft.shortName = entryDraft.name;
  if (!entryDraft.name || !entryDraft.name.trim()) { toast("请填套装全称", "error"); return; }
  // 兜底：左部位强制只保留左五件，多余的一律移到右边饰品
  Object.keys(entryDraft.left).forEach(k => {
    if (!LEFT_PARTS.includes(k)) {
      if (!entryDraft.right[k]) entryDraft.right[k] = entryDraft.left[k];
      delete entryDraft.left[k];
    }
  });
  if (editingPeriodId) {
    const idx = state.periods.findIndex(p => p.id === editingPeriodId);
    if (idx >= 0) state.periods[idx] = entryDraft;
  } else {
    state.periods.push(entryDraft);
  }
  saveState();
  closeModal("entryMask");
  entryDraft = null;
  editingPeriodId = null;
  renderAll();
  toast("已保存", "success");
}

/* ============================================================
   十六、OCR 识别与解析
============================================================ */

let ocrImageFile = null;
function onOcrPick(e) {
  const f = e.target.files[0];
  if (f) doOcr(f);
}

async function runOcr() {
  if (!ocrImageFile) { toast("请先选择图片", "error"); return; }
  await doOcr(ocrImageFile);
}

async function doOcr(file) {
  ocrImageFile = file;
  const preview = document.getElementById("ocrPreview");
  const raw = document.getElementById("ocrRaw");
  const status = document.getElementById("ocrStatus");
  const btn = document.querySelector('button.btn-primary[onclick="runOcr()"]')
           || document.querySelector('button[onclick="runOcr()"]');
  // 预览
  const reader = new FileReader();
  reader.onload = e => { preview.src = e.target.result; preview.classList.add("show"); };
  reader.readAsDataURL(file);
  raw.classList.remove("show");
  // 禁用按钮防重复点
  if (btn) btn.disabled = true;
  // 友好的进度提示（AI 模式下大模型推理慢，避免误以为卡死）
  let dots = 0;
  status.textContent = "识别中，请稍候";
  const dotTimer = setInterval(() => {
    dots = (dots + 1) % 4;
    const suffix = ".".repeat(dots) + " ".repeat(3 - dots);
    status.textContent = (state.settings.ocrMode === "api"
      ? "AI 推理中，请耐心等待" + suffix
      : "本地 OCR 识别中" + suffix);
  }, 600);
  let text = "";
  try {
    if (state.settings.ocrMode === "api") {
      text = await ocrByApi(file);
    } else {
      text = await ocrByLocal(file);
    }
  } catch (e) {
    clearInterval(dotTimer);
    status.textContent = "识别失败：" + e.message;
    if (btn) btn.disabled = false;
    toast("识别失败", "error");
    return;
  }
  clearInterval(dotTimer);
  if (btn) btn.disabled = false;
  status.textContent = `识别完成（${text.length}字）`;
  raw.textContent = text;
  raw.classList.add("show");
  // 先清空 entryDraft 里已有属性（无论是本地还是大模型解析，都是重新录入）
  ["left", "right"].forEach(side => {
    if (entryDraft[side]) {
      Object.keys(entryDraft[side]).forEach(part => { entryDraft[side][part] = []; });
    }
  });
  entryDraft.setLeft = [];
  entryDraft.setRight = [];
  // 解析并填入草稿（根据设置选择本地正则 or 大模型，大模型失败自动回退本地）
  let parseSource = "";   // 记录实际用了哪种解析方式，用于 toast 提示
  let apiResultText = ""; // 大模型返回原文（渲染后恢复显示）
  try {
    if (state.settings.parseMode === "api") {
      status.textContent = "大模型解析中，请稍候（超时将自动用本地解析）...";
      try {
        apiResultText = await parseOcrByApi(text);
        parseSource = "大模型";
      } catch (apiErr) {
        console.warn("[大模型解析失败，回退本地]", apiErr.message);
        toast("大模型解析失败：" + apiErr.message + "，已自动用本地解析", "error");
        parseOcrToDraft(text);
        parseSource = "本地正则";
      }
    } else {
      parseOcrToDraft(text);
      parseSource = "本地正则";
    }
    renderEntryBody();
    // 渲染后恢复 OCR 识别文字 + 大模型返回内容（renderEntryBody 会清空 ocrRaw）
    const rawEl = document.getElementById("ocrRaw");
    if (rawEl && text) {
      let displayText = text;
      if (apiResultText) {
        displayText += "\n\n—— 大模型解析返回 ——\n" + apiResultText;
      }
      rawEl.textContent = displayText;
      rawEl.classList.add("show");
    }
    // 统计解析到了多少条属性，方便用户判断是否解析成功
    let totalAttrs = 0;
    ["left", "right"].forEach(s => {
      Object.values(entryDraft[s] || {}).forEach(arr => { totalAttrs += (arr || []).length; });
    });
    totalAttrs += (entryDraft.setLeft || []).reduce((n, b) => n + (b.effects || []).length, 0);
    totalAttrs += (entryDraft.setRight || []).reduce((n, b) => n + (b.effects || []).length, 0);
    if (totalAttrs > 0) {
      toast(`${parseSource}解析成功（${totalAttrs}条属性）`, "success");
    } else {
      toast("识别完成但未匹配到属性，请检查识别文字格式", "error");
    }
  } catch (e) {
    console.error("[OCR解析错误]", e);
    toast("解析出错：" + e.message, "error");
  }
}

/* 本地 Tesseract.js OCR */
async function ocrByLocal(file) {
  if (typeof Tesseract === "undefined") throw new Error("Tesseract.js 未加载");
  const lang = state.settings.lang || "chi_sim";
  const result = await Tesseract.recognize(file, lang, {
    logger: m => {
      const status = document.getElementById("ocrStatus");
      if (status && m.status === "recognizing text") {
        status.textContent = `识别中... ${Math.round(m.progress * 100)}%`;
      }
    }
  });
  return result.data.text || "";
}

/* 大模型 API 模式（180 秒超时，避免无限卡住） */
async function ocrByApi(file) {
  const url = state.settings.apiProxyUrl;
  if (!url) throw new Error("未配置 API 代理 URL");
  if (!state.settings.apiKey) throw new Error("未填 API Key，请到「设置」里填入");
  const b64 = await fileToBase64(file);
  // AbortController 实现 fetch 超时
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 180000);   // 180 秒
  let resp;
  try {
    resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        image: b64,
        apiKey: state.settings.apiKey,
        apiUrl: state.settings.apiUrl,
        model: state.settings.model
      }),
      signal: controller.signal
    });
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === "AbortError") throw new Error("请求超时（180秒），请检查 API Key 是否有效、网络是否可达");
    throw new Error("网络请求失败：" + e.message + "（确认 exe 已启动）");
  }
  clearTimeout(timeoutId);
  if (!resp.ok) {
    // 尝试读取错误详情
    let detail = "";
    try { detail = (await resp.json()).detail || ""; } catch (_) {}
    throw new Error("API 返回 " + resp.status + (detail ? "：" + detail : ""));
  }
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data.text || "";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* 大模型解析模式：把 OCR 识别出的文字发给大模型，返回结构化 JSON 后填入 entryDraft */
async function parseOcrByApi(text) {
  const url = state.settings.apiProxyUrl;
  if (!url) throw new Error("未配置 API 代理 URL");
  if (!state.settings.apiKey) throw new Error("未填 API Key，请到「设置」里填入");
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 120000);   // 120 秒（超时回退本地解析）
  let resp;
  try {
    resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: text,
        apiKey: state.settings.apiKey,
        apiUrl: state.settings.apiUrl,
        model: state.settings.model
      }),
      signal: controller.signal
    });
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === "AbortError") throw new Error("解析超时（120秒）");
    throw new Error("网络请求失败：" + e.message);
  }
  clearTimeout(timeoutId);
  if (!resp.ok) {
    let detail = "";
    try { detail = (await resp.json()).detail || ""; } catch (_) {}
    throw new Error("API 返回 " + resp.status + (detail ? "：" + detail : ""));
  }
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  const resultText = data.text || "";

  // 把大模型返回原文显示到 OCR 文字区下方（exe 无 F12，方便排查）
  const debugLine = document.getElementById("ocrRaw");
  if (debugLine) {
    debugLine.textContent += "\n\n—— 大模型解析返回 ——\n" + resultText;
  }
  // 解析逐行格式：位置|attrId|数值
  applyParsedLinesToDraft(resultText);
  return resultText;   // 返回原文，供 doOcr 显示
}

/* 把大模型返回的逐行格式填入 entryDraft
   每行格式：位置|attrId|数值
   位置：单件部位名（发型/上衣/.../戒指）、通用（所有左部位）、左套装N件、右套装N件
*/
function applyParsedLinesToDraft(text) {
  if (!text) return;
  const LEFT_PARTS = ["发型", "上衣", "下衣", "手套", "鞋子"];
  const RIGHT_PARTS = ["武器", "武饰", "辅助", "脸上", "脸中", "脸下", "手臂", "耳环", "项链", "戒指"];
  const validAttrIds = new Set([
    "phys_atk", "mag_atk", "crit_rate", "crit_dmg", "maximize", "polarity", "adapt",
    "hp", "mp", "p2_skill_dmg", "p3_skill_dmg", "all_skill_dmg", "cd_reduce",
    "mp_cost_reduce", "boss_dmg", "dot_dmg", "high_hp_dmg", "low_hp_dmg", "hp100_dmg",
    "move_speed", "jump_power", "dmg_reduce", "all_dmg"
  ]);

  const lines = text.split(/\r?\n/);
  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    // 跳过可能的标题/说明行（不含 | 的行忽略）
    const parts = line.split("|").map(s => s.trim());
    if (parts.length < 3) continue;
    const [pos, attrId, valStr] = parts;
    if (!validAttrIds.has(attrId)) continue;
    const value = parseFloat(valStr);
    if (isNaN(value)) continue;

    const attr = makeAttr(attrId, value, "%", false);

    // 套装档位：左套装N件 / 右套装N件
    const setMatch = pos.match(/^(左|右)套装\s*(\d+)\s*件$/);
    if (setMatch) {
      const side = setMatch[1] === "左" ? "setLeft" : "setRight";
      const need = parseInt(setMatch[2], 10);
      let bonus = entryDraft[side].find(b => b.need === need);
      if (!bonus) {
        bonus = { need, effects: [] };
        entryDraft[side].push(bonus);
      }
      bonus.effects.push(attr);
      continue;
    }

    // 通用 → 所有左部位
    if (pos === "通用") {
      LEFT_PARTS.forEach(p => {
        if (!entryDraft.left[p]) entryDraft.left[p] = [];
        entryDraft.left[p].push(attr);
      });
      continue;
    }

    // 单件部位
    let side = null, part = pos;
    if (LEFT_PARTS.includes(pos)) side = "left";
    else if (RIGHT_PARTS.includes(pos)) side = "right";
    if (side) {
      if (!entryDraft[side][part]) entryDraft[side][part] = [];
      entryDraft[side][part].push(attr);
    }
  }
}

/* —— OCR 文本解析逻辑 ——
   规则：
   1. 全角冒号→半角，全角空格→半角，压缩多余空格，按行遍历
   2. 检测段落标题"单件效果"/"套装效果"，可能带"左/右"也可能不带
   3. 不带左/右时按出现顺序：第一次单件→左，第一次套装→左套装，第二次→右，第二次右套装
   4. 部位名自动判定左右：发型/上衣/下衣/手套/鞋子→左，其他→右
   5. N件 格式灵活匹配：2件: -2件: *2件 2 件 都能认，不要求冒号
   6. * 前缀的效果行有兜底逻辑，归入最近的套装档位
   7. 续行（没有N件前缀的行）自动追加到当前 bonus
*/
function parseOcrToDraft(rawText) {
  // 注：entryDraft 的清空已统一在 doOcr() 中处理，此处不再重复清空
  // 1. 预处理
  //    - 全角冒号→半角，全角空格→半角，压缩多余空格
  //    - 去除 AI 可能添加的 markdown 代码块标记（```）
  //    - 去除 AI 可能添加的说明性前缀（"好的"、"以下是"、"图片中的文字"等）
  let text = rawText
    .replace(/```[a-zA-Z]*\n?/g, "")       // 去除 ``` 和 ```lang
    .replace(/```/g, "")                      // 去除残留的 ```
    .replace(/：/g, ":")                       // 全角冒号→半角
    .replace(/％/g, "%")                       // 全角百分号→半角
    .replace(/　/g, " ")                       // 全角空格→半角
    .replace(/[ \t]+/g, " ")
    .trim();
  // 去除开头的 AI 说明性前缀（只去掉前几行里的说明文字，不动正文）
  const preambleRegex = /^(好的|以下|这是|图片中的|识别结果|文字内容|：|:)[\s\S]{0,30}?[\n\r]/;
  text = text.replace(preambleRegex, "").trim();
  const lines = text.split(/\r?\n/).map(l => {
    // 去除行首的 bullet 符号：- • · * ＊ 等（但保留数字，避免破坏"3件"档位行）
    return l.replace(/^[\s\-•·*＊]+/, "").trim();
  }).filter(Boolean);

  // 2. 段落扫描
  let currentSide = null;     // "left" | "right"
  let currentMode = null;     // "single" | "bonus"
  let singleCount = 0;        // 不带左/右时的单件效果出现次数
  let bonusCount = 0;
  let currentPart = null;    // 当前正在追加的部位
  let currentBonus = null;    // 当前正在追加的套装档位
  let pendingAttrId = null;  // 跨行属性合并：记录上一行只匹配到属性名但无数值的 attrId

  /* 把解析出的 attr 推到当前上下文（part 或 bonus），并处理 pending 状态
     - 若 at 是数组（多属性拆分）→ 逐个 push
     - 若 at 只有属性名无数值（isDesc=true） → 记 pending，等下一行补数值
     - 若 at 只有数值无属性名 → 用 pending 补全
     - 其他情况正常 push 并清 pending
     - 去重：同一部位/档位内同 attrId 只保留第一条
     - 单件模式无当前部位时：艾尔之光单件效果5件通用，推送到所有左5件 */
  function pushAttr(at) {
    if (!at) return;
    // 多属性拆分返回数组 → 逐个 push
    if (Array.isArray(at)) { at.forEach(x => pushAttr(x)); return; }
    if (at.attrId && at.value === null && at.isDesc) {
      pendingAttrId = at.attrId;
      return;
    }
    if (!at.attrId && at.value !== null && pendingAttrId) {
      at.attrId = pendingAttrId;
      at.isDesc = false;
      pendingAttrId = null;
    } else if (at.attrId && at.value !== null) {
      pendingAttrId = null;
    }
    if (currentMode === "single") {
      if (currentPart) {
        // 有指定部位：推到该部位
        const ctx = entryDraft[currentSide][currentPart];
        if (ctx && at.attrId && ctx.some(x => x.attrId === at.attrId)) return;
        entryDraft[currentSide][currentPart].push(at);
      } else {
        // 无指定部位：单件效果5件通用 → 推到所有左5件
        LEFT_PARTS.forEach(lp => {
          const ctx = entryDraft.left[lp];
          if (ctx && at.attrId && ctx.some(x => x.attrId === at.attrId)) return;
          if (ctx) ctx.push({ ...at });  // 深拷贝，避免引用共享
        });
      }
    } else if (currentMode === "bonus" && currentBonus) {
      const ctx = currentBonus.effects;
      if (ctx && at.attrId && ctx.some(x => x.attrId === at.attrId)) return;
      currentBonus.effects.push(at);
    }
  }

  for (const line of lines) {
    // 调试：输出每行的处理结果（F12 控制台可看）
    console.log("[OCR行]", JSON.stringify(line));
    // 检测段落标题（支持"单件效果"/"套装效果"/"单件属性"/"套装属性"等写法）
    const hasSingle = /单件效果|单件属性/.test(line);
    const hasBonus  = /套装效果|套装属性/.test(line);
    if (hasSingle && hasBonus) {
      // 复合标题，跳过
      continue;
    }
    if (hasSingle || hasBonus) {
      // 检测左/右
      if (/左/.test(line)) {
        currentSide = "left";
      } else if (/右/.test(line)) {
        currentSide = "right";
      } else {
        // 不带左/右：按出现次数推断
        if (hasSingle) {
          singleCount++;
          currentSide = singleCount === 1 ? "left" : "right";
        } else {
          bonusCount++;
          currentSide = bonusCount === 1 ? "left" : "right";
        }
      }
      currentMode = hasSingle ? "single" : "bonus";
      currentPart = null;
      currentBonus = null;
      pendingAttrId = null;   // 段落切换清空 pending
      continue;
    }

    // 套装档位匹配：支持 "2件" / "2个" / "-2个" / "*2件" 等格式
    const bonusMatch = line.match(/^[*\-]?\s*(\d+)\s*[件个]/) || line.match(/(\d+)\s*[件个]/);
    if (currentMode === "bonus" && bonusMatch) {
      const need = parseInt(bonusMatch[1]);
      const sideKey = currentSide === "left" ? "setLeft" : "setRight";
      entryDraft[sideKey] = entryDraft[sideKey] || [];
      currentBonus = { need, effects: [] };
      entryDraft[sideKey].push(currentBonus);
      pendingAttrId = null;
      // 同行可能还有属性
      const rest = line.replace(bonusMatch[0], "").replace(/^[:：]/, "").trim();
      if (rest) pushAttr(parseAttrLine(rest));
      continue;
    }

    // 部位行：以部位名开头
    // 强制：左部位只能是左五件；其余部位名一律归入右边饰品
    const partHit = detectPartLine(line);
    if (partHit && currentMode === "single") {
      const { part, rest } = partHit;
      const side = LEFT_PARTS.includes(part) ? "left" : "right";
      if (!entryDraft[side][part]) entryDraft[side][part] = [];
      currentPart = part;
      currentSide = side;   // 同步 currentSide，保证后续续行进对地方
      pendingAttrId = null;
      if (rest) pushAttr(parseAttrLine(rest));
      continue;
    }

    // * 前缀的效果行 → 归入最近 bonus（套装档位下的属性）
    const starMatch = line.match(/^\*/);
    if (starMatch) {
      if (currentBonus) {
        pushAttr(parseAttrLine(line.replace(/^\*/, "").trim()));
      } else if (currentMode === "single") {
        // 单件模式下 * 前缀也可能是单件属性
        pushAttr(parseAttrLine(line.replace(/^\*/, "").trim()));
      }
      continue;
    }

    // 续行：追加到当前 part 或 bonus
    if (currentMode === "single" && currentPart) {
      pushAttr(parseAttrLine(line));
      continue;
    }
    if (currentMode === "bonus" && currentBonus) {
      pushAttr(parseAttrLine(line));
      continue;
    }

    // 没有任何上下文的属性行：
    //   1. 先尝试按部位名识别
    //   2. 否则当作单件效果（艾尔之光单件效果无部位名时5件通用）
    if (!currentMode) {
      const partHit2 = detectPartLine(line);
      if (partHit2) {
        const { part, rest } = partHit2;
        // 强制：左部位只能是左五件；其余部位名一律归入右边饰品
        const side = LEFT_PARTS.includes(part) ? "left" : "right";
        if (!entryDraft[side][part]) entryDraft[side][part] = [];
        currentPart = part;
        currentSide = side;
        pendingAttrId = null;
        currentMode = "single";
        if (rest) pushAttr(parseAttrLine(rest));
      } else {
        // 无部位名、无段落标题 → 当作单件效果（推到所有左5件）
        currentMode = "single";
        currentSide = currentSide || "left";
        currentPart = null;
        pushAttr(parseAttrLine(line));
      }
      continue;
    }
  }
  // 调试：输出解析结果
  console.log("[OCR解析结果]", JSON.stringify({
    left: entryDraft.left,
    right: entryDraft.right,
    setLeft: entryDraft.setLeft,
    setRight: entryDraft.setRight
  }, null, 2));
}

/* 检测部位行：返回 {part, rest} 或 null */
function detectPartLine(line) {
  const allParts = [...LEFT_PARTS, ...RIGHT_PARTS];
  // 最长匹配优先
  const sorted = [...allParts].sort((a, b) => b.length - a.length);
  for (const part of sorted) {
    if (line.startsWith(part) || line.startsWith("*" + part)) {
      let rest = line.replace(new RegExp("^\\*?" + part), "").replace(/^[:：]/, "").trim();
      return { part, rest };
    }
  }
  return null;
}

/* 解析单行属性：返回 attr 对象 或 null */
/* 查找一行文本里所有匹配到的属性 alias（用于多属性拆分）
   返回 [{attrId, alias}, ...]，按 alias 长度降序、首次出现位置升序 */
function matchAllAttrs(text) {
  if (!text) return [];
  // 收集所有 alias 并按长度降序
  const all = [];
  ATTR_DICT.forEach(a => a.aliases.forEach(al => all.push({ al, id: a.id })));
  all.sort((x, y) => y.al.length - x.al.length);

  const hits = [];
  let work = text;          // 工作副本：每匹配到一个就从 work 里移除，避免重复
  for (const { al, id } of all) {
    const idx = work.indexOf(al);
    if (idx >= 0) {
      hits.push({ attrId: id, alias: al, pos: idx });
      // 移除已匹配部分，避免重叠
      work = work.slice(0, idx) + " ".repeat(al.length) + work.slice(idx + al.length);
    }
  }
  return hits;
}

function parseAttrLine(line) {
  if (!line) return null;
  // 跳过明显非属性行
  if (/^(单件效果|套装效果|左|右)/.test(line)) return null;

  // 先把所有匹配到的属性名 alias 从文本移除，再在剩余文本里找数值
  const hits = matchAllAttrs(line);

  // 把所有命中 alias 从 line 移除得到 rest（找数值用）
  let rest = line;
  hits.forEach(h => {
    const idx = rest.indexOf(h.alias);
    if (idx >= 0) rest = rest.slice(0, idx) + " " + rest.slice(idx + h.alias.length);
  });
  rest = rest.trim();

  // 在 rest 中找所有带 % 的数字（按出现顺序）
  // 注意：排除条件百分比（后面跟"以上"/"以下"的，如"100%以下"中的100不是属性值）
  const pctNums = [];
  const pctRe = /(-?\d+\.?\d*)\s*%(?!以上|以下)/g;
  let m;
  while ((m = pctRe.exec(rest)) !== null) {
    pctNums.push(Number(m[1]));
  }

  // 无匹配属性 → 仅有数值时记无名属性
  if (hits.length === 0) {
    let value = pctNums[0] ?? null;
    if (value === null) {
      // 退而求其次：找普通数字（排除秒/次/层等单位数字）
      const nm = rest.match(/(-?\d+\.?\d*)\s*(?:$|[^a-zA-Z\u4e00-\u9fa5%秒次层])/);
      value = nm ? Number(nm[1]) : null;
    }
    if (value === null) return null;
    return makeAttr("", value, "%", false, line);
  }

  // 单属性
  if (hits.length === 1) {
    let value = pctNums[0] ?? null;
    if (value === null) {
      const nm = rest.match(/(-?\d+\.?\d*)\s*(?:$|[^a-zA-Z\u4e00-\u9fa5%秒次层])/);
      value = nm ? Number(nm[1]) : null;
    }
    if (value === null) return makeAttr(hits[0].attrId, null, "", true, line);
    return makeAttr(hits[0].attrId, value, "%", false, line);
  }

  // 多属性拆分：按属性在原文中的位置排序，依次分配 rest 里的带%数字
  // 例如 "技能冷却时间减少 2%，技能MP消耗减少 5%"
  //   → hits: [cd_reduce, mp_cost_reduce]，pctNums: [2, 5]
  //   → cd_reduce=2, mp_cost_reduce=5（而不是都取第一个 2）
  const sorted = [...hits].sort((a, b) => a.pos - b.pos);
  return sorted.map((h, i) => {
    let value = pctNums[i] ?? pctNums[pctNums.length - 1] ?? null;
    if (value === null) {
      const nm = rest.match(/(-?\d+\.?\d*)\s*(?:$|[^a-zA-Z\u4e00-\u9fa5%秒次层])/);
      value = nm ? Number(nm[1]) : null;
    }
    return makeAttr(h.attrId, value, "%", false, line);
  });
}

/* ============================================================
   十七、装备库弹窗
============================================================ */

function openLibraryModal() {
  const body = document.getElementById("libraryBody");
  if (state.periods.length === 0) {
    body.innerHTML = `<p style="color:var(--text-dim);text-align:center;padding:30px;">冰装库为空，请先录入</p>`;
    openModal("libraryMask");
    return;
  }
  // 按 state.periods 顺序显示（可拖动排序，新录入的排最后）
  body.innerHTML = state.periods.map(p => {
    // 简化：只列出部位名，不显示属性明细
    const leftParts  = LEFT_PARTS.filter(lp => p.left[lp] && p.left[lp].length);
    const rightParts = Object.keys(p.right).filter(rp => p.right[rp] && p.right[rp].length);
    const leftCnt  = p.setLeft  ? p.setLeft.length  : 0;
    const rightCnt = p.setRight ? p.setRight.length : 0;
    return `
      <div class="lib-item" data-pid="${p.id}">
        <span class="lib-handle" title="拖动排序">✋</span>
        <div class="lib-color" style="background:${p.color}"></div>
        <div class="lib-info">
          <div class="lname">${escapeHtml(p.name)}<span style="color:var(--text-dim);font-weight:400;font-size:12px;margin-left:6px;">（${escapeHtml(p.shortName || p.name)}）</span></div>
          <div class="ldesc">
            <b>左件:</b> ${leftParts.length ? leftParts.join("、") : "空"}
            &nbsp;·&nbsp;
            <b>右件:</b> ${rightParts.length ? rightParts.join("、") : "空"}
            &nbsp;·&nbsp;
            <b>套装效果:</b> 左${leftCnt}档 / 右${rightCnt}档
          </div>
        </div>
        <div class="lib-actions">
          <button class="btn" onclick="openEntryModal('${p.id}')">编辑</button>
          <button class="btn btn-danger" onclick="deletePeriod('${p.id}')">删除</button>
        </div>
      </div>`;
  }).join("");
  bindLibraryDrag(body);
  openModal("libraryMask");
}

/* 冰装库拖拽排序：✋ 手柄拖动，浮动克隆黄色边框，源位置虚影
   用 mousedown/mousemove/mouseup 实现，不依赖 HTML5 DnD（弹窗内滚动时更稳定） */
function bindLibraryDrag(body) {
  let dragging = null;   // { el, clone, offsetY }
  body.querySelectorAll(".lib-handle").forEach(handle => {
    handle.addEventListener("mousedown", e => {
      e.preventDefault();
      const el = handle.closest(".lib-item");
      const rect = el.getBoundingClientRect();
      // 1. 创建浮动克隆（黄框高亮）
      const clone = el.cloneNode(true);
      clone.classList.add("lib-drag-clone");
      clone.style.width = rect.width + "px";
      clone.style.left = rect.left + "px";
      clone.style.top = rect.top + "px";
      document.body.appendChild(clone);
      // 2. 源位置变虚影（保留占位）
      el.classList.add("lib-ghost");
      dragging = { el, clone, offsetY: e.clientY - rect.top };

      const onMove = ev => {
        if (!dragging) return;
        // 克隆跟随鼠标
        dragging.clone.style.top = (ev.clientY - dragging.offsetY) + "px";
        // 按鼠标位置决定虚影插入点：与每个兄弟项中点比较
        const items = [...body.querySelectorAll(".lib-item")].filter(x => x !== dragging.el);
        let inserted = false;
        for (const item of items) {
          const r = item.getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) {
            body.insertBefore(dragging.el, item);
            inserted = true;
            break;
          }
        }
        if (!inserted) body.appendChild(dragging.el);
      };
      const onUp = () => {
        if (!dragging) return;
        // 3. 按 DOM 顺序回写 state.periods
        const order = [...body.querySelectorAll(".lib-item")].map(x => x.dataset.pid);
        state.periods.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        saveState();
        dragging.el.classList.remove("lib-ghost");
        dragging.clone.remove();
        dragging = null;
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        openLibraryModal();   // 重渲染恢复正常样式
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

function deletePeriod(pid) {
  const p = state.periods.find(x => x.id === pid);
  if (!p) return;
  openConfirm("删除套装", `确定删除套装「${escapeHtml(p.name)}」？<br>同时会清理搭配中对该套装的引用。`, () => {
    state.periods = state.periods.filter(x => x.id !== pid);
    // 清理所有 build 中对该 period 的引用（slots 是 left|part / right|part 复合 key）
    // 魔法石按部位槽位保存，不绑定套装，保留不变
    state.builds.forEach(b => {
      Object.keys(b.slots).forEach(key => { if (b.slots[key] === pid) delete b.slots[key]; });
      b.activatedSets = b.activatedSets.filter(id => id !== pid);
    });
    saveState();
    openLibraryModal();
    renderAll();
    toast("已删除", "success");
  });
}

/* 把弹窗里的输入同步到 state.settings 并保存（不关闭弹窗，供失焦/onchange 实时调用） */
function syncSettingsFromInputs() {
  const s = state.settings;
  s.ocrMode = document.getElementById("setOcrMode").value;
  s.parseMode = document.getElementById("setParseMode").value;
  s.apiProxyUrl = document.getElementById("setApiUrl").value.trim() || "http://127.0.0.1:8787/ocr";
  s.apiKey = document.getElementById("setApiKey").value.trim();
  s.apiUrl = document.getElementById("setApiBase").value.trim() || "https://api.siliconflow.cn/v1/chat/completions";
  s.model = document.getElementById("setModel").value.trim() || "Qwen/Qwen3-VL-32B-Instruct";
  s.lang = document.getElementById("setLang").value;
  s.abbrMode = document.getElementById("setAbbrMode").checked;
  saveState();
}

function saveSettings() {
  syncSettingsFromInputs();
  closeModal("settingsMask");
  toast("设置已保存", "success");
  renderAll();
}

/* 测试 API 连通：先保存设置，再请求 /test 端点 */
async function testApiProxy() {
  // 先保存当前所有设置到 state
  const apiProxyUrl = document.getElementById("setApiUrl").value.trim() || "http://127.0.0.1:8787/ocr";
  const apiKey = document.getElementById("setApiKey").value.trim();
  const apiUrl = document.getElementById("setApiBase").value.trim() || "https://api.siliconflow.cn/v1/chat/completions";
  const model = document.getElementById("setModel").value.trim() || "Qwen/Qwen3-VL-32B-Instruct";
  state.settings.apiProxyUrl = apiProxyUrl;
  state.settings.apiKey = apiKey;
  state.settings.apiUrl = apiUrl;
  state.settings.model = model;
  saveState();
  const result = document.getElementById("testApiResult");
  result.style.color = "var(--text-faint)";
  result.textContent = "测试中...";
  if (!apiKey) {
    result.style.color = "#ff6b6b";
    result.textContent = "× 未填 API Key";
    return;
  }
  try {
    // 把 /ocr 替换成 /test，把 apiKey 等加到 query string
    const testBase = apiProxyUrl.replace(/\/ocr\/?$/, "/test").replace(/\/$/, "/test");
    const qs = new URLSearchParams({ apiKey, apiUrl, model }).toString();
    const testUrl = testBase + (testBase.includes("?") ? "&" : "?") + qs;
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 30000);
    const resp = await fetch(testUrl, { signal: controller.signal });
    clearTimeout(tid);
    const data = await resp.json();
    if (data.ok) {
      result.style.color = "var(--accent)";
      result.textContent = "✓ API Key 有效，模型：" + (data.model || "");
    } else {
      result.style.color = "#ff6b6b";
      result.textContent = "× " + (data.reason || "失败");
    }
  } catch (e) {
    result.style.color = "#ff6b6b";
    if (e.name === "AbortError") {
      result.textContent = "× 请求超时（30秒），可能 exe 未启动或网络问题";
    } else {
      result.textContent = "× " + e.message + "（确认 exe 已运行）";
    }
  }
}

/* ============================================================
   二十、备份与还原
============================================================ */

function backupData() {
  // 直接用 state 当前数据导出（不依赖 localStorage）
  const data = JSON.stringify({
    periods: state.periods,
    builds: state.builds,
    currentBuildId: state.currentBuildId,
    settings: state.settings,
    panels: state.panels,
    currentPanelId: state.currentPanelId,
    includePanel: state.includePanel
  }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `elight-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已备份", "success");
}

function restoreData() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async ev => {
      // 二次确认改成内部弹窗
      openConfirm("还原会覆盖当前所有数据，确认继续？", async () => {
        try {
          const data = JSON.parse(ev.target.result);
          state.periods = data.periods || [];
          state.builds = data.builds || [];
          state.currentBuildId = data.currentBuildId || (state.builds[0] && state.builds[0].id);
          state.settings = Object.assign(state.settings, data.settings || {});
          migratePanels(data);   // 兼容旧备份文件的单面板格式
          state.includePanel = data.includePanel || false;
          saveState();   // 自动同步到后端 data.json + localStorage
          renderAll();
          toast("已还原", "success");
        } catch (err) {
          toast("还原失败：" + err.message, "error");
        }
      });
    };
    r.readAsText(f);
  };
  input.click();
}

/* ============================================================
   二十一、初始化
============================================================ */

// 初始化：先异步等数据加载完再渲染（数据从后端 /data 读，避免 localStorage 在 pywebview 中丢失）
(async () => {
  await loadState();
  renderAll();
})();

// 窗口关闭前强制同步保存一次数据（pywebview 的 window.beforeunload 事件）
// 用同步 XMLHttpRequest（不能用 fetch，因为 fetch 是异步的，unload 时会被中断）
window.addEventListener("beforeunload", () => {
  try {
    const payload = JSON.stringify({
      periods: state.periods,
      builds: state.builds,
      currentBuildId: state.currentBuildId,
      settings: state.settings,
      panels: state.panels,
      currentPanelId: state.currentPanelId,
      includePanel: state.includePanel
    });
    // 同步 XHR：阻塞窗口关闭，等保存完成
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/data", false);  // false = 同步
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(payload);
  } catch (e) {
    console.warn("关闭前保存失败：", e);
  }
});
